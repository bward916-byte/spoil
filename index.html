// ============================================================
// Player + reset
// ============================================================
function resetRun(){
  genLevel();
  player = {
    x: 3*T+T/2, y: (18-1)*T+T/2,     // on the street, left end (groundY-1 = 17)
    vx:0, vy:0, onGround:true, climbing:false, tier:2, sneak:false, dir:1,
    stamina:100, spoil:0, picks:3, probes:10, timbers:6, ropesLeft:3,
    lootVal:0, stepT:0, breathT:0, lowT:0, coyote:0, walkPhase:0, prevH:TIERS[2].h,
  };
  exploredSet=new Set(); visSet=new Set();
  rings=[]; floaters=[]; shake=0; gameT=0;
  msgState={text:'',t:0}; lock=null; action=null; tutMsg={text:'',t:0};
  cam={x:player.x, y:player.y};
  stats={ ghost:true, snapped:false, glass:false, collapsed:false, alerted:false, dug:0, picked:0, cause:'' };
}
function msg(t){ msgState={text:t,t:4}; }
function tut(id,text){ if(tutSeen.has(id)) return; tutSeen.add(id); tutMsg={text,t:6}; }
function floater(x,y,text,col){ floaters.push({x,y,text,col:col||PAL.chalk,t:2.2}); }

const GRAV = 900, TERMV = 520, JUMP = 260;
const CLIMB_UP = 44, CLIMB_SIDE = 26;   // slow, deliberate climbing (independent of run speed)

function pTile(){ return [clamp((player.x/T)|0,0,W-1), clamp((player.y/T)|0,0,H-1)]; }
function pcell(){ const [x,y]=pTile(); return idx(x,y); }
function footCell(){ const x=(player.x/T)|0, y=((player.y+TIERS[player.tier].h*0.5+1)/T)|0; return inb(x,y)?idx(x,y):-1; }
function faceCell(){ const x=((player.x+player.dir*14)/T)|0, y=(player.y/T)|0; return inb(x,y)?idx(x,y):-1; }
function belowCell(){ const x=(player.x/T)|0, y=((player.y+8)/T)|0; return inb(x,y)?idx(x,y):-1; }

function onClimb(){
  const c = pcell();
  return climbable(c);
}

function playerUpdate(dt){
  player.tier = player.sneak ? 1 : 2;    // two states only: walk or sneak
  const tier = TIERS[player.tier];
  let ix=0, iy=0;
  if(keys['a']||keys['arrowleft']) ix-=1;
  if(keys['d']||keys['arrowright']) ix+=1;
  if(keys['w']||keys['arrowup']) iy-=1;
  if(keys['s']||keys['arrowdown']) iy+=1;
  if(touch.stickId!=null){                 // fixed thumbstick, axis-priority
    const vx=touch.vec[0], vy=touch.vec[1], ax=Math.abs(vx), ay=Math.abs(vy);
    if(ax>0.34) ix=sign(vx);               // walking is always available
    if(ay>0.5 && ay>ax) iy=sign(vy);       // climb/drop only on a clearly vertical push
  }
  const busy = action && action.type!=='descend';
  if(busy){ ix=0; iy=0; }
  if(ix!==0) player.dir = ix;

  // keep feet planted when the collision box changes height (crouch<->stand):
  // grow/shrink about the feet, never push the box down through the floor.
  const curH = TIERS[player.tier].h;
  if(curH !== player.prevH){
    player.y += (player.prevH - curH) * 0.5;   // feet (y + h/2) stay fixed
    // if growing upward would bury the head in a ceiling, sink back to sit on the floor instead
    const r=7, topY=player.y - curH*0.5;
    for(const ox of [-r, r]){ const tx=((player.x+ox)/T)|0, ty=(topY/T)|0;
      if(inb(tx,ty) && solid(idx(tx,ty))){ player.y = ty*T + T + curH*0.5 + 0.1; break; } }
    player.prevH = curH;
  }

  const c = pcell();
  const climbHere = climbable(c);

  // ---- climbing mode ----
  // Detach by pressing straight left/right (step off onto a floor, or let go and fall).
  if(player.climbing && ix!==0 && iy===0) player.climbing = false;
  // Grab / stay on a ladder or rope only while pushing up or down.
  if(climbHere && iy!==0 && !busy) player.climbing = true;
  if(!climbHere || busy) player.climbing = false;

  if(player.climbing){
    // slow, deliberate — same speed at any tier
    player.vy = iy * CLIMB_UP;
    player.vx = ix * CLIMB_SIDE;
    moveAxis(player.vx*dt, 0);
    moveAxis(0, player.vy*dt);
    player.onGround = groundProbe();
  } else {
    // ---- horizontal (gentle analog ramp) ----
    const target = ix*tier.spd;
    const accel = (Math.abs(target)>Math.abs(player.vx))?620:1200;
    player.vx += clamp(target-player.vx, -accel*dt, accel*dt);
    // ---- gravity ----
    player.vy += GRAV*dt; if(player.vy>TERMV) player.vy=TERMV;
    // jump (up pressed while grounded, and not on a ladder) — a light hop, loud
    if(iy<0 && (player.onGround||player.coyote>0) && !climbHere){
      player.vy = -JUMP; player.onGround=false; player.coyote=0;
      if(tier.base>0){ emitSound((player.x/T)|0,(player.y/T)|0, 6); }
    }
    const wasGround = player.onGround;
    const fallV = player.vy;
    const preFeet = player.y + TIERS[player.tier].h*0.5;
    moveAxis(player.vx*dt, 0);
    moveAxis(0, player.vy*dt);
    // one-way landing: if we dropped onto a ladder rung that's level with a floor, stand on it
    // (walk across ladders). Pushing down starts a climb instead, so this won't trap you.
    if(!player.climbing && player.vy>0 && !(keys['s']||keys['arrowdown']) && !(touch.stickId!=null&&touch.vec[1]>0.5)){
      const h=TIERS[player.tier].h, fx=(player.x/T)|0, ty=((player.y+h*0.5+2)/T)|0;
      if(inb(fx,ty) && !solid(idx(fx,ty)) && climbable(idx(fx,ty)) && atFloorLevel(idx(fx,ty)) && preFeet <= ty*T+3){
        player.y = ty*T - 0.6 - h*0.5; player.vy = 0;   // rest just above the landing, like a floor
      }
    }
    player.onGround = groundProbe();
    if(player.onGround && !wasGround && fallV>260){ sfx.land(); emitSound((player.x/T)|0,(player.y/T)|0, Math.min(14,fallV/40)); }
    if(player.onGround) player.coyote=0.1; else player.coyote=Math.max(0,player.coyote-dt);
  }

  // ---- footsteps (only when actually walking on ground) ----
  const speed=Math.abs(player.vx);
  // walk-cycle animation phase
  if(player.climbing){ player.walkPhase += (Math.abs(player.vy)+Math.abs(player.vx))*dt*0.06; }
  else if(player.onGround && speed>4){ player.walkPhase += speed*dt*0.09; }
  else player.walkPhase += dt*2; // idle sway
  if(player.onGround && speed>tier.spd*0.3 && tier.base>0 && !busy){
    player.stepT-=dt;
    if(player.stepT<=0){
      player.stepT=tier.int;
      const ft = floorType[footCell()] || '=';
      const m = glass.has(footCell())?3.2:(FLOOR_MULT[ft]||1.0);
      const loud=tier.base*m;
      if(loud>0.4){ emitSound((player.x/T)|0,(player.y/T)|0,loud); sfx.step(loud); }
    }
  }

  // ---- loot pickup ----
  for(const l of loot){
    if(l.taken||l.type!=='coin') continue;
    if(Math.hypot(player.x-(l.x*T+T/2), player.y-(l.y*T+T/2))<18){
      l.taken=true; player.lootVal+=l.val; sfx.coin(); msg(`A purse of coin. +${l.val}`);
    }
  }
  // ---- escape ----
  if(grid[pcell()]==='X'){ mode='escaped'; }

  updateAction(dt);
}

// axis-separated collision against solid tiles; returns true if blocked (for landing)
function moveAxis(dx,dy){
  const h = TIERS[player.tier].h, r=7;
  const corners = (px,py)=>[[px-r,py-h*0.5],[px+r,py-h*0.5],[px-r,py+h*0.5],[px+r,py+h*0.5]];
  let blocked=false;
  if(dx!==0){
    const nx=player.x+dx;
    let ok=true;
    for(const [cx,cy] of corners(nx,player.y)){ const tx=(cx/T)|0,ty=(cy/T)|0; if(!inb(tx,ty)||solid(idx(tx,ty))){ ok=false; break; } }
    if(ok) player.x=nx; else { player.vx=0; blocked=true; }
  }
  if(dy!==0){
    const ny=player.y+dy;
    let ok=true;
    for(const [cx,cy] of corners(player.x,ny)){ const tx=(cx/T)|0,ty=(cy/T)|0; if(!inb(tx,ty)||solid(idx(tx,ty))){ ok=false; break; } }
    if(ok){ player.y=ny; }
    else { player.vy=0; blocked=true; }
  }
  return blocked;
}
// probe: is there solid ground within 2px under the feet?
// a ladder/rope cell that sits level with a floor slab acts as a landing you can walk across
function atFloorLevel(i){ const x=i%W, y=(i/W)|0;
  return (inb(x-1,y)&&grid[idx(x-1,y)]==='=') || (inb(x+1,y)&&grid[idx(x+1,y)]==='='); }
function groundProbe(){
  const h=TIERS[player.tier].h, r=7;
  for(const ox of [-r, r]){
    const tx=((player.x+ox)/T)|0, ty=((player.y+h*0.5+2)/T)|0;
    if(!inb(tx,ty)) continue;
    const bi=idx(tx,ty);
    if(solid(bi)) return true;
    if(!player.climbing && climbable(bi) && atFloorLevel(bi)) return true;  // stand on a ladder landing
  }
  return false;
}

// ============================================================
// Actions (hold / timed)
// ============================================================
function startAction(a){ action=a; action.t=0; }
function cancelAction(){ action=null; }
function spoilCap(){ return 6; }

function tryInteract(){
  const here=pcell(), fi=faceCell(), bi=belowCell();
  const standX=(player.x/T)|0, standY=((player.y+TIERS[player.tier].h*0.5+3)/T)|0;
  const fc = inb(standX,standY)?idx(standX,standY):-1;

  // descend through the street grate into the sewer shaft (rope hangs below)
  if(fc>=0 && floorType[fc]==='grate'){
    player.x = 5*T+T/2; player.y = 19*T+T/2; player.vx=0; player.vy=40; player.climbing=true;
    emitSound(5,18,3); msg('You slip through the grate into the sewer shaft.');
    return;
  }
  // dig UP through a weak board directly overhead (you're standing just beneath it)
  {
    const ax=(player.x/T)|0, ay=((player.y/T)|0)-1;   // the tile above the player's cell
    if(inb(ax,ay) && grid[idx(ax,ay)]==='w'){
      startAction({ type:'digup', total:6, cell:idx(ax,ay), tick:0, label:'prying up the floorboards' });
      return;
    }
  }
  if(fi<0) return;

  // doors
  const d=doors.get(fi);
  if(d){
    if(d.locked && !d.open){
      if(player.picks<=0){ msg('No picks left.'); return; }
      openLock(d); return;
    }
    d.open=!d.open; emitSound(d.x,d.y,d.open?3:2); sfx.thud();
    msg(d.open?`${d.label} — open`:`${d.label} — shut`); return;
  }
  // windows
  if(grid[fi]==='N' && !openWin.has(fi) && !glass.has(fi)){
    startAction({ type:'cutglass', total:16, cell:fi, label:'cutting the pane' }); return;
  }
  // strongbox
  const bx=loot.find(l=>!l.taken&&l.type==='box'&&idx(l.x,l.y)===fi);
  if(bx){ startAction({ type:'lootbox', total:3, box:bx, label:'emptying the strongbox' }); return; }
  const bx2=loot.find(l=>!l.taken&&l.type==='box'&&Math.hypot(player.x-(l.x*T+T/2),player.y-(l.y*T+T/2))<26);
  if(bx2){ startAction({ type:'lootbox', total:3, box:bx2, label:'emptying the strongbox' }); return; }

  // dig into earth we're facing (horizontal tunneling) or straight down
  let tgt=-1;
  if(diggable(...cellXY(fi)) && !dug[fi]) tgt=fi;
  else { const dx=(player.x/T)|0, dy=((player.y+10)/T)|0; if(inb(dx,dy)&&diggable(dx,dy)&&!dug[idx(dx,dy)]) tgt=idx(dx,dy); }
  if(tgt>=0){
    const m=MAT[mat[tgt]];
    startAction({ type:'dig', total:m.t, cell:tgt, matk:mat[tgt], tick:0, label:`digging ${m.name}` });
    return;
  }
}
function cellXY(i){ return [i%W,(i/W)|0]; }

function updateAction(dt){
  if(!action) return;
  action.t+=dt;
  if(action.type==='dig'){
    action.tick+=dt;
    if(action.tick>=0.7){ action.tick-=0.7; const n=MAT[action.matk].n; if(n>0){ const [x,y]=cellXY(action.cell); emitSound(x,y,n*3); sfx.dig(n); } }
  } else if(action.type==='digup'){
    action.tick+=dt;
    if(action.tick>=0.9){ action.tick-=0.9; const [x,y]=cellXY(action.cell); emitSound(x,y,6); sfx.dig(2); }
  }
  if(action.t>=action.total) completeAction();
}
function completeAction(){
  const a=action; action=null;
  switch(a.type){
    case 'cutglass': openWin.add(a.cell); emitSound(a.cell%W,(a.cell/W)|0,2); sfx.click(); msg('The pane lifts free. The window is open.'); break;
    case 'lootbox': a.box.taken=true; player.lootVal+=a.box.val; emitSound(a.box.x,a.box.y,2); sfx.coin(); msg(`The strongbox is yours. +${a.box.val}`); break;
    case 'dig': { const c=a.cell; dug[c]=true; shored[c]=true; probed[c]=true; stats.dug++; sfx.dig(2); break; }
    case 'digup': { const c=a.cell; grid[c]=' '; dug[c]=true; emitSound(c%W,(c/W)|0,5); msg('The boards give. Lamplight spills down — you are under the vault.'); break; }
    case 'probe': { const c=a.cell; probed[c]=true; const [cx,cy]=cellXY(c);
      for(const [dx,dy] of DIR4) if(inb(cx+dx,cy+dy)) probed[idx(cx+dx,cy+dy)]=true;
      emitSound(cx,cy,1); sfx.click(); msg(`Probe: ${MAT[mat[c]]?MAT[mat[c]].name:(grid[c]==='S'?'open sewer':'rock')}.`); break; }
  }
}

// ---------- collapse ----------
function tunnelRegion(startI){
  const seen=new Set([startI]); const q=[startI]; const cells=[]; let weight=0;
  while(q.length){
    const i=q.pop(); if(!dug[i]||shored[i]||grid[i]==='S') continue;
    cells.push(i); weight+=MAT[mat[i]]?MAT[mat[i]].wt:0;
    const x=i%W,y=(i/W)|0;
    for(const [dx,dy] of DIR4){ const nx=x+dx,ny=y+dy; if(!inb(nx,ny)) continue; const ni=idx(nx,ny);
      if(seen.has(ni)) continue; seen.add(ni);
      if(dug[ni]&&!shored[ni]&&grid[ni]!=='S') q.push(ni); }
  }
  return { cells, weight };
}
function collapseCheck(newCell){
  const r=tunnelRegion(newCell);
  if(r.weight>3){ doCollapse(r); return; }
  if(r.weight===3) msg('The tunnel groans. Shore it (T) before digging on.');
  else if(r.weight===2) msg(`Unshored span ${r.weight}/3.`);
}
function doCollapse(region){
  let sx=0,sy=0; for(const i of region.cells){ sx+=i%W; sy+=(i/W)|0; }
  sx=Math.round(sx/region.cells.length); sy=Math.round(sy/region.cells.length);
  const pc=pcell(); let buried=false;
  for(const i of region.cells){ if((MAT[mat[i]]?MAT[mat[i]].wt:0)===0) continue;
    dug[i]=false; shored[i]=false; grid[i]='E'; mat[i]='U'; probed[i]=true;
    if(i===pc) buried=true; }
  stats.collapsed=true; shake=1.2; sfx.collapse(); emitSound(sx,sy,30);
  if(buried){ stats.cause='The tunnel came down on you.'; mode='caught'; }
  else msg('Progressive collapse. Half the district heard that.');
}

// ============================================================
// Lockpicking (unchanged feel)
// ============================================================
function openLock(door){
  const pins=[]; for(let i=0;i<door.pins;i++){ const w=clamp(24-door.pins*2.4,6,20); pins.push({c:12+Math.random()*66,w,set:false}); }
  lock={ door, pins, cur:0, prog:0, wrong:0, edge:0, torque:0 };
  msg(touch.used?`${door.label}: ${door.pins} pins. Hold TENSION, sweep with your thumb.`
    :`${door.label}: ${door.pins} pins. Hold SPACE for tension, steer with the mouse.`);
}
function lockUpdate(dt){
  const ang=clamp((mouse.x/CW)*90,0,90); lock.ang=ang;
  const tension=!!keys[' ']||touch.tension;
  if(!tension){ lock.wrong=0; lock.edge=0; lock.prog=Math.max(0,lock.prog-dt*2); return; }
  if(lock.cur>=lock.pins.length) return;
  const pin=lock.pins[lock.cur]; const inArc=Math.abs(ang-pin.c)<pin.w/2;
  if(inArc){
    lock.prog+=dt; lock.wrong=0;
    if(lock.prog>=0.5){ pin.set=true; lock.cur++; lock.prog=0; sfx.click(); emitSound(lock.door.x,lock.door.y,2);
      if(lock.cur>=lock.pins.length){ lock.door.locked=false; lock.door.open=true; emitSound(lock.door.x,lock.door.y,3); sfx.unlock(); stats.picked++; msg(`${lock.door.label} gives. You are in.`); lock=null; return; } }
  } else {
    lock.prog=0; lock.wrong+=dt;
    if(lock.wrong>1.2){ for(const p of lock.pins) p.set=false; lock.cur=0; lock.wrong=0; sfx.thud(); emitSound(lock.door.x,lock.door.y,1); }
    if(ang<6||ang>84){ lock.edge+=dt;
      if(lock.edge>0.6){ lock.edge=0; player.picks--; stats.snapped=true; sfx.snap(); emitSound(lock.door.x,lock.door.y,9);
        for(const p of lock.pins) p.set=false; lock.cur=0;
        msg(player.picks>0?`Pick snapped. ${player.picks} left — a stub of evidence.`:'Your last pick snaps.');
        if(player.picks<=0) lock=null; }
    } else lock.edge=0;
  }
}

// ============================================================
// Guards (side-view lane patrol)
// ============================================================
function guardV(){ return player.tier===undefined?0:1; }
function guardCanSee(g){
  if(mode!=='play') return false;
  const dx=player.x-g.x, dy=player.y-g.y;
  const d=Math.hypot(dx,dy); if(d>210) return false;
  // horizontal cone: must be roughly in front, within a vertical band (same storey-ish)
  if(sign(dx)!==g.face && Math.abs(dx)>14) return false;
  if(Math.abs(dy)>T*1.6) return false;            // can't see far up/down through floors
  return los(g.x/T,g.y/T,player.x/T,player.y/T);
}
function pVis(){
  const tier=TIERS[player.tier];
  const speed=Math.abs(player.vx);
  const motion = player.climbing?0.7 : speed<6?0.5 : player.tier<=1?0.8 : player.tier===2?1.0:1.35;
  return clamp(lightAtPx(player.x,player.y)*tier.stance*motion,0,1.3);
}
function guardLaneY(g){ return g.lane*T + T/2; }

function guardUpdate(g,dt){
  const gx0=g.x;
  const see=guardCanSee(g);
  if(see){
    const d=Math.hypot(player.x-g.x,player.y-g.y);
    const fall=clamp(1.15-d/210,0,1.15);
    g.susp=clamp(g.susp+pVis()*fall*g.aware*dt*55,g.floor,100);
    g.lastKnown={x:player.x,y:player.y}; g.lastSeen=gameT;
    if(d<24) g.susp=100;
  } else if(gameT-g.lastSeen>1.6){ g.susp=Math.max(g.floor,g.susp-8*dt); }
  if(g.susp>=25) stats.ghost=false;

  if(g.susp>=85 && g.state!=='alert'){
    g.state='alert';
    if(!g.shouted){ g.shouted=true; stats.alerted=true; floater(g.x,g.y-20,'INTRUDER!',PAL.oxide); sfx.alert();
      emitSound((g.x/T)|0,(g.y/T)|0,22);
      for(const o of guards) if(o!==g&&o.state==='patrol'){ o.susp=Math.max(o.susp,60); o.lastKnown={x:g.x,y:g.y}; } }
  } else if(g.susp>=55 && (g.state==='patrol'||g.state==='curious')){
    g.state='investigate'; floater(g.x,g.y-20,'Who\u2019s there?',PAL.sodium); g.sweepT=0;
  } else if(g.susp>=25 && g.state==='patrol'){
    g.state='curious'; g.holdT=2.4; floater(g.x,g.y-20,'\u2026what was that?',PAL.chalk);
  }

  const spd = g.state==='alert'?120 : g.state==='investigate'?92 : 54;

  switch(g.state){
    case 'patrol': {
      const wp=g.wps[g.wp];
      const tx=wp[0]*T+T/2;
      g.dir = sign(tx-g.x)||g.dir; g.face=g.dir;
      g.x += g.dir*spd*dt;
      if(Math.abs(tx-g.x)<4){ g.wp=(g.wp+1)%g.wps.length; }
      guardStayOnLane(g);
      break;
    }
    case 'curious': {
      if(g.lastKnown) g.face=sign(g.lastKnown.x-g.x)||g.face;
      g.holdT-=dt; if(g.holdT<=0&&g.susp<25){ g.state='patrol'; }
      break;
    }
    case 'investigate': case 'alert': {
      const tgt = (see?{x:player.x,y:player.y}:g.lastKnown);
      if(tgt){
        // change lanes toward target if on a different storey and a ladder is reachable
        guardVerticalChase(g, tgt, spd, dt);
        const tx=tgt.x;
        if(Math.abs(tx-g.x)>6 && Math.abs(tgt.y-g.y)<T){ g.dir=sign(tx-g.x)||g.dir; g.face=g.dir; g.x+=g.dir*spd*dt; guardStayOnLane(g); }
        else { g.face=sign(tx-g.x)||g.face; }
      }
      g.sweepT=(g.sweepT||0)+dt;
      if(!see && g.sweepT>7){ g.floor=clamp(g.floor+9,0,60); g.aware*=1.1; g.susp=g.floor; g.shouted=false; g.state='patrol'; g.sweepT=0; floater(g.x,g.y-20,'Hm.',PAL.draft); }
      if(g.state==='alert' && Math.hypot(player.x-g.x,player.y-g.y)<18 && Math.abs(player.y-g.y)<T){ stats.cause='A hand closes on your collar.'; mode='caught'; }
      break;
    }
  }
  g.walkPhase += Math.abs(g.x-gx0)*0.09;
}
function guardStayOnLane(g){
  const ly=guardLaneY(g); g.y=lerp(g.y,ly,0.4);
  // reverse only at a real ledge — open air with no floor AND no ladder/rope to stand across
  const gx=(g.x/T)|0, gy=((g.y+T*0.5+1)/T)|0;
  if(inb(gx,gy) && !solid(idx(gx,gy)) && !climbable(idx(gx,gy))){
    g.x -= g.dir*2; g.dir*=-1; g.face=g.dir;
  }
}
function guardVerticalChase(g,tgt,spd,dt){
  const targetLane=(tgt.y/T)|0;
  if(targetLane===g.lane) return;
  // find nearest climbable column on this lane the guard can reach
  const gy=g.lane;
  let best=null,bd=1e9;
  for(let x=1;x<W-1;x++){
    const i=idx(x,gy);
    if(climbable(i)){ const dx=Math.abs(x*T+T/2-g.x); if(dx<bd){ bd=dx; best=x; } }
  }
  if(best!=null){
    const bx=best*T+T/2;
    if(Math.abs(bx-g.x)>5){ g.dir=sign(bx-g.x); g.face=g.dir; g.x+=g.dir*spd*dt; }
    else { g.lane += sign(targetLane-g.lane); g.y=guardLaneY(g); }
  }
}

// ============================================================
// Loop
// ============================================================
function step(dt){
  gameT+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*1.6);
  for(const r of rings) r.t-=dt; rings=rings.filter(r=>r.t>0);
  for(const f of floaters){ f.t-=dt; f.y-=dt*10; } floaters=floaters.filter(f=>f.t>0);
  if(msgState.t>0) msgState.t-=dt;
  if(tutMsg.t>0) tutMsg.t-=dt;
  if(mode!=='play'){ return; }
  if(lock){ lockUpdate(dt); updateAction(0); }
  else { playerUpdate(dt); tutorialTick(); }
  for(const g of guards) guardUpdate(g,dt);
  // vision / explored
  visSet = computeVis();
  for(const i of visSet) exploredSet.add(i);
}

// Contextual, one-at-a-time hints that appear as you meet each mechanic — no wall of text.
function tutorialTick(){
  if(!player) return;
  const T_=touch.used;
  const mv = T_ ? 'Use the left stick to walk' : 'A / D walk';
  const cl = T_ ? 'Push the stick up/down to climb' : 'W / S climb';
  const act = T_ ? 'ACT' : 'E';
  const sneak = T_ ? 'SNEAK' : 'Shift';

  tut('move', `${mv}. Head for the counting house.`);

  const c=pcell(), fi=faceCell();
  if(climbable(c)) tut('climb', T_? `${cl} ladders and ropes.` : `${cl} ladders and ropes.`);
  const d=doors.get(fi);
  if(d && d.locked && !d.open) tut('lock', `Locked. Hold ${act} to pick it — keep tension and settle each pin.`);
  else if(d && !d.open) tut('door', `Press ${act} to open the door.`);
  if(fi>=0 && grid[fi]==='N' && !openWin.has(fi) && !glass.has(fi)) tut('window', `A window. Hold ${act} to cut the pane and slip in.`);
  // on the street grate
  { const sx=(player.x/T)|0, sy=((player.y+TIERS[player.tier].h*0.5+3)/T)|0;
    if(inb(sx,sy)&&floorType[idx(sx,sy)]==='grate') tut('grate', `Press ${act} to drop through the grate into the sewer.`); }
  // underground, facing diggable earth
  if(belowGround() && fi>=0 && grid[fi]==='E' && !dug[fi] && mat[fi]!=='K')
    tut('dig', `Hold ${act} to dig. Tunnel up beneath the vault.`);
  // weak boards overhead
  { const ax=(player.x/T)|0, ay=((player.y/T)|0)-1; if(inb(ax,ay)&&grid[idx(ax,ay)]==='w') tut('digup', `Boards above. Hold ${act} to break up into the vault.`); }
  // a guard in view
  for(const g of guards){ const gi=idx((g.x/T)|0,(g.y/T)|0);
    if(visSet.has(gi) && Math.hypot(player.x-g.x,player.y-g.y)<T*8){ tut('guard', `A guard. They only see the way they face — ${sneak} or slip behind.`); break; } }
  // facing the strongbox
  if(loot.some(l=>!l.taken&&l.type==='box'&&idx(l.x,l.y)===fi)) tut('box', `The strongbox. Hold ${act} to empty it, then run for the lit alley.`);
  // has the loot, remind to escape
  if(loot.some(l=>l.type==='box'&&l.taken)) tut('escape', `You have the take. Get back to the lit alley on the right.`);
}
function computeVis(){
  const vis=new Set(); const px=player.x/T, py=player.y/T;
  const rad = player.climbing?7: (grid[pcell()]==='S'||belowGround())?6:11;
  vis.add(pcell());
  for(let a=0;a<360;a+=3){
    const dx=Math.cos(a*Math.PI/180)*0.45, dy=Math.sin(a*Math.PI/180)*0.45;
    let fx=px,fy=py;
    for(let s=0;s<rad/0.45;s++){ fx+=dx; fy+=dy; const tx=fx|0,ty=fy|0; if(!inb(tx,ty)) break; const i=idx(tx,ty); vis.add(i); if(opaque(i)) break; }
  }
  return vis;
}
function belowGround(){ return (player.y/T)|0 > 18; }

// ============================================================
// Input
// ============================================================
const keys={};
const mouse={ x:VW/2, y:VH/2 };
const isTouchDevice = (typeof navigator!=='undefined'&&navigator.maxTouchPoints>0)||(typeof window!=='undefined'&&'ontouchstart' in window);
const touch={ used:false, stickId:null, nub:[STICK.x,STICK.y], vec:[0,0], mag:0, holds:new Map(), pickId:null, tension:false };
let touchButtons=[];

function onKeyDown(e){
  const k=e.key.toLowerCase();
  const fresh=!keys[k];
  keys[k]=true;
  ac();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(mode==='title'){ if(k==='enter'||k===' ') mode='play'; return; }
  if(mode==='caught'||mode==='escaped'){ if(k==='r'||k==='enter'){ resetRun(); mode='play'; } return; }
  if(mode!=='play') return;
  if(fresh) handlePress(k);
}
function handlePress(k){
  if(lock){ if(k==='escape'){ lock=null; msg('You ease off the lock.'); } return; }
  if(k==='escape'){ cancelAction(); return; }
  if(k==='sneak'||k==='shift'){ player.sneak=!player.sneak; msg(player.sneak?'Sneaking — quiet and low.':'Walking.'); return; }
  if(k==='e'||k==='enter'){ tryInteract(); return; }
}
function onKeyUp(e){ const k=e.key.toLowerCase(); keys[k]=false; if(action&&action.type==='dig'&&!keys['e']) cancelAction(); }
function onWheel(e){ e.preventDefault(); }

// ---- touch ----
function buildTouchButtons(){
  touchButtons=[]; if(!touch.used||mode!=='play') return;
  const B=(x,y,r,k,label,big)=>touchButtons.push({x,y,r,k,label,big});
  if(lock){ B(1045,455,60,'tension','TENSION',true); B(72,64,34,'escape','LEAVE'); return; }
  B(1058,455,54,'e','ACT',true);
  B(930,455,44,'sneak','SNEAK');
  if(action) B(72,64,34,'escape','STOP');
}
function canvasXY(t){ const r=canvas.getBoundingClientRect(); return [ (t.clientX-r.left)*(CW/r.width), (t.clientY-r.top)*(CH/r.height) ]; }
function stickSet(cx,cy){
  let dx=cx-STICK.x, dy=cy-STICK.y; const R=STICK.r; const d=Math.hypot(dx,dy);
  if(d>R){ dx=dx/d*R; dy=dy/d*R; }
  touch.nub=[STICK.x+dx, STICK.y+dy];
  touch.vec=[dx/R, dy/R];                 // each axis -1..1, measured from the FIXED centre
}
function stickRelease(){ touch.stickId=null; touch.vec=[0,0]; touch.nub=[STICK.x,STICK.y]; }
function goFullscreen(){ try{ const el=document.documentElement; if(el&&el.requestFullscreen&&!document.fullscreenElement){ el.requestFullscreen().then(()=>{ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}).catch(()=>{}); } }catch(_){} }
function onTouchStart(e){ e.preventDefault(); touch.used=true; ac();
  if(mode==='title'){ goFullscreen(); mode='play'; return; }
  if(mode==='caught'||mode==='escaped'){ resetRun(); mode='play'; return; }
  for(const t of e.changedTouches){ const [cx,cy]=canvasXY(t); let hit=null;
    for(const b of touchButtons) if(Math.hypot(cx-b.x,cy-b.y)<=b.r+10){ hit=b; break; }
    if(hit){ if(hit.k==='tension'){ touch.tension=true; touch.holds.set(t.identifier,'tension'); }
      else { touch.holds.set(t.identifier,hit.k); keys[hit.k]=true; handlePress(hit.k); } }
    else if(lock){ touch.pickId=t.identifier; mouse.x=cx; }
    else if(cx < CW*0.5 && touch.stickId==null){ touch.stickId=t.identifier; stickSet(cx,cy); }
  }
}
function onTouchMove(e){ e.preventDefault(); for(const t of e.changedTouches){ const [cx,cy]=canvasXY(t);
  if(t.identifier===touch.stickId) stickSet(cx,cy);
  else if(t.identifier===touch.pickId) mouse.x=clamp(cx,0,CW); } }
function onTouchEnd(e){ e.preventDefault(); for(const t of e.changedTouches){
  if(t.identifier===touch.stickId) stickRelease();
  if(t.identifier===touch.pickId) touch.pickId=null;
  const k=touch.holds.get(t.identifier);
  if(k!==undefined){ touch.holds.delete(t.identifier);
    if(k==='tension') touch.tension=[...touch.holds.values()].includes('tension');
    else if(![...touch.holds.values()].includes(k)){ keys[k]=false; if(action&&action.type==='dig'&&k==='e') cancelAction(); } } } }

// ============================================================
// Render
// ============================================================
let canvas, ctx;
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=PAL.void; ctx.fillRect(0,0,CW,CH);

  // camera follows player, clamped; zoomed 2x
  const tx=clamp(player.x-VW/2, 0, W*T-VW), ty=clamp(player.y-VH/2, 0, H*T-VH);
  cam.x=lerp(cam.x,tx,0.15); cam.y=lerp(cam.y,ty,0.15);
  const shx=shake>0?(Math.random()-0.5)*shake*10:0, shy=shake>0?(Math.random()-0.5)*shake*10:0;

  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,CW,CH-HUD_H); ctx.clip();
  ctx.setTransform(SCALE,0,0,SCALE,-(cam.x+shx)*SCALE,-(cam.y+shy)*SCALE);

  const x0=Math.max(0,(cam.x/T)|0), y0=Math.max(0,(cam.y/T)|0);
  const x1=Math.min(W-1,((cam.x+VW)/T)|0), y1=Math.min(H-1,((cam.y+VH)/T)|0);

  drawSky();
  drawWorld(x0,y0,x1,y1);
  drawDecor();
  drawSewerWater(x0,y0,x1,y1);
  drawLamps();
  drawExit();
  drawRings();
  drawLoot();
  drawGuards();
  drawPlayer();
  drawMotes(x0,y0,x1,y1);
  drawFloaters();
  ctx.restore();

  drawVignette();
  drawObjective();
  drawTutorial();
  drawHUD();
  if(lock) drawLock();
  buildTouchButtons(); drawTouchUI();
  if(mode==='title') drawTitle();
  else if(mode==='caught') drawEnd(false);
  else if(mode==='escaped') drawEnd(true);
}

function drawSky(){
  // night-sky gradient behind the above-ground air, plus a low moon glow
  const skyBot = 18*T;
  const g = ctx.createLinearGradient(0,0,0,skyBot);
  g.addColorStop(0,'#0e1526'); g.addColorStop(0.7,'#0b1019'); g.addColorStop(1,'#0A0C11');
  ctx.fillStyle=g; ctx.fillRect(cam.x-T, 0, VW+2*T, skyBot);
  // a few faint stars, deterministic
  ctx.fillStyle='rgba(191,203,217,0.35)';
  for(let s=0;s<40;s++){ const sx=((s*97)%(W*T)), sy=((s*53)%(skyBot-40))+6;
    if(sx>cam.x-T && sx<cam.x+VW+T) ctx.fillRect(sx, sy, 1, 1); }
  // moon with soft halo
  const mx=47*T, my=3.2*T;
  if(mx>cam.x-90 && mx<cam.x+VW+90){
    const mg=ctx.createRadialGradient(mx,my,3, mx,my,66);
    mg.addColorStop(0,'rgba(226,232,244,0.75)'); mg.addColorStop(0.28,'rgba(190,204,230,0.28)'); mg.addColorStop(1,'rgba(190,204,230,0)');
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,66,0,TAU); ctx.fill();
    ctx.fillStyle='#e4eaf6'; ctx.beginPath(); ctx.arc(mx,my,13,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(150,162,188,0.4)';
    ctx.beginPath(); ctx.arc(mx+4,my-3,3,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx-4,my+4,2.2,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+2,my+5,1.6,0,TAU); ctx.fill();
    // slow drifting cloud in front of the moon
    const cxp=mx-30+((gameT*6)%120);
    ctx.fillStyle='rgba(14,18,28,0.5)';
    ctx.beginPath(); ctx.ellipse(cxp,my+2,26,7,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cxp+16,my-2,16,6,0,0,TAU); ctx.fill();
  }
}

function drawDecor(){
  if(!decor) return;
  for(const d of decor){
    const cell=idx(d.x, d.wall?d.y:d.y-1);
    if(!exploredSet.has(idx(d.x,d.y)) && !exploredSet.has(cell)) continue;
    const vis=visSet.has(idx(d.x,d.y))||visSet.has(cell);
    const L=vis?clamp(0.42+lightmap[cell]*0.7,0.2,1):0.4;
    const bx=d.x*T, floorTop=d.y*T;
    drawProp(d.t, bx, floorTop, L, vis);
  }
}
function drawProp(t, bx, fy, L, vis){
  const sh=v=>shade(v,L);
  const wood='#5a4326', woodD='#3a2c18', metal='#33405e';
  switch(t){
    case 'crate': ctx.fillStyle=sh(wood); ctx.fillRect(bx+3,fy-16,T-6,16);
      ctx.strokeStyle=sh(woodD); ctx.lineWidth=1; ctx.strokeRect(bx+3,fy-16,T-6,16);
      ctx.beginPath(); ctx.moveTo(bx+3,fy-16); ctx.lineTo(bx+T-3,fy); ctx.moveTo(bx+T-3,fy-16); ctx.lineTo(bx+3,fy); ctx.stroke(); break;
    case 'crateSm': ctx.fillStyle=sh(wood); ctx.fillRect(bx+5,fy-11,T-10,11);
      ctx.strokeStyle=sh(woodD); ctx.strokeRect(bx+5,fy-11,T-10,11); break;
    case 'barrel': ctx.fillStyle=sh('#4a3826'); ctx.beginPath(); ctx.ellipse(bx+T/2,fy-9,7,10,0,0,TAU); ctx.fill();
      ctx.strokeStyle=sh('#6a5238'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(bx+T/2-7,fy-12); ctx.lineTo(bx+T/2+7,fy-12); ctx.moveTo(bx+T/2-7,fy-6); ctx.lineTo(bx+T/2+7,fy-6); ctx.stroke(); ctx.lineWidth=1; break;
    case 'bookcase': ctx.fillStyle=sh(woodD); ctx.fillRect(bx+2,fy-44,T-4,44);
      for(let s=0;s<4;s++){ const sy=fy-42+s*11; ctx.fillStyle=sh('#2a2016'); ctx.fillRect(bx+3,sy,T-6,9);
        const cols=[PAL.oxide,PAL.verd,PAL.sodium,PAL.draft,'#7a5a3a'];
        for(let b=0;b<5;b++){ ctx.fillStyle=sh(cols[(s+b)%5]); ctx.fillRect(bx+4+b*3.4,sy+1,2.6,7); } }
      ctx.strokeStyle=sh('#000'); ctx.strokeRect(bx+2,fy-44,T-4,44); break;
    case 'desk': ctx.fillStyle=sh(wood); ctx.fillRect(bx+1,fy-13,T-2,5);
      ctx.fillStyle=sh(woodD); ctx.fillRect(bx+3,fy-8,4,8); ctx.fillRect(bx+T-7,fy-8,4,8);
      ctx.fillStyle=sh('#2a2016'); ctx.fillRect(bx+1,fy-8,T-2,5);
      // ledger + quill light
      ctx.fillStyle=sh(PAL.chalk); ctx.fillRect(bx+T/2-3,fy-16,7,4); break;
    case 'table': ctx.fillStyle=sh(wood); ctx.fillRect(bx,fy-12,T,4);
      ctx.fillStyle=sh(woodD); ctx.fillRect(bx+2,fy-8,3,8); ctx.fillRect(bx+T-5,fy-8,3,8); break;
    case 'chair': ctx.fillStyle=sh(woodD); ctx.fillRect(bx+6,fy-16,3,16); ctx.fillRect(bx+6,fy-8,T-14,3);
      ctx.fillRect(bx+6,fy-4,3,4); ctx.fillRect(bx+T-11,fy-4,3,4); break;
    case 'stool': ctx.fillStyle=sh(woodD); ctx.fillRect(bx+5,fy-7,T-10,3); ctx.fillRect(bx+6,fy-4,3,4); ctx.fillRect(bx+T-9,fy-4,3,4); break;
    case 'cabinet': ctx.fillStyle=sh(metal); ctx.fillRect(bx+3,fy-18,T-6,18);
      ctx.strokeStyle=sh('#1a2130'); ctx.strokeRect(bx+3,fy-18,T-6,18);
      ctx.fillStyle=sh(PAL.sodium); ctx.beginPath(); ctx.arc(bx+T-8,fy-9,2,0,TAU); ctx.fill(); break;
    case 'sconceStand': ctx.strokeStyle=sh('#2a3550'); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(bx+T/2,fy); ctx.lineTo(bx+T/2,fy-18); ctx.stroke(); ctx.lineWidth=1;
      if(vis){ ctx.fillStyle='rgba(233,162,59,0.9)'; ctx.beginPath(); ctx.arc(bx+T/2,fy-20,2.4,0,TAU); ctx.fill(); } break;
    case 'rug': ctx.fillStyle=sh('#5a2836'); ctx.fillRect(bx-T,fy-2,T*3,3);
      ctx.fillStyle=sh(PAL.sodium); for(let r=-1;r<2;r++) ctx.fillRect(bx+r*T+T/2-4,fy-1,8,1); break;
    case 'painting': { const y=fy-T+4; ctx.fillStyle=sh('#6a5238'); ctx.fillRect(bx+4,y,T-8,T-8);
      ctx.fillStyle=sh(PAL.draft); ctx.fillRect(bx+6,y+2,T-12,T-12);
      ctx.fillStyle=sh(PAL.verd); ctx.fillRect(bx+7,y+7,T-14,3); ctx.fillStyle=sh(PAL.sodium); ctx.beginPath(); ctx.arc(bx+T/2,y+5,2,0,TAU); ctx.fill(); break; }
  }
  ctx.lineWidth=1;
}

function drawSewerWater(x0,y0,x1,y1){
  // shimmering water along the sewer channel floor
  const groundY=18, sewerY=groundY+8;      // channel floor row
  const wy=sewerY*T;
  for(let x=x0;x<=x1;x++){ const i=idx(x,sewerY-1);
    if(grid[idx(x,sewerY)]!=='=' ) continue;
    if(!exploredSet.has(i)&&!exploredSet.has(idx(x,sewerY))) continue;
    const vis=visSet.has(i)||visSet.has(idx(x,sewerY));
    const a=vis?0.5:0.25;
    ctx.fillStyle=`rgba(40,70,80,${a*0.5})`; ctx.fillRect(x*T,wy-4,T,4);
    // moving highlight
    const sh=Math.sin(gameT*2 + x*0.6);
    ctx.fillStyle=`rgba(120,170,180,${(0.10+0.10*Math.max(0,sh))*(vis?1:0.4)})`;
    ctx.fillRect(x*T,wy-4,T, 1);
  }
}

function drawLamps(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let k=0;k<lamps.length;k++){ const lm=lamps[k];
    const li=idx(clamp(lm.x|0,0,W-1), clamp(lm.y|0,0,H-1));
    if(!exploredSet.has(li)) continue;
    const vis=visSet.has(li);
    const flick=0.88+0.12*Math.sin(gameT*11+k*1.7)+0.05*Math.sin(gameT*23+k);
    const gx=lm.x*T, gy=lm.y*T, rad=lm.r*T*0.95*(0.97+0.06*Math.sin(gameT*7+k));
    const a = (vis?0.42:0.10)*flick;
    const g=ctx.createRadialGradient(gx,gy,2, gx,gy,rad);
    g.addColorStop(0,`rgba(233,162,59,${a})`);
    g.addColorStop(0.45,`rgba(233,162,59,${a*0.32})`);
    g.addColorStop(1,'rgba(233,162,59,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(gx,gy,rad,0,TAU); ctx.fill();
    if(vis){ ctx.fillStyle=`rgba(255,224,160,${0.95*flick})`; ctx.beginPath(); ctx.arc(gx,gy,2.6,0,TAU); ctx.fill(); }
  }
  ctx.restore();
}

function drawVignette(){
  ctx.setTransform(1,0,0,1,0,0);
  const gh=CH-HUD_H;
  const vg=ctx.createRadialGradient(CW/2,gh*0.5, gh*0.30, CW/2,gh*0.5, gh*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,CW,gh);
}

function drawObjective(){
  if(mode!=='play') return;
  ctx.setTransform(1,0,0,1,0,0);
  const got = loot.some(l=>l.type==='box'&&l.taken);
  const txt = got ? 'ESCAPE \u2014 reach the lit alley on the right' : 'GOAL \u2014 reach the strongbox in the ground-floor vault';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font='11px monospace'; ctx.fillStyle=got?'rgba(78,156,134,0.9)':'rgba(120,133,150,0.85)';
  ctx.fillText(txt, CW/2, 22);
  ctx.textAlign='left';
}

function drawTutorial(){
  if(mode!=='play' || tutMsg.t<=0) return;
  ctx.setTransform(1,0,0,1,0,0);
  const a=clamp(tutMsg.t,0,1);
  ctx.font='13px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const tw=ctx.measureText(tutMsg.text).width|0;
  const w=Math.max(220, tw+44), h=38, x=(CW-w)/2, y=40;
  ctx.globalAlpha=a*0.92;
  roundRect(x,y,w,h,10); ctx.fillStyle='rgba(14,18,26,0.96)'; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle=PAL.sodium; ctx.stroke();
  // little lightbulb dot
  ctx.fillStyle=PAL.sodium; ctx.beginPath(); ctx.arc(x+18,y+h/2,4,0,TAU); ctx.fill();
  ctx.globalAlpha=a;
  ctx.fillStyle=PAL.chalk; ctx.fillText(tutMsg.text, CW/2+8, y+h/2+1);
  ctx.globalAlpha=1; ctx.lineWidth=1; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function cellLit(i,x,y){
  const seen=exploredSet.has(i), vis=visSet.has(i);
  if(!seen) return 0;
  if(!vis) return 0.24;                 // blueprint memory: dim but legible
  return clamp(0.44 + lightmap[i]*0.72, 0.2, 1);
}

function drawWorld(x0,y0,x1,y1){
  const groundY=18;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const i=idx(x,y), k=grid[i];
    if(!exploredSet.has(i)) continue;
    const vis=visSet.has(i);
    const px=x*T, py=y*T;
    const L=cellLit(i,x,y);
    let base=null, top=null;
    const underground = y>groundY;
    if(k==='#'||k==='K'){ base = underground? '#141821' : '#171b24'; top='#20283a'; }
    else if(k==='E'){
      if(dug[i]){ base = shored[i]? '#241d16' : mix('#0d0f14', MAT[mat[i]].col, 0.25); }
      else { base = probed[i]||vis ? MAT[mat[i]].col : '#161a20'; }
    }
    else if(k==='='||k==='w'){ const ft=floorType[i];
      base = ft==='carpet'? '#3a2130' : ft==='tile'? '#26303a' : ft==='street'? '#1c222c' : '#2a2016';
      if(k==='w') top='#4a3a24'; }
    else if(k==='S'){ base='#0c1016'; }
    else if(k==='X'){ base=mix('#1c222c', PAL.sodium, 0.25); }
    else { base=null; } // air/ladder/rope/door/window drawn below
    if(base){ ctx.fillStyle = vis? shade(base,L) : shade(base,0.5); ctx.fillRect(px,py,T,T);
      if(top && vis){ ctx.fillStyle=shade(top,L); ctx.fillRect(px,py,T,3); } }

    // surface detailing (only where lit/visible)
    if(vis){
      if(k==='#'||k==='K'){
        ctx.strokeStyle='rgba(0,0,0,0.30)'; ctx.lineWidth=1;
        const my=py+T/2, off=(y%2)?T/2:0;
        ctx.beginPath();
        ctx.moveTo(px,my+0.5); ctx.lineTo(px+T,my+0.5);                         // mortar course
        ctx.moveTo(px+off+0.5,py); ctx.lineTo(px+off+0.5,my);                   // upper joint
        ctx.moveTo(px+((off+T/2)%T)+0.5,my); ctx.lineTo(px+((off+T/2)%T)+0.5,py+T); // lower joint
        ctx.stroke();
        ctx.strokeStyle='rgba(191,203,217,0.05)'; ctx.beginPath(); ctx.moveTo(px,py+0.5); ctx.lineTo(px+T,py+0.5); ctx.stroke();
      } else if(k==='='||k==='w'){
        ctx.fillStyle='rgba(255,240,210,0.05)'; ctx.fillRect(px,py,T,1);        // top sheen
        ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px,py+T-0.5); ctx.lineTo(px+T,py+T-0.5);    // underside shadow
        ctx.moveTo(px+T-0.5,py+2); ctx.lineTo(px+T-0.5,py+T-2); ctx.stroke();   // plank seam
      } else if(k==='E' && !dug[i] && mat[i]!=='K'){
        // packed-earth grit: a few deterministic pebbles + a horizontal stratum line
        const seed=(x*73856+y*19349)>>>0;
        ctx.fillStyle='rgba(0,0,0,0.20)';
        for(let s=0;s<3;s++){ const rx=px+3+((seed>>(s*5))&15)*1.3, ry=py+3+((seed>>(s*4+2))&15)*1.2; ctx.fillRect(rx,ry,1.4,1.4); }
        ctx.fillStyle='rgba(191,203,217,0.05)';
        const rx=px+2+(seed&15)*1.2; ctx.fillRect(rx,py+((seed>>8)&15)+2,2,1);
        if(mat[i]==='R'){ ctx.strokeStyle='rgba(78,156,134,0.25)'; ctx.lineWidth=1; ctx.beginPath();
          ctx.moveTo(px+2,py+T); ctx.quadraticCurveTo(px+T/2,py+T/2,px+T-3,py+2); ctx.stroke(); }
      } else if(k==='E' && dug[i]){
        // dug tunnel: darker floor grit + faint tool marks on the back wall
        ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px+3,py+4); ctx.lineTo(px+7,py+7); ctx.moveTo(px+T-8,py+5); ctx.lineTo(px+T-4,py+9); ctx.stroke();
        if(shored[i]){ ctx.strokeStyle='rgba(120,90,50,0.5)'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.moveTo(px+2,py); ctx.lineTo(px+2,py+T); ctx.moveTo(px+T-2,py); ctx.lineTo(px+T-2,py+T); ctx.stroke(); }
      }
      ctx.lineWidth=1;
    }

    // overlays
    if(k==='H'){ drawLadder(px,py,L); }
    if(k==='r'||ropes.has(i)){ drawRope(px,py,L); }
    if(k==='D'){ const d=doors.get(i); drawDoor(px,py,d,L); }
    if(k==='N'){ drawWindow(px,py,i,L); }
    if(k==='X'){ ctx.fillStyle=shade(PAL.sodium,0.6*L); ctx.fillRect(px+T*0.3,py,T*0.4,T); }
    // dig hint: subtle grid on undug earth in view
    if(k==='E'&&!dug[i]&&vis&&mat[i]!=='K'){ ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.strokeRect(px+0.5,py+0.5,T-1,T-1); }
  }
}
function shade(col,L){ return mix('#0A0C11', col, clamp(L,0,1)); }
function drawLadder(px,py,L){ ctx.strokeStyle=shade(PAL.draft,0.7*L+0.2); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(px+7,py); ctx.lineTo(px+7,py+T); ctx.moveTo(px+T-7,py); ctx.lineTo(px+T-7,py+T);
  for(let r=4;r<T;r+=7){ ctx.moveTo(px+7,py+r); ctx.lineTo(px+T-7,py+r); } ctx.stroke(); ctx.lineWidth=1; }
function drawRope(px,py,L){ ctx.strokeStyle=shade(PAL.sodium,0.5*L+0.2); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(px+T/2,py); ctx.lineTo(px+T/2,py+T); ctx.stroke(); ctx.lineWidth=1; }
function drawDoor(px,py,d,L){ if(d&&d.open) return;
  ctx.fillStyle=shade(d&&d.locked?'#3a2a1c':'#2a2620', L); ctx.fillRect(px+3,py+1,T-6,T-1);
  ctx.fillStyle=shade(PAL.sodium,0.6*L); ctx.fillRect(px+T-8,py+T/2-2,3,4);
  if(d&&d.locked){ ctx.fillStyle=shade(PAL.oxide,0.7*L); ctx.fillRect(px+T-9,py+T/2-1,2,2); } }
function drawWindow(px,py,i,L){ const open=openWin.has(i), smashed=glass.has(i);
  ctx.strokeStyle=shade(PAL.draft,0.8); ctx.strokeRect(px+2,py+1,T-4,T-2);
  if(open){ } else if(smashed){ ctx.strokeStyle=shade(PAL.chalk,0.5*L); ctx.beginPath(); ctx.moveTo(px+4,py+4); ctx.lineTo(px+T-5,py+T-4); ctx.moveTo(px+T-6,py+5); ctx.lineTo(px+7,py+T-5); ctx.stroke(); }
  else { ctx.fillStyle=`rgba(120,160,190,${0.14+0.12*L})`; ctx.fillRect(px+3,py+2,T-6,T-4); ctx.strokeStyle=shade(PAL.chalk,0.4*L); ctx.beginPath(); ctx.moveTo(px+T/2,py+2); ctx.lineTo(px+T/2,py+T-2); ctx.stroke(); } }

function drawRings(){ for(const r of rings){ const a=r.t/0.9; for(const [i,l] of r.cells){ if(!visSet.has(i)&&!exploredSet.has(i)) continue;
  const x=(i%W)*T,y=((i/W)|0)*T; ctx.fillStyle=`rgba(184,67,58,${0.05+0.16*(l/r.max)*a})`; ctx.fillRect(x,y,T,T); } } }

function drawLoot(){ for(const l of loot){ if(l.taken) continue; const i=idx(l.x,l.y); if(!exploredSet.has(i)) continue;
  const vis=visSet.has(i); const L=vis?lightmap[i]*0.9+0.25:0.35; const px=l.x*T+T/2, py=l.y*T+T/2;
  const glint=0.5+0.5*Math.sin(gameT*3 + l.x*1.7 + l.y);
  // warm glow
  if(vis){ ctx.save(); ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(px,py-2,0, px,py-2,l.type==='box'?18:11);
    g.addColorStop(0,`rgba(233,162,59,${0.28+0.16*glint})`); g.addColorStop(1,'rgba(233,162,59,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py-2,l.type==='box'?18:11,0,TAU); ctx.fill(); ctx.restore(); }
  if(l.type==='coin'){
    ctx.fillStyle=shade('#c8892f',L); ctx.beginPath(); ctx.arc(px,py-2,4.5,0,TAU); ctx.fill();
    ctx.fillStyle=shade(PAL.sodium,L); ctx.beginPath(); ctx.arc(px,py-2,3,0,TAU); ctx.fill();
    ctx.fillStyle=`rgba(255,240,200,${0.5+0.4*glint})`; ctx.beginPath(); ctx.arc(px-1.2,py-3.4,1.1,0,TAU); ctx.fill();
  } else {
    // strongbox: banded chest with a lit clasp
    ctx.fillStyle=shade('#5a4326',L); ctx.fillRect(px-9,py-7,18,12);
    ctx.fillStyle=shade('#3a2c18',L); ctx.fillRect(px-9,py-2,18,2);
    ctx.strokeStyle=shade('#caa24a',L); ctx.lineWidth=1; ctx.strokeRect(px-9,py-7,18,12);
    ctx.fillStyle=shade(PAL.sodium,L); ctx.fillRect(px-9,py-7,18,2);
    ctx.fillStyle=`rgba(255,230,170,${0.5+0.5*glint})`; ctx.fillRect(px-2,py-3,4,3);
    ctx.lineWidth=1;
  } } }

// ---------- humanoid figure ----------
// Draws a person standing on (cx, feetY), facing dir, animated by phase.
// pose: 'stand'|'walk'|'run'|'crouch'|'prone'|'climb'. cols = {skin, cloth, accent, line}
function drawHuman(cx, feetY, dir, pose, phase, cols, L){
  feetY -= 1;                            // seat rounded foot-caps on the floor line, not through it
  // soft contact shadow
  ctx.fillStyle=`rgba(0,0,0,${0.22*clamp(L+0.2,0,1)})`;
  ctx.beginPath(); ctx.ellipse(cx, feetY+1.5, 8, 2.4, 0, 0, TAU); ctx.fill();
  const sh = v=>shade(v, L);
  ctx.lineCap='round';
  const swing = Math.sin(phase);        // -1..1 gait
  const swing2 = Math.sin(phase+Math.PI);
  if(pose==='prone'){
    // lying low, crawling — mostly horizontal
    const bodyY = feetY-3;
    ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(cx-dir*8, bodyY); ctx.lineTo(cx+dir*7, bodyY-1); ctx.stroke();
    // head forward
    ctx.fillStyle=sh(cols.skin); ctx.beginPath(); ctx.arc(cx+dir*9, bodyY-1, 2.6, 0, TAU); ctx.fill();
    // arm reaching
    ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(cx+dir*2, bodyY); ctx.lineTo(cx+dir*12, bodyY+2+swing*2); ctx.stroke();
    ctx.lineWidth=1; return;
  }
  // vertical figure metrics scale with pose
  const crouch = pose==='crouch';
  const legLen = crouch?5 : 9;
  const torsoLen = crouch?7 : 9;
  const headR = 3.4;
  const hipY = feetY - legLen;
  const shoulderY = hipY - torsoLen;
  const headY = shoulderY - headR - 0.5;
  const lean = pose==='run'? dir*3 : crouch? dir*2 : 0;

  if(pose==='climb'){
    // front-facing on a ladder/rope: body vertical, limbs reaching alternately
    const midx=cx;
    ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(midx, shoulderY); ctx.lineTo(midx, hipY+1); ctx.stroke();  // torso
    // legs on rungs
    ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(midx, hipY); ctx.lineTo(midx-3, hipY+legLen*0.6+swing*2); ctx.lineTo(midx-3, feetY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midx, hipY); ctx.lineTo(midx+3, hipY+legLen*0.6+swing2*2); ctx.lineTo(midx+3, feetY); ctx.stroke();
    // arms reaching up alternately
    ctx.strokeStyle=sh(cols.accent); ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(midx, shoulderY+1); ctx.lineTo(midx-4, shoulderY-4+swing2*3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midx, shoulderY+1); ctx.lineTo(midx+4, shoulderY-4+swing*3); ctx.stroke();
    ctx.fillStyle=sh(cols.skin); ctx.beginPath(); ctx.arc(midx, headY, headR, 0, TAU); ctx.fill();
    ctx.lineWidth=1; return;
  }

  // side-on standing / walking / running
  const gaitAmp = pose==='run'?6 : pose==='walk'?4 : crouch?1.2 : 0.6;
  const armAmp  = pose==='run'?5 : pose==='walk'?3 : 0.6;
  // legs (swing around hip)
  ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=2.8;
  ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx+swing*gaitAmp, feetY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx+swing2*gaitAmp, feetY); ctx.stroke();
  // torso
  ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx+lean, shoulderY); ctx.stroke();
  // back arm then front arm (accent = front, e.g. holding a tool)
  ctx.lineWidth=2.4; ctx.strokeStyle=sh(cols.cloth);
  ctx.beginPath(); ctx.moveTo(cx+lean, shoulderY+1); ctx.lineTo(cx+lean+swing2*armAmp, shoulderY+7); ctx.stroke();
  // head
  ctx.fillStyle=sh(cols.skin); ctx.beginPath(); ctx.arc(cx+lean, headY, headR, 0, TAU); ctx.fill();
  // hat / cap brim in facing dir
  if(cols.hat){ ctx.fillStyle=sh(cols.hat); ctx.fillRect(cx+lean-headR, headY-headR-1, headR*2, 2.2);
    ctx.fillRect(cx+lean+ (dir>0?headR-1:-headR-2), headY-headR, 3, 1.8); }
  // front arm (accent)
  ctx.strokeStyle=sh(cols.accent); ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(cx+lean, shoulderY+1); ctx.lineTo(cx+lean+dir*3+swing*armAmp, shoulderY+7); ctx.stroke();
  ctx.lineWidth=1;
}

function poseFor(p){
  if(p.climbing) return 'climb';
  const t=p.tier;
  if(t===0) return 'prone';
  if(t===1) return 'crouch';
  if(!p.onGround) return 'stand';
  if(Math.abs(p.vx)>4) return t===3?'run':'walk';
  return 'stand';
}

function drawGuards(){ for(const g of guards){ const gi=idx((g.x/T)|0,(g.y/T)|0); if(!visSet.has(gi)&&!exploredSet.has(gi)) continue;
  const vis=visSet.has(gi);
  // vision cone from the eyes, in facing dir
  if(vis){ const col = g.state==='alert'?PAL.oxide : g.state==='investigate'?PAL.sodium : g.state==='curious'?PAL.chalk:PAL.draft;
    const ex=g.x, ey=g.y-16; const R=210, spread=0.34;
    const grad=ctx.createLinearGradient(ex,ey, ex+g.face*R, ey);
    grad.addColorStop(0, col); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle=grad; ctx.globalAlpha=0.16;
    ctx.beginPath(); ctx.moveTo(ex,ey);
    ctx.lineTo(ex+g.face*R, ey-R*spread); ctx.lineTo(ex+g.face*R, ey+R*spread); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
  const L=vis?clamp(0.5+lightAtPx(g.x,g.y)*0.6,0.4,1):0.4;
  const moving=Math.abs(g.x - (g._px||g.x))>0.2; g._px=g.x;
  const pose = g.state==='alert'?'run' : moving?'walk':'stand';
  const cols={ skin:'#c9a88a', cloth:'#33405e', accent:'#8fa0be', line:'#0A0C11', hat:'#20283a' };
  drawHuman(g.x, g.y+13, g.face, pose, g.walkPhase, cols, L);
  // lantern held out in facing dir
  if(g.lantern){ const lx=g.x+g.face*7, ly=g.y+2;
    ctx.fillStyle=`rgba(233,162,59,${0.85*L})`; ctx.beginPath(); ctx.arc(lx,ly,3.2,0,TAU); ctx.fill();
    ctx.globalAlpha=0.18*L; ctx.fillStyle=PAL.sodium; ctx.beginPath(); ctx.arc(lx,ly,9,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  // suspicion bar above head
  if(g.susp>3 && vis){ const w=18, s=clamp(g.susp/100,0,1); ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(g.x-w/2,g.y-26,w,3);
    ctx.fillStyle = g.susp>=85?PAL.oxide:g.susp>=55?PAL.sodium:PAL.chalk; ctx.fillRect(g.x-w/2,g.y-26,w*s,3);
    if(g.state==='alert'){ ctx.fillStyle=PAL.oxide; ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.fillText('!',g.x,g.y-29); } } } }

function drawPlayer(){ const h=TIERS[player.tier].h; const lit=lightAtPx(player.x,player.y);
  const L=clamp(0.45+lit*0.6+pVis()*0.2, 0.35, 1);
  const pose=poseFor(player);
  // burglar: dark cloth, pale hands/face, sodium tool in the lead hand
  const cols={ skin:'#c7b299', cloth:'#1b2436', accent:PAL.sodium, line:'#0A0C11', hat:'#141a26' };
  const feetY = player.y + h*0.5;
  drawHuman(player.x, feetY, player.dir, pose, player.walkPhase, cols, L);
  // action ring above the head
  if(action){ const topY = feetY - h - 8;
    ctx.strokeStyle=PAL.sodium; ctx.lineWidth=2; ctx.beginPath();
    ctx.arc(player.x, topY, 7, -Math.PI/2, -Math.PI/2 + TAU*(action.t/action.total)); ctx.stroke(); ctx.lineWidth=1; }
  // spoil load pips at the feet
  for(let s=0;s<player.spoil;s++){ ctx.fillStyle=shade('#6a4a30',0.9); ctx.fillRect(player.x-6+s*2.4, feetY+1, 1.8,1.8); } }

function drawFloaters(){ ctx.textAlign='center'; ctx.font='7px monospace';
  for(const f of floaters){ ctx.globalAlpha=clamp(f.t,0,1); ctx.fillStyle=f.col; ctx.fillText(f.text,f.x,f.y); } ctx.globalAlpha=1; }

// ============================================================
// HUD + overlays
// ============================================================
function drawHUD(){
  ctx.setTransform(1,0,0,1,0,0);
  const y0=CH-HUD_H;
  ctx.fillStyle=PAL.void; ctx.fillRect(0,y0,CW,HUD_H);
  ctx.strokeStyle=PAL.draft; ctx.beginPath(); ctx.moveTo(0,y0+0.5); ctx.lineTo(CW,y0+0.5); ctx.stroke();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  // movement state
  ctx.font='bold 15px monospace'; ctx.fillStyle=player.sneak?PAL.verd:PAL.chalk;
  ctx.fillText(player.sneak?'SNEAKING':'WALKING', 24, y0+30);
  ctx.font='10px monospace'; ctx.fillStyle=PAL.draft; ctx.fillText(isTouchDevice?'left stick: move & climb':'A/D move   W/S climb', 24, y0+52);

  // light gem
  const lit=lightAtPx(player.x,player.y);
  ctx.fillStyle=mix(PAL.void,PAL.sodium,lit); ctx.beginPath(); ctx.arc(258,y0+24,10,0,TAU); ctx.fill();
  ctx.strokeStyle=PAL.draft; ctx.stroke();
  ctx.fillStyle=PAL.draft; ctx.font='10px monospace'; ctx.fillText(lit>0.5?'LIT':'SHADOW', 242, y0+52);

  // picks
  ctx.font='13px monospace'; ctx.fillStyle=PAL.chalk;
  ctx.fillText(`lockpicks  ${player.picks}`, 340, y0+30);

  // take
  ctx.fillStyle=PAL.sodium; ctx.font='bold 15px monospace'; ctx.fillText(`take  ${player.lootVal}`, 340, y0+52);

  // depth / location, right
  const depth=((player.y/T)|0)-18;
  ctx.textAlign='right'; ctx.fillStyle=PAL.draft; ctx.font='11px monospace';
  ctx.fillText(depth>0?`${depth} below ground`:'street level', CW-24, y0+30);

  // message line
  if(msgState.t>0){ ctx.globalAlpha=clamp(msgState.t,0,1); ctx.textAlign='center'; ctx.fillStyle=PAL.chalk; ctx.font='13px monospace';
    ctx.fillText(msgState.text, CW/2, y0+56); ctx.globalAlpha=1; }
  ctx.textAlign='left';
}

function drawExit(){
  if(!exitPx) return;
  const i=idx(clamp(exitPx.x/T|0,0,W-1), clamp(exitPx.y/T|0,0,H-1));
  if(!exploredSet.has(i)) return;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const pulse=0.6+0.4*Math.sin(gameT*2.2);
  const g=ctx.createRadialGradient(exitPx.x,exitPx.y,3, exitPx.x,exitPx.y,T*3.2);
  g.addColorStop(0,`rgba(233,162,59,${0.30*pulse})`);
  g.addColorStop(0.5,`rgba(78,156,134,${0.12*pulse})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(exitPx.x,exitPx.y,T*3.2,0,TAU); ctx.fill();
  ctx.restore();
}

function drawMotes(x0,y0,x1,y1){
  // slow drifting specks — warm above ground, cool dust below
  const groundY=18;
  ctx.save();
  for(let s=0;s<52;s++){
    const bx=(s*131.3)%(W*T), by=(s*79.7)%(H*T);
    const drift=Math.sin(gameT*0.5 + s)*6;
    const mx=bx+drift, my=by + (gameT*7 + s*40)% (H*T);
    const tx=(mx/T)|0, ty=(my/T)|0;
    if(mx<cam.x||mx>cam.x+VW||my<cam.y||my>cam.y+VH) continue;
    if(!inb(tx,ty)) continue; const ci=idx(tx,ty);
    if(!visSet.has(ci)) continue;
    if(solid(ci)) continue;
    const under=ty>groundY;
    ctx.fillStyle = under? `rgba(150,170,200,${0.08+0.06*Math.sin(gameT+s)})`
                         : `rgba(233,200,150,${0.09+0.05*Math.sin(gameT*1.3+s)})`;
    ctx.fillRect(mx, my, 1.4, 1.4);
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawLock(){
  ctx.setTransform(1,0,0,1,0,0);
  const gh=CH-HUD_H;
  // dim the scene behind
  ctx.fillStyle='rgba(6,8,12,0.55)'; ctx.fillRect(0,0,CW,gh);

  const w=560, h=300, x=(CW-w)/2, y=(gh-h)/2;
  // metallic panel
  const pg=ctx.createLinearGradient(0,y,0,y+h);
  pg.addColorStop(0,'#1b2130'); pg.addColorStop(0.5,'#12161f'); pg.addColorStop(1,'#0c0f16');
  roundRect(x,y,w,h,14); ctx.fillStyle=pg; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=PAL.draft; ctx.stroke();
  roundRect(x+5,y+5,w-10,h-10,10); ctx.strokeStyle='rgba(191,203,217,0.06)'; ctx.lineWidth=1; ctx.stroke();
  // corner rivets
  for(const [rx,ry] of [[x+16,y+16],[x+w-16,y+16],[x+16,y+h-16],[x+w-16,y+h-16]]){
    ctx.fillStyle='#2a3550'; ctx.beginPath(); ctx.arc(rx,ry,3,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(191,203,217,0.3)'; ctx.beginPath(); ctx.arc(rx-0.6,ry-0.6,1,0,TAU); ctx.fill(); }

  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=PAL.chalk; ctx.font='bold 14px monospace';
  ctx.fillText(lock.door.label.toUpperCase(), CW/2, y+34);
  ctx.fillStyle=PAL.draft; ctx.font='11px monospace';
  ctx.fillText(`pin ${Math.min(lock.cur+1,lock.pins.length)} of ${lock.pins.length}`, CW/2, y+52);

  const cx=CW/2, cy=y+h-64, R=112;
  const tension=!!keys[' ']||touch.tension;
  const ang=clamp((mouse.x/CW)*90,0,90);
  const danger=(ang<6||ang>84);
  const A0=Math.PI, A1=Math.PI*2;                 // top semicircle, left->right
  const toTheta=a=>A0 + (a/90)*(A1-A0);
  // torque: the whole cylinder twists a touch when tension is applied
  lock.torque = lerp(lock.torque||0, tension?(danger?0.06:0.05):0, 0.25);

  ctx.save(); ctx.translate(cx,cy); ctx.rotate(lock.torque);

  // cylinder face
  const cg=ctx.createRadialGradient(0,0,6, 0,0,R+16);
  cg.addColorStop(0,'#161c28'); cg.addColorStop(1,'#0b0e15');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,R+16,Math.PI,TAU); ctx.lineTo(-R-16,0); ctx.fill();
  // dial base arc
  ctx.lineCap='round';
  ctx.strokeStyle='#232c40'; ctx.lineWidth=16;
  ctx.beginPath(); ctx.arc(0,0,R,A0,A1); ctx.stroke();
  // tick marks
  ctx.strokeStyle='rgba(191,203,217,0.18)'; ctx.lineWidth=1;
  for(let a=0;a<=90;a+=7.5){ const th=toTheta(a); const r0=R-9,r1=R+9;
    ctx.beginPath(); ctx.moveTo(Math.cos(th)*r0,Math.sin(th)*r0); ctx.lineTo(Math.cos(th)*r1,Math.sin(th)*r1); ctx.stroke(); }
  // danger zones at the ends
  ctx.strokeStyle='rgba(184,67,58,0.5)'; ctx.lineWidth=16;
  ctx.beginPath(); ctx.arc(0,0,R,toTheta(0),toTheta(6)); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R,toTheta(84),toTheta(90)); ctx.stroke();

  // pin zones
  const pulse=0.6+0.4*Math.sin(gameT*6);
  for(let i=0;i<lock.pins.length;i++){ const pn=lock.pins[i];
    const ta=toTheta(pn.c-pn.w/2), tb=toTheta(pn.c+pn.w/2), tc=toTheta(pn.c);
    if(pn.set){ ctx.strokeStyle=PAL.verd; ctx.globalAlpha=0.9; }
    else if(i===lock.cur){ ctx.strokeStyle=PAL.sodium; ctx.globalAlpha=0.35+0.4*pulse; }
    else { ctx.strokeStyle=PAL.draft; ctx.globalAlpha=0.3; }
    ctx.lineWidth=16; ctx.beginPath(); ctx.arc(0,0,R,ta,tb); ctx.stroke(); ctx.globalAlpha=1;
    // seated pin marker
    if(pn.set){ const mx=Math.cos(tc)*R, my=Math.sin(tc)*R;
      ctx.fillStyle=PAL.verd; ctx.beginPath(); ctx.arc(mx,my,4.5,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(233,255,240,0.8)'; ctx.beginPath(); ctx.arc(mx,my,2,0,TAU); ctx.fill(); }
  }

  // the pick needle
  const th=toTheta(ang);
  const tipx=Math.cos(th)*R, tipy=Math.sin(th)*R;
  const inZone = lock.cur<lock.pins.length && Math.abs(ang-lock.pins[lock.cur].c) < lock.pins[lock.cur].w/2;
  const needleCol = danger?PAL.oxide : (inZone&&tension)?PAL.verd : PAL.chalk;
  ctx.strokeStyle='#0A0C11'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(tipx,tipy); ctx.stroke();
  ctx.strokeStyle=needleCol; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(tipx*0.98,tipy*0.98); ctx.stroke();
  // glowing tip + progress ring while seating
  const glow=ctx.createRadialGradient(tipx,tipy,0, tipx,tipy,14);
  glow.addColorStop(0, needleCol); glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.6; ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(tipx,tipy,14,0,TAU); ctx.fill(); ctx.globalAlpha=1;
  if(inZone && tension && lock.prog>0){ ctx.strokeStyle=PAL.verd; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(tipx,tipy,10,-Math.PI/2,-Math.PI/2+TAU*clamp(lock.prog/0.5,0,1)); ctx.stroke(); }
  // hub
  ctx.fillStyle='#2a3550'; ctx.beginPath(); ctx.arc(0,0,7,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(191,203,217,0.35)'; ctx.beginPath(); ctx.arc(-1.5,-1.5,2.5,0,TAU); ctx.fill();
  ctx.restore();
  ctx.lineWidth=1; ctx.lineCap='butt';

  // seated-pin pips
  const dotN=lock.pins.length, dw=14, tot=dotN*dw, dx0=CW/2-tot/2+dw/2;
  for(let i=0;i<dotN;i++){ ctx.fillStyle=lock.pins[i].set?PAL.verd:'rgba(120,130,150,0.3)';
    ctx.beginPath(); ctx.arc(dx0+i*dw, y+h-26, 4, 0, TAU); ctx.fill(); }

  // tension prompt
  ctx.fillStyle=tension?PAL.verd:PAL.sodium; ctx.font='11px monospace';
  ctx.fillText(tension?'\u25CF TENSION HELD — sweep to each pin':(touch.used?'hold TENSION and sweep':'hold SPACE and move the pick'), CW/2, y+h-8);
}

function drawTouchUI(){
  if(!touch.used) return;
  ctx.setTransform(1,0,0,1,0,0);
  // fixed thumbstick (only during play, not while picking a lock)
  if(mode==='play' && !lock){
    const active=touch.stickId!=null;
    // base ring
    ctx.globalAlpha=active?0.28:0.20; ctx.fillStyle=PAL.draft;
    ctx.beginPath(); ctx.arc(STICK.x,STICK.y,STICK.r,0,TAU); ctx.fill();
    ctx.globalAlpha=active?0.8:0.55; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(STICK.x,STICK.y,STICK.r,0,TAU); ctx.stroke();
    // faint direction ticks
    ctx.globalAlpha=0.3; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=1.5;
    for(let a=0;a<4;a++){ const th=a*Math.PI/2; const r0=STICK.r-12,r1=STICK.r-4;
      ctx.beginPath(); ctx.moveTo(STICK.x+Math.cos(th)*r0,STICK.y+Math.sin(th)*r0);
      ctx.lineTo(STICK.x+Math.cos(th)*r1,STICK.y+Math.sin(th)*r1); ctx.stroke(); }
    // nub
    const nx=touch.nub[0], ny=touch.nub[1];
    ctx.globalAlpha=active?0.55:0.4; ctx.fillStyle=active?PAL.verd:PAL.draft;
    ctx.beginPath(); ctx.arc(nx,ny,STICK.nub,0,TAU); ctx.fill();
    ctx.globalAlpha=active?1:0.7; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(nx,ny,STICK.nub,0,TAU); ctx.stroke();
    ctx.globalAlpha=1; ctx.lineWidth=1;
  }
  // action buttons
  for(const b of touchButtons){
    const held=[...touch.holds.values()].includes(b.k)||(b.k==='tension'&&touch.tension)||(b.k==='sneak'&&player&&player.sneak);
    ctx.globalAlpha=held?0.5:0.24; ctx.fillStyle=held?PAL.verd:PAL.draft; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
    ctx.globalAlpha=held?0.95:0.65; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.stroke();
    ctx.fillStyle=PAL.chalk; ctx.font=(b.big?'bold 18px':'bold 13px')+' monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.label,b.x,b.y);
    ctx.globalAlpha=1; ctx.lineWidth=1; }
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
}

function drawTitle(){
  ctx.setTransform(1,0,0,1,0,0);
  const gh=CH-HUD_H;
  // opaque backdrop (no scene bleed) with a soft night gradient
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#0d1420'); bg.addColorStop(0.6,'#0A0C11'); bg.addColorStop(1,'#080a0e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,CW,CH);
  // moon
  const mg=ctx.createRadialGradient(CW*0.8,110,3, CW*0.8,110,90);
  mg.addColorStop(0,'rgba(226,232,244,0.7)'); mg.addColorStop(0.3,'rgba(190,204,230,0.22)'); mg.addColorStop(1,'rgba(190,204,230,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(CW*0.8,110,90,0,TAU); ctx.fill();
  ctx.fillStyle='#e4eaf6'; ctx.beginPath(); ctx.arc(CW*0.8,110,16,0,TAU); ctx.fill();

  // a small house-in-cross-section vignette, centered low
  drawTitleHouse(CW/2, gh*0.66);

  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=PAL.chalk; ctx.font='bold 54px monospace';
  ctx.fillText('S P O I L', CW/2, 118);
  ctx.font='13px monospace'; ctx.fillStyle=PAL.draft;
  ctx.fillText('a house in cross-section \u2014 rob it from any angle', CW/2, 146);

  // one centered line of essential controls, then let the game teach the rest
  ctx.font='12px monospace'; ctx.fillStyle='rgba(120,133,150,0.9)';
  ctx.fillText(isTouchDevice ? 'LEFT STICK  move & climb     ACT  interact     SNEAK  hide'
                             : 'A / D move    W / S climb    E interact    SHIFT sneak', CW/2, 178);

  const blink=0.6+0.4*Math.sin(gameT*3);
  ctx.globalAlpha=blink; ctx.fillStyle=PAL.sodium; ctx.font='16px monospace';
  ctx.fillText(isTouchDevice?'\u2014 tap to begin the night \u2014':'\u2014 press ENTER to begin the night \u2014', CW/2, gh-40);
  ctx.globalAlpha=1;
}
function drawTitleHouse(cx,cy){
  // stylized 3-storey cutaway with a lit window and a figure — sets the tone
  const w=300, h=150, x=cx-w/2, y=cy-h/2;
  ctx.strokeStyle=PAL.draft; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
  ctx.fillStyle='rgba(46,66,96,0.10)'; ctx.fillRect(x,y,w,h);
  for(let f=1;f<3;f++){ ctx.strokeStyle='rgba(46,66,96,0.7)'; ctx.beginPath(); ctx.moveTo(x,y+f*h/3); ctx.lineTo(x+w,y+f*h/3); ctx.stroke(); }
  // street below
  ctx.strokeStyle=PAL.draft; ctx.beginPath(); ctx.moveTo(x-40,y+h); ctx.lineTo(x+w+40,y+h); ctx.stroke();
  // earth hatch below street
  ctx.strokeStyle='rgba(58,47,36,0.6)'; ctx.lineWidth=1;
  for(let i=0;i<10;i++){ const gx=x-20+i*34; ctx.beginPath(); ctx.moveTo(gx,y+h+6); ctx.lineTo(gx+10,y+h+18); ctx.stroke(); }
  // lit vault window (bottom-right) with glow
  const vx=x+w-42, vy=y+h*5/6;
  const vg=ctx.createRadialGradient(vx,vy,1, vx,vy,30);
  vg.addColorStop(0,'rgba(233,162,59,0.55)'); vg.addColorStop(1,'rgba(233,162,59,0)');
  ctx.fillStyle=vg; ctx.beginPath(); ctx.arc(vx,vy,30,0,TAU); ctx.fill();
  ctx.fillStyle=PAL.sodium; ctx.fillRect(vx-5,vy-6,10,12);
  // a tiny burglar figure on the top floor
  const fx=x+50, fy=y+h/3-2;
  ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2; ctx.beginPath();
  ctx.moveTo(fx,fy-8); ctx.lineTo(fx,fy); ctx.moveTo(fx,fy); ctx.lineTo(fx-3,fy+6); ctx.moveTo(fx,fy); ctx.lineTo(fx+3,fy+6); ctx.stroke();
  ctx.fillStyle=PAL.chalk; ctx.beginPath(); ctx.arc(fx,fy-11,2.4,0,TAU); ctx.fill();
  ctx.lineWidth=1;
}

function drawEnd(escaped){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=PAL.void; ctx.globalAlpha=0.86; ctx.fillRect(0,0,CW,CH); ctx.globalAlpha=1; ctx.textAlign='center';
  if(!escaped){ ctx.fillStyle=PAL.oxide; ctx.font='bold 40px monospace'; ctx.fillText('TAKEN',CW/2,220);
    ctx.fillStyle=PAL.chalk; ctx.font='14px monospace'; ctx.fillText(stats.cause||'The night ends in irons.',CW/2,258);
    ctx.fillStyle=PAL.draft; ctx.fillText(touch.used?'tap to run the job again':'press R to run the job again',CW/2,300); return; }
  ctx.fillStyle=PAL.verd; ctx.font='bold 38px monospace'; ctx.fillText('THE FENCE',CW/2,150);
  ctx.font='14px monospace'; let mult=1; const rows=[]; rows.push(['take',`${player.lootVal} coin`]);
  if(stats.ghost){ mult*=1.5; rows.push(['GHOST — no guard ever stirred','×1.5']); }
  rows.push(['BLOODLESS — no bodies','×1.3']); mult*=1.3;
  const clean=!stats.snapped&&!stats.glass&&!stats.collapsed;
  if(clean){ mult*=1.25; rows.push(['CLEAN — no evidence','×1.25']); }
  else { const ev=[]; if(stats.snapped) ev.push('a snapped pick'); if(stats.glass) ev.push('broken glass'); if(stats.collapsed) ev.push('a caved tunnel');
    rows.push([`evidence: ${ev.join(', ')}`,'—']); }
  const xp=Math.round((player.lootVal/10)*mult);
  let y=204; ctx.fillStyle=PAL.chalk; for(const [a,b] of rows){ ctx.textAlign='left'; ctx.fillText(a,300,y); ctx.textAlign='right'; ctx.fillText(b,660,y); y+=26; }
  ctx.textAlign='center'; ctx.fillStyle=PAL.sodium; ctx.font='bold 20px monospace'; ctx.fillText(`${xp} XP`,CW/2,y+14);
  ctx.fillStyle=PAL.draft; ctx.font='12px monospace'; ctx.fillText(`cells dug ${stats.dug} · locks picked ${stats.picked}`,CW/2,y+40);
  ctx.fillText(touch.used?'tap for another night':'press R for another night',CW/2,y+70);
}

// ============================================================
// Boot
// ============================================================
function boot(){
  canvas = document.getElementById('g');
  ctx = canvas.getContext('2d');
  touch.used = isTouchDevice;            // show the D-pad right away on phones/tablets
  resetRun(); mode='title';
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  canvas.addEventListener('wheel', onWheel, { passive:false });
  canvas.addEventListener('touchstart', onTouchStart, { passive:false });
  canvas.addEventListener('touchmove', onTouchMove, { passive:false });
  canvas.addEventListener('touchend', onTouchEnd, { passive:false });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive:false });
  canvas.addEventListener('contextmenu', e=>e.preventDefault&&e.preventDefault());
  canvas.addEventListener('mousemove', e=>{ const r=canvas.getBoundingClientRect(); mouse.x=(e.clientX-r.left)*(CW/r.width); mouse.y=(e.clientY-r.top)*(CH/r.height); });
  canvas.addEventListener('mousedown', ()=>{ ac(); if(mode==='title') mode='play'; else if(mode==='caught'||mode==='escaped'){ resetRun(); mode='play'; } });
  // When the device rotates or the window resizes, any in-progress joystick anchor
  // (stored in canvas pixels) becomes stale and movement directions can go haywire.
  // Drop all live input so the player starts clean in the new layout.
  const clearInput=()=>{ for(const k in keys) keys[k]=false;
    touch.stickId=null; touch.vec=[0,0]; touch.mag=0; touch.nub=[STICK.x,STICK.y]; touch.tension=false; touch.pickId=null; touch.holds.clear();
    if(player) player.vx=0; };
  if(typeof window!=='undefined' && window.addEventListener){
    window.addEventListener('resize', clearInput);
    window.addEventListener('orientationchange', clearInput);
  }
  if(typeof screen!=='undefined' && screen.orientation && screen.orientation.addEventListener)
    screen.orientation.addEventListener('change', clearInput);
  let last=performance.now();
  function frame(now){ let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; step(dt); render(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}

if(typeof window!=='undefined'){
  window.SPOIL = {
    boot, step, resetRun,
    get player(){ return player; }, get guards(){ return guards; }, get mode(){ return mode; }, set mode(v){ mode=v; },
    get grid(){ return grid; }, get mat(){ return mat; }, get dug(){ return dug; }, get action(){ return action; },
    get shored(){ return shored; }, get probed(){ return probed; }, get floorType(){ return floorType; }, get lightmap(){ return lightmap; },
    get stats(){ return stats; }, get lock(){ return lock; }, set lock(v){ lock=v; },
    get doors(){ return doors; }, get loot(){ return loot; }, get ropes(){ return ropes; },
    keys, mouse, touch, tryInteract, startAction, emitSound, handlePress,
    onTouchStart, onTouchMove, onTouchEnd, buildTouchButtons, get touchButtons(){ return touchButtons; },
    idx, W, H, T, CW, CH, VW, VH, HUD_H,
  };
  if(typeof document!=='undefined' && document.getElementById && document.getElementById('g')) boot();
  else if(typeof document!=='undefined' && document.addEventListener) document.addEventListener('DOMContentLoaded', boot);
}
