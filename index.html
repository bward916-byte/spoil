<body>
<canvas id="g" width="1152" height="576"></canvas>
<div id="rotate"><div>&#8635;<br><b>S P O I L</b><br>turn your device sideways &mdash;<br>this job is worked in landscape</div></div>
<script>
// ============================================================
// SPOIL — side-view cut-through burglary. Canvas 2D, zero libs.
// The house stands in cross-section; the earth below is yours to dig.
// ============================================================

const PAL = {
  void:  '#0A0C11',
  draft: '#2E4260',
  chalk: '#BFCBD9',
  sodium:'#E9A23B',
  verd:  '#4E9C86',
  oxide: '#B8433A',
};

// world is a tile grid seen edge-on. y grows downward (sky -> roof -> floors -> earth -> bedrock).
const W = 64, H = 44, T = 24, NC = W * H;
const SCALE = 3;                       // 3x zoom: each tile is 72 device px — people read big
const VW = 384, VH = 168;              // world viewport (16 x 7 tiles visible)
const HUD_H = 72;                      // slim HUD so the short landscape view keeps its height
const CW = VW * SCALE, CH = VH * SCALE + HUD_H; // canvas: 1152 x 576 (fills a landscape phone, ~2:1)
const STICK = { x:168, y:372, r:76, nub:34 };   // fixed on-screen thumbstick (lower-left)
const TAU = Math.PI * 2;
const DIR4 = [[1,0],[-1,0],[0,1],[0,-1]];

const idx = (x,y) => y*W + x;
const inb = (x,y) => x>=0 && y>=0 && x<W && y<H;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const sign = v => v<0?-1:v>0?1:0;

function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(h1,h2,t){ const a=hexRGB(h1),b=hexRGB(h2); t=clamp(t,0,1);
  return `rgb(${(a[0]+(b[0]-a[0])*t)|0},${(a[1]+(b[1]-a[1])*t)|0},${(a[2]+(b[2]-a[2])*t)|0})`; }

// ---------- tile kinds ----------
// Each cell has: k (kind char), plus dig state for earth.
// AIR ' '  passable open air (rooms, sky, dug tunnels)
// SOLID '#' brick wall / bedrock border — impassable, opaque, blocks sound hard
// FLOOR '=' a walkable floor slab (solid to stand on, blocks vertical movement & sight down)
// WEAK 'w'  a floorboard you can dig UP through from below / pry from above
// LADDER 'H' climbable (interior stair/ladder)
// ROPE 'r'  climbable rope you deploy or that hangs in a shaft
// DOOR 'D'  handled via doors map (locked/pins)
// WINDOW 'N' glass — see through, cut or smash to pass
// EARTH materials (dig grid): L C R G U B  (loam clay root gravel rubble footing)
// BEDROCK 'K' undiggable
// SEWER 'S' open void underground (free move, dump spoil)
// LAMP posts handled separately

const MAT = {
  L: { t:1.6, n:1, wt:1, name:'loam',          col:'#3a2f24' },
  C: { t:3.4, n:1, wt:0, name:'clay',          col:'#4a3a48' },
  R: { t:5.0, n:0, wt:0, name:'root mass',     col:'#2c3a2c' },
  G: { t:4.2, n:3, wt:2, name:'gravel',        col:'#4a4640' },
  U: { t:5.0, n:4, wt:2, name:'rubble',        col:'#3f3a34' },
  B: { t:9.0, n:6, wt:1, name:'brick footing', col:'#5a3630' },
};
const isEarth = k => MAT[k] !== undefined;

// ---------- movement tiers (horizontal) ----------
// loudness base per footfall; stance affects how visible you are; height = collision box.
const TIERS = [
  { name:'PRONE',  spd:18,  base:0, int:0,    stance:0.35, h:9  },
  { name:'CROUCH', spd:32,  base:1, int:0.60, stance:0.60, h:14 },
  { name:'WALK',   spd:66,  base:6, int:0.46, stance:1.00, h:20 },
  { name:'RUN',    spd:118, base:16,int:0.30, stance:1.15, h:20 },
];

// surface loudness by what you're standing on
const FLOOR_MULT = { '=':1.0, 'w':1.2, 'street':1.2, 'carpet':0.4, 'tile':1.3 };

// ============================================================
// Level state
// ============================================================
let grid;              // Uint8-ish: we store chars in a normal array for clarity
let mat;              // earth material per cell (only meaningful where grid==='E')
let dug;             // bool per cell: earth that's been excavated (now air, but tracked for collapse)
let shored;          // bool per cell
let probed;          // bool per cell
let floorType;       // per-floor surface tag for loudness (carpet/tile) keyed by cell
let doors;           // Map cell -> {open,locked,pins,label,x,y}
let openWin, glass;  // Sets of window cells opened / smashed
let ropes;           // Set of cells with a deployed/there rope
let lamps, loot, guards, lightmap, exitPx, decor;
let exploredSet, visSet;
let player, mode, msgState, floaters, rings, shake, stats, cam, gameT;
let tutMsg={text:'',t:0}, tutSeen=new Set();
let lock, action;

function fill(x0,y0,x1,y1,ch){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(inb(x,y)) grid[idx(x,y)]=ch; }
function hline(x0,x1,y,ch){ for(let x=x0;x<=x1;x++) if(inb(x,y)) grid[idx(x,y)]=ch; }
function vline(x,y0,y1,ch){ for(let y=y0;y<=y1;y++) if(inb(x,y)) grid[idx(x,y)]=ch; }

function genLevel(){
  grid = new Array(NC).fill(' ');
  mat = new Array(NC).fill('L');
  dug = new Array(NC).fill(false);
  shored = new Array(NC).fill(false);
  probed = new Array(NC).fill(false);
  floorType = new Array(NC).fill('=');
  doors = new Map(); openWin = new Set(); glass = new Set(); ropes = new Set();

  // ---- vertical layout ----
  // y 0..3 sky, y4 street level (ground surface), building y5..? , earth below groundY
  const groundY = 18;         // the street/topsoil line
  // sky is air. bedrock frame:
  hline(0, W-1, H-1, '#');
  vline(0, 0, H-1, '#'); vline(W-1, 0, H-1, '#');

  // ---- the street ----
  hline(1, W-2, groundY, '='); for(let x=1;x<=W-2;x++) floorType[idx(x,groundY)]='street';
  // exit: lit alley mouth on the right at street level
  for(let y=groundY-3; y<groundY; y++){ grid[idx(W-3,y)]=' '; grid[idx(W-2,y)]='X'; }
  grid[idx(W-2,groundY-1)]='X'; grid[idx(W-3,groundY-1)]='X';
  exitPx = { x:(W-2.5)*T, y:(groundY-2)*T };

  // ---- the counting house: x 8..40, three storeys above street + a cellar below ----
  const bx0=8, bx1=40;
  const roofY = 5, s1=8, s2=12, s3=16; // floor slab rows for storey ceilings/floors
  // outer shell walls
  vline(bx0, roofY, groundY, '#'); vline(bx1, roofY, groundY, '#');
  hline(bx0, bx1, roofY, '#');                       // roof
  // storey floors (walkable slabs)
  for(const fy of [s1, s2, s3, groundY]) hline(bx0+1, bx1-1, fy, '=');
  // rooms get names/surfaces: top floor carpeted study, mid tiled hall, ground counting room
  for(let x=bx0+1;x<=bx1-1;x++){ floorType[idx(x,s1)]='carpet'; floorType[idx(x,s2)]='tile'; }

  // interior partition walls (with door gaps)
  vline(24, roofY+1, s1-1, '#'); grid[idx(24,roofY+2)]=' ';  // attic split
  vline(20, s1+1, s2-1, '#');    // upper landing wall
  vline(30, s1+1, s2-1, '#');
  vline(28, s2+1, s3-1, '#');    // mid wall
  vline(16, s2+1, s3-1, '#');
  vline(32, s3+1, groundY-1, '#'); // strongroom wall on ground floor (right side)

  // ---- ladders / internal stairs connecting storeys ----
  // a service ladder shaft on the left interior (x=12) from ground up to attic
  for(let y=roofY+1; y<groundY; y++) if(grid[idx(12,y)]===' '||grid[idx(12,y)]==='=') grid[idx(12,y)]='H';
  // punch through the slabs where the ladder passes
  for(const fy of [s1,s2,s3]) grid[idx(12,fy)]='H';
  // a short stair on the right from ground to mid (x=36)
  for(let y=s2+1; y<groundY; y++) grid[idx(36,y)]='H';
  grid[idx(36,s3)]='H';

  // ---- doors ----
  const dspec = [
    [bx0, groundY-1, 1, 4, 'front door'],     // street entrance, left wall, locked
    [24, groundY-1, 0, 0, 'counting-room door'],
    [32, groundY-2, 1, 6, 'strongroom door'], // guards the vault on ground floor right
    [20, s2-1, 0, 0, 'landing door'],
    [28, s3-1, 0, 0, 'hall door'],
  ];
  for(const [x,y,lk,p,label] of dspec){
    grid[idx(x,y)] = 'D';
    doors.set(idx(x,y), { open:false, locked:!!lk, pins:p, label, x, y });
  }

  // ---- windows ----
  grid[idx(bx1, s2+1)] = 'N';    // right wall, mid storey
  grid[idx(bx0, s1+2)] = 'N';    // left wall, top storey
  openWin = new Set(); glass = new Set();

  // ---- weak floorboards (dig up targets): under the strongroom ----
  // strongroom is ground floor right of x=32; its floor is groundY
  for(const x of [34,35,36,37]) grid[idx(x,groundY)] = 'w';

  // ---- loot ----
  loot = [
    { x:14, y:s1-1, val:150, type:'coin', taken:false },   // attic purse
    { x:26, y:s2-1, val:150, type:'coin', taken:false },   // mid hall
    { x:18, y:groundY-1, val:150, type:'coin', taken:false },
    { x:37, y:groundY-1, val:2000, type:'box', taken:false }, // the strongbox, in the vault
  ];

  // ---- lamps (x,y tile centers, radius tiles) ----
  lamps = [
    { x:4.5,  y:groundY-1.5, r:7.5 },
    { x:W-6.5,y:groundY-1.5, r:7.5 },   // near the exit
    { x:26,   y:groundY-1.5, r:6.5 },   // street lamp in front of the house
    { x:14,   y:s2-1.5,      r:6 },     // interior mid
    { x:35,   y:groundY-1.5, r:5.5 },   // vault sconce — lights the strongbox
  ];

  // ---- guards patrolling floors (side-view: they walk a storey, can take ladders) ----
  guards = [
    mkGuard('street', [[10,groundY-1],[W-8,groundY-1]], true, groundY-1),
    mkGuard('ground', [[bx0+2,groundY-1],[30,groundY-1]], false, groundY-1),
    mkGuard('mid',    [[bx0+2,s2-1],[bx1-2,s2-1]], true, s2-1),
  ];

  // ---- earth below groundY ----
  genEarth(groundY, bx0, bx1);

  // ---- decorative furnishings (purely visual) ----
  // {x, y(floor row it stands on), type}; wall art uses w:true at its own cell
  decor = [
    // attic (floor s1=8): crates & a barrel
    {x:16,y:s1,t:'crate'}, {x:17,y:s1,t:'crateSm'}, {x:30,y:s1,t:'barrel'},
    // upper storey (floor s2=12): bookcase, desk, chair
    {x:15,y:s2,t:'bookcase'}, {x:32,y:s2,t:'desk'}, {x:34,y:s2,t:'chair'},
    // mid storey (floor s3=16): table, rug, wall painting
    {x:14,y:s3,t:'table'}, {x:34,y:s3,t:'crate'}, {x:22,y:s3,t:'rug',w:false},
    {x:16,y:14,t:'painting',wall:true},
    // ground counting room (floor 18): desk & stool
    {x:14,y:groundY,t:'desk'}, {x:16,y:groundY,t:'stool'},
    // strongroom: a strongbox pedestal / cabinet beside the loot
    {x:34,y:groundY,t:'cabinet'}, {x:30,y:groundY,t:'sconceStand'},
  ];

  bakeLight();
}

function genEarth(groundY, bx0, bx1){
  // everything below the street slab is earth 'E' with a material, except bedrock frame.
  for(let y=groundY+1; y<H-1; y++) for(let x=1; x<W-1; x++){
    grid[idx(x,y)] = 'E';
    mat[idx(x,y)] = 'L';
  }
  // bedrock shelf near the bottom + scattered boulders
  for(let y=H-4; y<H-1; y++) for(let x=1;x<W-1;x++){ mat[idx(x,y)]='K'; }
  for(const [x0,y0,x1,y1] of [[18,H-8,22,H-5],[44,H-9,49,H-6],[3,groundY+6,7,groundY+10]])
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(inb(x,y)&&grid[idx(x,y)]==='E') mat[idx(x,y)]='K';
  // 'K' cells are marked as bedrock via material; render/logic treat mat K as undiggable earth.
  for(let i=0;i<NC;i++) if(grid[i]==='E' && mat[i]==='K') grid[i]='K';

  // footings directly under the house walls + a clay skirt (the safe route hugs it)
  for(let y=groundY+1; y<=groundY+2; y++){ if(inb(bx0,y)) setMat(bx0,y,'B'); if(inb(bx1,y)) setMat(bx1,y,'B'); }
  hline(bx0, bx1, groundY+1, 'E');            // ensure diggable band right under the slab
  for(let x=bx0;x<=bx1;x++){ if(mat[idx(x,groundY+1)]!=='B') setMat(x,groundY+1,'C'); } // clay skirt under the whole footprint
  // gravel pocket + roots to punish blind digging
  for(let y=groundY+3; y<=groundY+6; y++) for(let x=26;x<=33;x++) if(diggable(x,y)) setMat(x,y,'G');
  for(let y=groundY+2; y<=groundY+4; y++) for(let x=44;x<=50;x++) if(diggable(x,y)) setMat(x,y,'R');

  // ---- the sewer: an open horizontal main a few tiles down, reached by a street grate ----
  const sewerY = groundY + 8;
  // sewerY-1 is open void (headroom), sewerY is a walkable channel floor
  for(let x=6; x<=W-6; x++){ grid[idx(x,sewerY-1)]='S'; mat[idx(x,sewerY-1)]='S'; grid[idx(x,sewerY)]='='; floorType[idx(x,sewerY)]='street'; }
  // grate shaft from the street down into the sewer (x=5), with a rope already hanging into the void
  for(let y=groundY+1; y<=sewerY-1; y++){ grid[idx(5,y)]='S'; mat[idx(5,y)]='S'; ropes.add(idx(5,y)); }
  grid[idx(5,sewerY)]='='; floorType[idx(5,sewerY)]='street'; // landing at the shaft foot
  grid[idx(5,groundY)] = 'G_';   // grate on the street (special tile) -> we treat via specialGrate
  window.__grate = idx(5,groundY);
  // make the grate a walkable floor you can open/descend
  grid[idx(5,groundY)] = '=';
  floorType[idx(5,groundY)] = 'grate';
}

function setMat(x,y,m){ if(inb(x,y)&&grid[idx(x,y)]!=='#'){ grid[idx(x,y)]='E'; mat[idx(x,y)]=m; if(m==='K') grid[idx(x,y)]='K'; } }
function diggable(x,y){ return inb(x,y) && grid[idx(x,y)]==='E' && mat[idx(x,y)]!=='K'; }

function mkGuard(id, wps, lantern, lane){
  const [sx,sy] = wps[0];
  return { id, wps, wp:0, lantern, lane,
    x:sx*T+T/2, y:sy*T+T/2, dir:1, face:1,
    susp:0, floor:0, aware:1, state:'patrol',
    lastKnown:null, lastSeen:-99, holdT:0, sweepT:0, shouted:false,
    targetX:null, climbing:false, walkPhase:Math.random()*TAU };
}

// ============================================================
// Geometry: solidity, climb, sight, light
// ============================================================
function solid(i){                     // blocks movement as a wall/floor slab
  const k = grid[i];
  if(k==='#'||k==='K') return true;
  if(k==='=') return true;             // floor slab (special-cased for one-way in physics)
  if(k==='w') return true;             // weak board still a floor until dug
  if(k==='E') return !dug[i];          // undug earth is solid
  if(k==='D'){ const d=doors.get(i); return !(d&&d.open); }
  if(k==='N') return !openWin.has(i) && !glass.has(i);
  return false;
}
function opaque(i){
  const k = grid[i];
  if(k==='#'||k==='K') return true;
  if(k==='=') return true;             // can't see through a floor slab
  if(k==='w') return true;
  if(k==='E') return !dug[i];
  if(k==='D'){ const d=doors.get(i); return !(d&&d.open); }
  return false;                        // windows, ladders, ropes, sewer: see-through
}
function climbable(i){
  const k = grid[i];
  return k==='H' || (k==='r') || ropes.has(i) || k==='S';
}
function passableForFall(i){           // can a body occupy this cell (not solid)?
  return !solid(i);
}

// tile LOS
function los(x0,y0,x1,y1){
  const d = Math.hypot(x1-x0,y1-y0);
  const steps = Math.max(1, Math.ceil(d/0.4));
  for(let s=1;s<steps;s++){
    const t=s/steps, x=(x0+(x1-x0)*t)|0, y=(y0+(y1-y0)*t)|0;
    if(!inb(x,y)) return false;
    if(opaque(idx(x,y))) return false;
  }
  return true;
}

function bakeLight(){
  lightmap = new Float32Array(NC);
  for(const lm of lamps){
    const r = lm.r;
    for(let y=Math.max(0,(lm.y-r)|0); y<=Math.min(H-1,(lm.y+r)|0); y++)
      for(let x=Math.max(0,(lm.x-r)|0); x<=Math.min(W-1,(lm.x+r)|0); x++){
        const d = Math.hypot(x+0.5-lm.x, y+0.5-lm.y);
        if(d>r) continue;
        if(!los(lm.x,lm.y,x+0.5,y+0.5)) continue;
        const v = Math.pow(clamp(1-d/r,0,1), 0.6); const i=idx(x,y);
        if(v>lightmap[i]) lightmap[i]=v;
      }
  }
}
function lightAtPx(px,py){
  const tx=clamp((px/T)|0,0,W-1), ty=clamp((py/T)|0,0,H-1);
  let v = lightmap[idx(tx,ty)];
  for(const g of guards){
    if(!g.lantern) continue;
    const d = Math.hypot(px-g.x,py-g.y)/T;
    if(d<4.5 && los(g.x/T,g.y/T,px/T,py/T)) v=Math.max(v,(1-d/4.5)*0.95);
  }
  return clamp(v,0.16,1);
}

// ============================================================
// Sound propagation (BFS flood, edge costs)
// ============================================================
function soundCost(ni){
  const k = grid[ni];
  if(k==='#'||k==='K') return -1;
  if(k==='E') return dug[ni] ? 0 : 7;      // packed earth muffles hard
  if(k==='='||k==='w') return dug[ni]?0:6; // through a floor slab
  if(k==='D'){ const d=doors.get(ni); return d&&d.open?1:11; }
  if(k==='N') return (openWin.has(ni)||glass.has(ni))?2:12;
  return 0;                                 // air, ladder, rope, sewer, street
}
function emitSound(cx,cy,L,opts={}){
  if(L<=0) return;
  const best = new Float32Array(NC).fill(-1);
  const si = idx(clamp(cx,0,W-1),clamp(cy,0,H-1));
  best[si]=L; const q=[si];
  while(q.length){
    const i=q.shift(); const Lh=best[i]; if(Lh<=0) continue;
    const x=i%W, y=(i/W)|0;
    for(const [dx,dy] of DIR4){
      const nx=x+dx, ny=y+dy; if(!inb(nx,ny)) continue;
      const ni=idx(nx,ny); const ec=soundCost(ni); if(ec<0) continue;
      const nl=Lh-1-ec; if(nl>best[ni]){ best[ni]=nl; q.push(ni); }
    }
  }
  if(!opts.silentToGuards){
    for(const g of guards){
      const gi=idx((g.x/T)|0,(g.y/T)|0); const heard=best[gi]; const thr=4;
      if(heard>thr){
        g.lastKnown={x:cx*T+T/2,y:cy*T+T/2};
        g.susp=clamp(g.susp+(heard-thr)*7*g.aware, g.floor, 100);
        if(heard>=18) g.susp=Math.max(g.susp,86);
        if(g.susp>=25) stats.ghost=false;
      }
    }
  }
  const cells=[]; for(let i=0;i<NC;i++) if(best[i]>0) cells.push([i,best[i]]);
  rings.push({ cells, t:0.9, max:L });
}

// ============================================================
// Audio (procedural)
// ============================================================
let AC=null;
function ac(){ try{ if(!AC && typeof AudioContext!=='undefined') AC=new AudioContext();
  if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function blip(f,dur,type,gain){ const a=ac(); if(!a) return;
  try{ const o=a.createOscillator(),g=a.createGain(); o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(gain||0.08,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);}catch(e){} }
function noiseBurst(dur,gain,freq){ const a=ac(); if(!a) return;
  try{ const n=Math.floor(a.sampleRate*dur); const buf=a.createBuffer(1,n,a.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=a.createBufferSource(); src.buffer=buf; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||500;
    const g=a.createGain(); g.gain.value=gain||0.1; src.connect(f); f.connect(g); g.connect(a.destination); src.start();}catch(e){} }
const sfx = {
