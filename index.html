<body>
<canvas id="g" width="1152" height="576"></canvas>
<div id="rotate"><div>&#8635;<br><b>S P O I L</b><br>turn your device sideways &mdash;<br>this job is worked in landscape</div></div>
<script>
// ============================================================
// SPOIL — side-view cut-through burglary. Canvas 2D, zero libs.
// The house stands in cross-section; the earth below is yours to dig.
// ============================================================

const PAL = {
  void:  '#0A0C11',
  draft: '#2E4260',
  chalk: '#BFCBD9',
  sodium:'#E9A23B',
  verd:  '#4E9C86',
  oxide: '#B8433A',
};

// world is a tile grid seen edge-on. y grows downward (sky -> roof -> floors -> earth -> bedrock).
const W = 64, H = 44, T = 24, NC = W * H;
const SCALE = 2.4;                     // zoomed out: see guards coming with room to hide or run
const VW = 480, VH = 210;              // world viewport (20 x 8.75 tiles visible)
const HUD_H = 72;                      // slim HUD so the short landscape view keeps its height
const CW = VW * SCALE, CH = VH * SCALE + HUD_H; // canvas: 1152 x 576 (fills a landscape phone, ~2:1)
const STICK = { x:168, y:372, r:76, nub:34 };   // fixed on-screen thumbstick (lower-left)
const TAU = Math.PI * 2;
const DIR4 = [[1,0],[-1,0],[0,1],[0,-1]];

const idx = (x,y) => y*W + x;
const inb = (x,y) => x>=0 && y>=0 && x<W && y<H;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const sign = v => v<0?-1:v>0?1:0;

function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(h1,h2,t){ const a=hexRGB(h1),b=hexRGB(h2); t=clamp(t,0,1);
  return `rgb(${(a[0]+(b[0]-a[0])*t)|0},${(a[1]+(b[1]-a[1])*t)|0},${(a[2]+(b[2]-a[2])*t)|0})`; }

// ---------- tile kinds ----------
// Each cell has: k (kind char), plus dig state for earth.
// AIR ' '  passable open air (rooms, sky, dug tunnels)
// SOLID '#' brick wall / bedrock border — impassable, opaque, blocks sound hard
// FLOOR '=' a walkable floor slab (solid to stand on, blocks vertical movement & sight down)
// WEAK 'w'  a floorboard you can dig UP through from below / pry from above
// LADDER 'H' climbable (interior stair/ladder)
// ROPE 'r'  climbable rope you deploy or that hangs in a shaft
// DOOR 'D'  handled via doors map (locked/pins)
// WINDOW 'N' glass — see through, cut or smash to pass
// EARTH materials (dig grid): L C R G U B  (loam clay root gravel rubble footing)
// BEDROCK 'K' undiggable
// SEWER 'S' open void underground (free move, dump spoil)
// LAMP posts handled separately

const MAT = {
  L: { t:1.6, n:1, name:'loam',          col:'#3a2f24' },
  C: { t:3.4, n:1, name:'clay',          col:'#4a3a48' },
  R: { t:5.0, n:0, name:'root mass',     col:'#2c3a2c' },
  G: { t:4.2, n:3, name:'gravel',        col:'#4a4640' },
  B: { t:9.0, n:6, name:'brick footing', col:'#5a3630' },
};
const isEarth = k => MAT[k] !== undefined;

// ---------- movement tiers (horizontal) ----------
// loudness base per footfall; stance affects how visible you are; height = collision box.
const TIERS = [
  { name:'SNEAK', spd:42,  base:1, int:0.60, stance:0.60, h:14 },
  { name:'WALK',  spd:66,  base:6, int:0.46, stance:1.00, h:20 },
  { name:'RUN',   spd:150, base:9, int:0.30, stance:1.15, h:20 },  // outruns any guard — but the whole street hears it
];

// surface loudness by what you're standing on
const FLOOR_MULT = { '=':1.0, 'w':1.2, 'street':1.2, 'carpet':0.4, 'tile':1.3 };

// ============================================================
// Level state
// ============================================================
let grid;              // Uint8-ish: we store chars in a normal array for clarity
let mat;              // earth material per cell (only meaningful where grid==='E')
let dug;             // bool per cell: earth that's been excavated (tunnels are auto-shored)
let floorType;       // per-floor surface tag for loudness (carpet/tile) keyed by cell
let doors;           // Map cell -> {open,locked,pins,label,x,y}
let openWin;         // Set of window cells opened (glass cut)
let ropes;           // Set of cells with a deployed/there rope
let lamps, loot, guards, lightmap, exitPx, decor, hideCells, hood, camBottom, building;
let level=0;
const LEVEL_INFO = [
  { name:'The Chandler\u2019s Shop', place:'Tallow Lane',
    blurb:'The chandler shorted your wages and the rent falls due at dawn.',
    goal:'take back what\u2019s owed \u2014 the cashbox in the back room' },
  { name:'The Counting House', place:'Guilder\u2019s Row',
    blurb:'Word on the lane: the banker\u2019s strongbox sits fat behind three storeys of locks.',
    goal:'take the strongbox from the ground-floor vault' },
];
const LEVEL_NAMES = LEVEL_INFO.map(l=>l.name);
const LEVELS = LEVEL_INFO.length;
const SAVE_KEY = 'spoil.progress.v1';
const VERSION = '2026.09.09-0046';
let prog = { xp:0, best:0, level:0 };
function save(){ try{ if(typeof localStorage!=='undefined') localStorage.setItem(SAVE_KEY, JSON.stringify(prog)); }catch(e){} }
function load(){ try{ if(typeof localStorage!=='undefined'){ const r=localStorage.getItem(SAVE_KEY);
  if(r){ const d=JSON.parse(r); if(d&&typeof d==='object'){ prog.xp=d.xp|0; prog.best=d.best|0; prog.level=clamp(d.level|0,0,LEVELS-1); } } } }catch(e){} }
let exploredSet, visSet;
let player, mode, msgState, floaters, rings, shake, stats, cam, gameT;
let tutMsg={text:'',t:0}, tutSeen=new Set();
let parts=[];   // particle system: {x,y,vx,vy,life,max,col,size,grav,kind}
function spawn(n,x,y,opt){ for(let i=0;i<n;i++){ if(parts.length>260) parts.shift();
  const a=(opt.ang||0)+(Math.random()-0.5)*(opt.spread||TAU), sp=(opt.speed||20)*(0.5+Math.random());
  parts.push({ x:x+(Math.random()-0.5)*(opt.jx||4), y:y+(Math.random()-0.5)*(opt.jy||2), vx:Math.cos(a)*sp+(opt.vx||0), vy:Math.sin(a)*sp+(opt.vy||0),
    life:0, max:(opt.life||0.6)*(0.6+Math.random()*0.8), col:opt.col||'rgba(191,203,217,0.5)', size:opt.size||1.6, grav:opt.grav==null?60:opt.grav, kind:opt.kind||'dot' }); } }
function partsUpdate(dt){ for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life+=dt; if(p.life>=p.max){ parts.splice(i,1); continue; }
  p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.98; } }
function drawParts(){ for(const p of parts){ const a=1-p.life/p.max; ctx.globalAlpha=a;
  if(p.kind==='ring'){ ctx.strokeStyle=p.col; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(p.x,p.y,p.size+p.life*18,0,TAU); ctx.stroke(); }
  else if(p.kind==='spark'){ ctx.fillStyle=p.col; ctx.fillRect(p.x-0.6,p.y-2,1.2,4); ctx.fillRect(p.x-2,p.y-0.6,4,1.2); }
  else { ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.6+a*0.6),0,TAU); ctx.fill(); } }
  ctx.globalAlpha=1; ctx.lineWidth=1; }
let levelIntroT=0, introLevel=-1, fadeT=0, flashT=0, alertCount=0;
function nextAfterEnd(){ if(mode==='escaped') level=(level+1)%LEVELS; introLevel=-1; resetRun(); mode='play'; }
let lock, action;

function fill(x0,y0,x1,y1,ch){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(inb(x,y)) grid[idx(x,y)]=ch; }
function hline(x0,x1,y,ch){ for(let x=x0;x<=x1;x++) if(inb(x,y)) grid[idx(x,y)]=ch; }
function vline(x,y0,y1,ch){ for(let y=y0;y<=y1;y++) if(inb(x,y)) grid[idx(x,y)]=ch; }

function baseWorld(groundY){
  grid = new Array(NC).fill(' ');
  mat = new Array(NC).fill('L');
  dug = new Array(NC).fill(false);
  floorType = new Array(NC).fill('=');
  doors = new Map(); openWin = new Set(); ropes = new Set(); hideCells = new Set();
  // bedrock frame
  hline(0, W-1, H-1, '#'); vline(0, 0, H-1, '#'); vline(W-1, 0, H-1, '#');
  // street
  hline(1, W-2, groundY, '='); for(let x=1;x<=W-2;x++) floorType[idx(x,groundY)]='street';
  // exit: lit alley on the right
  for(let y=groundY-3; y<groundY; y++){ grid[idx(W-3,y)]=' '; grid[idx(W-2,y)]='X'; }
  grid[idx(W-2,groundY-1)]='X'; grid[idx(W-3,groundY-1)]='X';
  exitPx = { x:(W-2.5)*T, y:(groundY-2)*T };
}

function genLevel(){
  if(level===0) genShop(); else genCountingHouse();
  buildHideCells();
  bakeLight();
}

function buildHideCells(){
  hideCells = new Set();
  const hideable = { bookcase:1, cabinet:1, barrel:1, crate:1, armoire:1, clock:1, curtain:1, sacks:1, coatrack:1, armour:1, cart:1 };
  for(const d of (decor||[])) if(hideable[d.t] && !d.wall) hideCells.add(idx(d.x, d.y-1));
}

// ---------- LEVEL 1: an easy bit of petty theft ----------
function genShop(){
  const groundY=18;
  baseWorld(groundY);
  // Tallow Lane: neighbours' houses flank the shop (backdrop only)
  hood = [ {x0:2,x1:5,h:4,win:[1,2]}, {x0:6,x1:10,h:5,win:[1,3]},
           {x0:38,x1:42,h:5,win:[2,3]}, {x0:43,x1:47,h:4,win:[1]}, {x0:49,x1:55,h:6,win:[2,4]}, {x0:56,x1:59,h:4,win:[1,3]} ];
  const bx0=12, bx1=36, roofY=13;
  building={ x0:bx0, x1:bx1, top:roofY, ground:groundY, storeys:[ {top:roofY+1, floor:groundY, tint:'#3b2f1d', paper:'stripe'} ] };
  vline(bx0, roofY, groundY, '#'); vline(bx1, roofY, groundY, '#');
  hline(bx0, bx1, roofY, '#');
  hline(bx0+1, bx1-1, groundY, '=');
  for(let x=bx0+1;x<=bx1-1;x++) floorType[idx(x,groundY)]='tile';
  // back-room partition
  vline(28, roofY+1, groundY-1, '#');
  // shop door — UNLOCKED (just walk in); back-room door is an easy 3-pin
  grid[idx(bx0,groundY-1)]='D'; doors.set(idx(bx0,groundY-1),{open:false,locked:false,pins:0,label:'shop door',x:bx0,y:groundY-1});
  grid[idx(28,groundY-1)]='D'; doors.set(idx(28,groundY-1),{open:false,locked:true,pins:3,label:'back-room door',x:28,y:groundY-1});
  // a low window on the right as an alternate way out to the alley
  grid[idx(bx1,groundY-1)]='N';
  // loot: the till (bonus) and the cashbox (the job)
  loot = [ {x:20,y:groundY-1,val:120,type:'coin',taken:false},
           {x:15,y:groundY-1,val:90,type:'candle',taken:false},
           {x:31,y:groundY-1,val:140,type:'watch',taken:false},
           {x:33,y:groundY-1,val:500,type:'box',taken:false} ];
  lamps = [ {x:6,y:groundY-1.5,r:7}, {x:W-6.5,y:groundY-1.5,r:7.5}, {x:20,y:groundY-1.5,r:6}, {x:32,y:groundY-1.5,r:5} ];
  // one slow, none-too-sharp watchman in the front room
  const g=mkGuard('watchman', [[14,groundY-1],[26,groundY-1]], true, groundY-1, {speed:36, pause:2.4}); g.aware=0.7; guards=[g];
  camBottom=(groundY+1.6)*T;   // nothing underground here — frame the house, not black earth
  // solid ground — no tunnelling on the easy job
  for(let y=groundY+1;y<H-1;y++) for(let x=1;x<W-1;x++){ grid[idx(x,y)]='K'; mat[idx(x,y)]='K'; }
  // furnishings — the bookcases and barrels double as hiding spots
  decor = [ {x:13,y:groundY,t:'coatrack'}, {x:14,y:groundY,t:'candleRack'}, {x:16,y:groundY,t:'bookcase'}, {x:18,y:groundY,t:'barrel'},
            {x:21,y:groundY,t:'cat'}, {x:27,y:groundY,t:'basin'}, {x:29,y:groundY,t:'range'}, {x:40,y:groundY,t:'cart'},
            {x:19,y:groundY,t:'waxVat'}, {x:20,y:groundY,t:'desk'}, {x:22,y:groundY,t:'stool'},
            {x:24,y:groundY,t:'bookcase'}, {x:26,y:groundY,t:'plant'},
            {x:17,y:groundY-2,t:'shelfJars',wall:true}, {x:25,y:groundY-2,t:'shelfJars',wall:true},
            {x:21,y:groundY-3,t:'chandelier',wall:true},
            {x:30,y:groundY,t:'sacks'}, {x:31,y:groundY,t:'crate'}, {x:33,y:groundY,t:'cabinet'},
            {x:34,y:groundY,t:'clock'} ];
}

// ---------- LEVEL 2: the counting house (the full heist) ----------
function genCountingHouse(){
  const groundY = 18;
  baseWorld(groundY); camBottom=H*T;
  // Guilder's Row: grand terraces either side of the counting house (backdrop only)
  hood = [ {x0:1,x1:6,h:6,win:[2,4]},
           {x0:42,x1:46,h:7,win:[2,5]}, {x0:47,x1:52,h:5,win:[1,3]}, {x0:53,x1:59,h:8,win:[2,4,6]} ];
  const bx0=8, bx1=40;
  const roofY = 5, s1=8, s2=12, s3=16;
  building={ x0:bx0, x1:bx1, top:roofY, ground:groundY, storeys:[
    {top:roofY+1, floor:s1, tint:'#2a2620', paper:'plaster'},
    {top:s1+1,   floor:s2, tint:'#1f3a2c', paper:'damask'},
    {top:s2+1,   floor:s3, tint:'#3c1f2a', paper:'stripe'},
    {top:s3+1,   floor:groundY, tint:'#3b2f1d', paper:'stripe'} ] };
  vline(bx0, roofY, groundY, '#'); vline(bx1, roofY, groundY, '#');
  hline(bx0, bx1, roofY, '#');
  for(const fy of [s1, s2, s3, groundY]) hline(bx0+1, bx1-1, fy, '=');
  for(let x=bx0+1;x<=bx1-1;x++){ floorType[idx(x,s1)]='carpet'; floorType[idx(x,s2)]='tile'; }

  vline(24, roofY+1, s1-1, '#'); grid[idx(24,roofY+2)]=' ';
  vline(20, s1+1, s2-1, '#');
  vline(30, s1+1, s2-1, '#');
  vline(28, s2+1, s3-1, '#');
  vline(16, s2+1, s3-1, '#');
  vline(32, s3+1, groundY-1, '#');

  for(let y=roofY+1; y<groundY; y++) if(grid[idx(12,y)]===' '||grid[idx(12,y)]==='=') grid[idx(12,y)]='H';
  for(const fy of [s1,s2,s3]) grid[idx(12,fy)]='H';
  for(let y=s2+1; y<groundY; y++) grid[idx(36,y)]='H';
  grid[idx(36,s3)]='H';

  const dspec = [
    [bx0, groundY-1, 1, 3, 'front door'],       // eased 4->3
    [24, groundY-1, 0, 0, 'counting-room door'],
    [32, groundY-1, 1, 4, 'strongroom door'],   // at body height
    [20, s2-1, 0, 0, 'landing door'],
    [28, s3-1, 0, 0, 'hall door'],
  ];
  for(const [x,y,lk,p,label] of dspec){ grid[idx(x,y)]='D'; doors.set(idx(x,y),{open:false,locked:!!lk,pins:p,label,x,y}); }

  grid[idx(bx1, s3-1)] = 'N';   // right wall, mid storey — at body height
  grid[idx(bx0, s2-1)] = 'N';   // left wall, upper storey — at body height

  for(const x of [34,35,36,37]) grid[idx(x,groundY)] = 'w';

  loot = [
    { x:14, y:s1-1, val:150, type:'coin', taken:false },
    { x:28, y:s1-1, val:260, type:'jewel', taken:false },      // in the attic armoire
    { x:26, y:s2-1, val:150, type:'coin', taken:false },
    { x:33, y:s2-1, val:220, type:'watch', taken:false },      // on the study desk
    { x:15, y:s3-1, val:120, type:'candle', taken:false },     // hall table
    { x:18, y:groundY-1, val:150, type:'coin', taken:false },
    { x:15, y:groundY-1, val:180, type:'ledger', taken:false },// the counting desk
    { x:57, y:groundY+3, val:300, type:'jar', taken:false },   // buried beside the alley manhole — dig for it
    { x:37, y:groundY-1, val:2000, type:'box', taken:false },
  ];
  lamps = [
    { x:4.5,  y:groundY-1.5, r:7.5 },
    { x:W-6.5,y:groundY-1.5, r:7.5 },
    { x:26,   y:groundY-1.5, r:6.5 },
    { x:14,   y:s2-1.5,      r:6 },
    { x:35,   y:groundY-1.5, r:5.5 },
  ];
  guards = [
    mkGuard('street', [[42,groundY-1],[W-7,groundY-1]], true, groundY-1, {speed:44, pause:1.4}),
    mkGuard('ground', [[bx0+2,groundY-1],[30,groundY-1]], false, groundY-1, {speed:42, pause:2.0}),
    mkGuard('mid',    [[bx0+2,s2-1],[bx1-2,s2-1]], true, s2-1, {speed:44, pause:1.6}),
  ];
  genEarth(groundY, bx0, bx1);
  decor = [
    // attic: stores
    {x:16,y:s1,t:'crate'}, {x:17,y:s1,t:'crateSm'}, {x:19,y:s1,t:'bed'}, {x:22,y:s1,t:'sacks'},
    {x:28,y:s1,t:'armoire'}, {x:30,y:s1,t:'barrel'},
    // upper storey: the study
    {x:15,y:s2,t:'bookcase'}, {x:18,y:s2,t:'clock'}, {x:24,y:s2,t:'globe'}, {x:27,y:s2,t:'piano'}, {x:25,y:s2-2,t:'birdcage',wall:true}, {x:26,y:s2,t:'plant'},
    {x:32,y:s2,t:'desk'}, {x:34,y:s2,t:'chair'}, {x:22,y:s2-2,t:'chandelier',wall:true},
    // mid storey: the hall
    {x:14,y:s3,t:'table'}, {x:18,y:s3,t:'hearth'}, {x:22,y:s3,t:'rug',w:false},
    {x:26,y:s3,t:'curtain'}, {x:31,y:s3,t:'armour'}, {x:33,y:s3-2,t:'mirror',wall:true}, {x:34,y:s3,t:'crate'}, {x:19,y:s3,t:'cat'},
    {x:16,y:14,t:'painting',wall:true}, {x:24,y:14,t:'painting',wall:true},
    // ground: the counting room
    {x:11,y:groundY,t:'armoire'}, {x:12,y:groundY,t:'coatrack'}, {x:14,y:groundY,t:'desk'}, {x:15,y:groundY,t:'scale'}, {x:16,y:groundY,t:'crate'}, {x:47,y:groundY,t:'cart'},
    {x:20,y:groundY,t:'clock'}, {x:22,y:groundY,t:'sacks'}, {x:26,y:groundY,t:'plant'},
    // the strongroom
    {x:34,y:groundY,t:'cabinet'}, {x:30,y:groundY,t:'sconceStand'},
  ];
}

function genEarth(groundY, bx0, bx1){
  // everything below the street slab is earth 'E' with a material, except bedrock frame.
  for(let y=groundY+1; y<H-1; y++) for(let x=1; x<W-1; x++){
    grid[idx(x,y)] = 'E';
    mat[idx(x,y)] = 'L';
  }
  // bedrock shelf near the bottom + scattered boulders
  for(let y=H-4; y<H-1; y++) for(let x=1;x<W-1;x++){ mat[idx(x,y)]='K'; }
  for(const [x0,y0,x1,y1] of [[18,H-8,22,H-5],[44,H-9,49,H-6],[3,groundY+6,7,groundY+10]])
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(inb(x,y)&&grid[idx(x,y)]==='E') mat[idx(x,y)]='K';
  // 'K' cells are marked as bedrock via material; render/logic treat mat K as undiggable earth.
  for(let i=0;i<NC;i++) if(grid[i]==='E' && mat[i]==='K') grid[i]='K';

  // footings directly under the house walls + a clay skirt (the safe route hugs it)
  for(let y=groundY+1; y<=groundY+2; y++){ if(inb(bx0,y)) setMat(bx0,y,'B'); if(inb(bx1,y)) setMat(bx1,y,'B'); }
  hline(bx0, bx1, groundY+1, 'E');            // ensure diggable band right under the slab
  for(let x=bx0;x<=bx1;x++){ if(mat[idx(x,groundY+1)]!=='B') setMat(x,groundY+1,'C'); } // clay skirt under the whole footprint
  // gravel pocket + roots to punish blind digging
  for(let y=groundY+3; y<=groundY+6; y++) for(let x=26;x<=33;x++) if(diggable(x,y)) setMat(x,y,'G');
  for(let y=groundY+2; y<=groundY+4; y++) for(let x=44;x<=50;x++) if(diggable(x,y)) setMat(x,y,'R');

  // ---- the sewer: an open horizontal main a few tiles down, reached by a street grate ----
  const sewerY = groundY + 8;
  // sewerY-1 is open void (headroom), sewerY is a walkable channel floor
  for(let x=6; x<=W-5; x++){ grid[idx(x,sewerY-1)]='S'; mat[idx(x,sewerY-1)]='S'; grid[idx(x,sewerY)]='='; floorType[idx(x,sewerY)]='street'; }
  // the alley manhole: an iron ladder from the sewer up to the street by the exit (x=59)
  for(let y=groundY+1; y<=sewerY-1; y++){ grid[idx(59,y)]='S'; mat[idx(59,y)]='S'; ropes.add(idx(59,y)); }
  grid[idx(59,groundY)]='H'; floorType[idx(59,groundY)]='street';
  // grate shaft from the street down into the sewer (x=5), with a rope already hanging into the void
  for(let y=groundY+1; y<=sewerY-1; y++){ grid[idx(5,y)]='S'; mat[idx(5,y)]='S'; ropes.add(idx(5,y)); }
  grid[idx(5,sewerY)]='='; floorType[idx(5,sewerY)]='street'; // landing at the shaft foot
  // make the grate a walkable floor you can open/descend
  grid[idx(5,groundY)] = '=';
  floorType[idx(5,groundY)] = 'grate';
}

function setMat(x,y,m){ if(inb(x,y)&&grid[idx(x,y)]!=='#'){ grid[idx(x,y)]='E'; mat[idx(x,y)]=m; if(m==='K') grid[idx(x,y)]='K'; } }
function diggable(x,y){ return inb(x,y) && grid[idx(x,y)]==='E' && mat[idx(x,y)]!=='K'; }

function mkGuard(id, wps, lantern, lane, opts={}){
  const [sx,sy] = wps[0];
  return { id, wps, wp:0, lantern, lane, speed:opts.speed||46, pause:opts.pause==null?1.6:opts.pause, holdWp:0,
    x:sx*T+T/2, y:sy*T+T/2, dir:1, face:1,
    susp:0, floor:0, aware:1, state:'patrol',
    lastKnown:null, lastSeen:-99, holdT:0, sweepT:0, shouted:false,
    walkPhase:Math.random()*TAU };
}

// ============================================================
// Geometry: solidity, climb, sight, light
// ============================================================
function solid(i){                     // blocks movement as a wall/floor slab
  const k = grid[i];
  if(k==='#'||k==='K') return true;
  if(k==='=') return true;             // floor slab (special-cased for one-way in physics)
  if(k==='w') return true;             // weak board still a floor until dug
  if(k==='E') return !dug[i];          // undug earth is solid
  if(k==='D'){ const d=doors.get(i); return !(d&&d.open); }
  if(k==='N') return !openWin.has(i);
  return false;
}
function opaque(i){
  const k = grid[i];
  if(k==='#'||k==='K') return true;
  if(k==='=') return true;             // can't see through a floor slab
  if(k==='w') return true;
  if(k==='E') return !dug[i];
  if(k==='D'){ const d=doors.get(i); return !(d&&d.open); }
  return false;                        // windows, ladders, ropes, sewer: see-through
}
function climbable(i){
  const k = grid[i];
  return k==='H' || (k==='r') || ropes.has(i) || k==='S' || (k==='E' && dug[i]);   // shored tunnels have timber rungs
}

// tile LOS
function los(x0,y0,x1,y1){
  const d = Math.hypot(x1-x0,y1-y0);
  const steps = Math.max(1, Math.ceil(d/0.4));
  for(let s=1;s<steps;s++){
    const t=s/steps, x=(x0+(x1-x0)*t)|0, y=(y0+(y1-y0)*t)|0;
    if(!inb(x,y)) return false;
    if(opaque(idx(x,y))) return false;
  }
  return true;
}

function bakeLight(){
  lightmap = new Float32Array(NC);
  for(const lm of lamps){
    const r = lm.r;
    for(let y=Math.max(0,(lm.y-r)|0); y<=Math.min(H-1,(lm.y+r)|0); y++)
      for(let x=Math.max(0,(lm.x-r)|0); x<=Math.min(W-1,(lm.x+r)|0); x++){
        const d = Math.hypot(x+0.5-lm.x, y+0.5-lm.y);
        if(d>r) continue;
        if(!los(lm.x,lm.y,x+0.5,y+0.5)) continue;
        const v = Math.pow(clamp(1-d/r,0,1), 0.6); const i=idx(x,y);
        if(v>lightmap[i]) lightmap[i]=v;
      }
  }
}
function lightAtPx(px,py){
  const tx=clamp((px/T)|0,0,W-1), ty=clamp((py/T)|0,0,H-1);
  let v = lightmap[idx(tx,ty)];
  for(const g of guards){
    if(!g.lantern) continue;
    const d = Math.hypot(px-g.x,py-g.y)/T;
    if(d<4.5 && los(g.x/T,g.y/T,px/T,py/T)) v=Math.max(v,(1-d/4.5)*0.95);
  }
  return clamp(v,0.16,1);
}

// ============================================================
// Sound propagation (BFS flood, edge costs)
// ============================================================
function soundCost(ni){
  const k = grid[ni];
  if(k==='#'||k==='K') return -1;
  if(k==='E') return dug[ni] ? 0 : 7;      // packed earth muffles hard
  if(k==='='||k==='w') return dug[ni]?0:6; // through a floor slab
  if(k==='D'){ const d=doors.get(ni); return d&&d.open?1:11; }
  if(k==='N') return openWin.has(ni)?2:12;
  return 0;                                 // air, ladder, rope, sewer, street
}
function emitSound(cx,cy,L){
  if(L<=0) return;
  const best = new Float32Array(NC).fill(-1);
  const si = idx(clamp(cx,0,W-1),clamp(cy,0,H-1));
  best[si]=L; const q=[si];
  while(q.length){
    const i=q.shift(); const Lh=best[i]; if(Lh<=0) continue;
    const x=i%W, y=(i/W)|0;
    for(const [dx,dy] of DIR4){
      const nx=x+dx, ny=y+dy; if(!inb(nx,ny)) continue;
      const ni=idx(nx,ny); const ec=soundCost(ni); if(ec<0) continue;
      const nl=Lh-1-ec; if(nl>best[ni]){ best[ni]=nl; q.push(ni); }
    }
  }
  {
    for(const g of guards){
      const gi=idx((g.x/T)|0,(g.y/T)|0); const heard=best[gi]; const thr=4;
      if(heard>thr){
        g.lastKnown={x:cx*T+T/2,y:cy*T+T/2};
        g.susp=clamp(g.susp+(heard-thr)*7*g.aware, g.floor, 100);
        if(heard>=18) g.susp=Math.max(g.susp,86);
        if(g.susp>=25) stats.ghost=false;
      }
    }
  }
  const cells=[]; for(let i=0;i<NC;i++) if(best[i]>0) cells.push([i,best[i]]);
  rings.push({ cells, t:0.9, max:L });
}

// ============================================================
// Audio (procedural)
// ============================================================
let AC=null;
function ac(){ try{ if(!AC && typeof AudioContext!=='undefined') AC=new AudioContext();
  if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function blip(f,dur,type,gain){ const a=ac(); if(!a) return;
  try{ const o=a.createOscillator(),g=a.createGain(); o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(gain||0.08,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);}catch(e){} }
function noiseBurst(dur,gain,freq){ const a=ac(); if(!a) return;
  try{ const n=Math.floor(a.sampleRate*dur); const buf=a.createBuffer(1,n,a.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=a.createBufferSource(); src.buffer=buf; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||500;
    const g=a.createGain(); g.gain.value=gain||0.1; src.connect(f); f.connect(g); g.connect(a.destination); src.start();}catch(e){} }
const sfx = {
  step:l=>noiseBurst(0.05,clamp(0.02+l*0.012,0.02,0.3),320+l*40),
  click:()=>blip(1700,0.03,'square',0.09),
  thud:()=>blip(170,0.08,'sine',0.12),
  snap:()=>{ blip(300,0.05,'sawtooth',0.15); noiseBurst(0.08,0.12,2500); },
  dig:l=>noiseBurst(0.13,0.03+l*0.01,210),
  alert:()=>{ blip(520,0.12,'square',0.12); setTimeout(()=>blip(660,0.16,'square',0.12),120); },
  coin:()=>{ blip(1300,0.05,'sine',0.1); setTimeout(()=>blip(1750,0.07,'sine',0.1),50); },
  unlock:()=>{ blip(900,0.05,'square',0.1); setTimeout(()=>blip(600,0.1,'square',0.1),70); },
  land:()=>blip(120,0.06,'sine',0.14),
};

// ============================================================
// Player + reset
// ============================================================
function resetRun(){
  genLevel();
  player = {
    x: 3*T+T/2, y: (18-1)*T+T/2,     // on the street, left end (groundY-1 = 17)
    vx:0, vy:0, onGround:true, climbing:false, tier:1, sneak:false, dir:1, hidden:false,
    picks:3,
    lootVal:0, stepT:0, coyote:0, walkPhase:0, prevH:TIERS[1].h,
  };
  exploredSet=new Set(); visSet=new Set();
  rings=[]; floaters=[]; shake=0; gameT=0;
  msgState={text:'',t:0}; lock=null; action=null; tutMsg={text:'',t:0}; levelIntroT=0;
  cam={x:player.x, y:player.y};
  stats={ ghost:true, snapped:false, alerted:false, picked:0, cause:'', payout:null, campaignDone:false };
}
function settleHeist(){
  let mult=1; const rows=[['take', `${player.lootVal} coin`]];
  if(stats.ghost){ mult*=1.5; rows.push(['GHOST \u2014 no guard ever stirred','\u00d71.5']); }
  if(loot.every(l=>l.taken)){ mult*=1.2; rows.push(['FULL HAUL \u2014 nothing left behind','\u00d71.2']); }
  const clean=!stats.snapped && !stats.alerted;
  if(clean){ mult*=1.25; rows.push(['CLEAN \u2014 no alarm, no broken picks','\u00d71.25']); }
  else { const ev=[]; if(stats.alerted) ev.push('the alarm was raised'); if(stats.snapped) ev.push('a snapped pick');
    rows.push([`evidence: ${ev.join(', ')}`,'\u2014']); }
  const xp=Math.round((player.lootVal/10)*mult);
  stats.payout={ rows, xp };
  stats.campaignDone=(level===LEVELS-1);
  prog.xp+=xp; if(player.lootVal>prog.best) prog.best=player.lootVal;
  prog.level=(level+1)%LEVELS;
  save();
}
function msg(t){ msgState={text:t,t:4}; }
function tut(id,text){ if(tutSeen.has(id)) return; tutSeen.add(id); tutMsg={text,t:6}; }
function floater(x,y,text,col){ floaters.push({x,y,text,col:col||PAL.chalk,t:2.2}); }

const GRAV = 900, TERMV = 520, JUMP = 260;
const CLIMB_UP = 44, CLIMB_SIDE = 26;   // slow, deliberate climbing (independent of run speed)

function pTile(){ return [clamp((player.x/T)|0,0,W-1), clamp((player.y/T)|0,0,H-1)]; }
function pcell(){ const [x,y]=pTile(); return idx(x,y); }
function footCell(){ const x=(player.x/T)|0, y=((player.y+TIERS[player.tier].h*0.5+1)/T)|0; return inb(x,y)?idx(x,y):-1; }
function faceCell(){ const x=((player.x+player.dir*14)/T)|0, y=(player.y/T)|0; return inb(x,y)?idx(x,y):-1; }
function playerUpdate(dt){
  const runInput = keys[' '] || (touch.stickId!=null && Math.abs(touch.vec[0])>0.88);
  player.tier = runInput ? 2 : (player.sneak ? 0 : 1);   // sneak, walk, or run (run is loud)
  const tier = TIERS[player.tier];
  let ix=0, iy=0;
  if(keys['a']||keys['arrowleft']) ix-=1;
  if(keys['d']||keys['arrowright']) ix+=1;
  if(keys['w']||keys['arrowup']) iy-=1;
  if(keys['s']||keys['arrowdown']) iy+=1;
  if(touch.stickId!=null){                 // fixed thumbstick, axis-priority
    const vx=touch.vec[0], vy=touch.vec[1], ax=Math.abs(vx), ay=Math.abs(vy);
    if(ax>0.34) ix=sign(vx);               // walking is always available
    if(ay>0.5 && ay>ax) iy=sign(vy);       // climb/drop only on a clearly vertical push
  }
  const busy = !!action;
  if(busy){ ix=0; iy=0; }
  if(ix!==0) player.dir = ix;

  // keep feet planted when the collision box changes height (crouch<->stand):
  // grow/shrink about the feet, never push the box down through the floor.
  const curH = TIERS[player.tier].h;
  if(curH !== player.prevH){
    player.y += (player.prevH - curH) * 0.5;   // feet (y + h/2) stay fixed
    // if growing upward would bury the head in a ceiling, sink back to sit on the floor instead
    const r=7, topY=player.y - curH*0.5;
    for(const ox of [-r, r]){ const tx=((player.x+ox)/T)|0, ty=(topY/T)|0;
      if(inb(tx,ty) && solid(idx(tx,ty))){ player.y = ty*T + T + curH*0.5 + 0.1; break; } }
    player.prevH = curH;
  }

  const c = pcell();
  const climbHere = climbable(c);

  // ---- climbing mode ----
  // Detach by pressing straight left/right (step off onto a floor, or let go and fall).
  if(player.climbing && ix!==0 && iy===0) player.climbing = false;
  // Grab / stay on a ladder or rope only while pushing up or down.
  if(climbHere && iy!==0 && !busy) player.climbing = true;
  if(!climbHere || busy) player.climbing = false;

  if(player.climbing){
    // slow, deliberate — same speed at any tier
    player.vy = iy * CLIMB_UP;
    player.vx = ix * CLIMB_SIDE;
    moveAxis(player.vx*dt, 0);
    moveAxis(0, player.vy*dt);
    player.onGround = groundProbe();
  } else {
    // ---- horizontal (gentle analog ramp) ----
    const target = ix*tier.spd;
    const accel = (Math.abs(target)>Math.abs(player.vx))?620:1200;
    player.vx += clamp(target-player.vx, -accel*dt, accel*dt);
    // ---- gravity ----
    player.vy += GRAV*dt; if(player.vy>TERMV) player.vy=TERMV;
    // jump (up pressed while grounded, and not on a ladder) — a light hop, loud
    if(iy<0 && (player.onGround||player.coyote>0) && !climbHere){
      player.vy = -JUMP; player.onGround=false; player.coyote=0;
      if(tier.base>0){ emitSound((player.x/T)|0,(player.y/T)|0, 6); }
    }
    const wasGround = player.onGround;
    const fallV = player.vy;
    const preFeet = player.y + TIERS[player.tier].h*0.5;
    moveAxis(player.vx*dt, 0);
    moveAxis(0, player.vy*dt);
    // one-way landing: if we dropped onto a ladder rung that's level with a floor, stand on it
    // (walk across ladders). Pushing down starts a climb instead, so this won't trap you.
    if(!player.climbing && player.vy>0 && !(keys['s']||keys['arrowdown']) && !(touch.stickId!=null&&touch.vec[1]>0.5)){
      const h=TIERS[player.tier].h, fx=(player.x/T)|0, ty=((player.y+h*0.5+2)/T)|0;
      if(inb(fx,ty) && !solid(idx(fx,ty)) && climbable(idx(fx,ty)) && atFloorLevel(idx(fx,ty)) && preFeet <= ty*T+T*0.8){   // also catches you stepping off a ladder top
        player.y = ty*T - 0.6 - h*0.5; player.vy = 0;   // rest just above the landing, like a floor
      }
    }
    player.onGround = groundProbe();
    if(player.onGround && !wasGround && fallV>260){ sfx.land(); emitSound((player.x/T)|0,(player.y/T)|0, Math.min(14,fallV/40)); shake=Math.max(shake,0.22); spawn(6,player.x,player.y+TIERS[player.tier].h*0.5,{col:'rgba(120,110,95,0.5)',size:1.6,speed:24,ang:-Math.PI/2,spread:2.4,life:0.5,grav:60}); }
    if(player.onGround) player.coyote=0.1; else player.coyote=Math.max(0,player.coyote-dt);
  }

  // ---- footsteps (only when actually walking on ground) ----
  const speed=Math.abs(player.vx);
  // walk-cycle animation phase
  if(player.climbing){ player.walkPhase += (Math.abs(player.vy)+Math.abs(player.vx))*dt*0.06; }
  else if(player.onGround && speed>4){ player.walkPhase += speed*dt*0.09; }
  else player.walkPhase += dt*2; // idle sway
  if(player.onGround && speed>tier.spd*0.3 && tier.base>0 && !busy){
    player.stepT-=dt;
    if(player.stepT<=0){
      player.stepT=tier.int;
      const ft = floorType[footCell()] || '=';
      const m = FLOOR_MULT[ft]||1.0;
      const loud=tier.base*m;
      if(loud>0.4){ emitSound((player.x/T)|0,(player.y/T)|0,loud); sfx.step(loud); }
    }
  }

  // ---- loot pickup ----
  const LOOT_NAMES={ coin:'A purse of coin', watch:'A gold pocket watch', candle:'A silver candlestick', jewel:'A jewel box', ledger:'The banker\u2019s ledger', jar:'An old coin jar, buried' };
  for(const l of loot){
    if(l.taken||l.type==='box') continue;
    if(Math.hypot(player.x-(l.x*T+T/2), player.y-(l.y*T+T/2))<18){
      l.taken=true; player.lootVal+=l.val; sfx.coin(); msg(`${LOOT_NAMES[l.type]||'Loot'}. +${l.val}`);
      spawn(10,l.x*T+T/2,l.y*T+T/2-2,{col:'rgba(255,220,120,0.95)',size:1.3,speed:30,life:0.8,grav:40,kind:'spark'});
    }
  }
  // ---- escape ----
  if(grid[pcell()]==='X' && playing()){ if(mode==='demo') demoEscaped(); else { mode='escaped'; settleHeist(); } }

  // ---- hidden: sneaking into a bookcase/cabinet/barrel breaks line of sight ----
  player.hidden = player.sneak && player.tier===0 && !player.climbing && hideCells && hideCells.has(pcell());

  updateAction(dt);
}

// axis-separated collision against solid tiles; returns true if blocked (for landing)
function moveAxis(dx,dy){
  const h = TIERS[player.tier].h, r=7;
  const corners = (px,py)=>[[px-r,py-h*0.5],[px+r,py-h*0.5],[px-r,py+h*0.5],[px+r,py+h*0.5]];
  let blocked=false;
  if(dx!==0){
    const nx=player.x+dx;
    let ok=true;
    for(const [cx,cy] of corners(nx,player.y)){ const tx=(cx/T)|0,ty=(cy/T)|0; if(!inb(tx,ty)||solid(idx(tx,ty))){ ok=false; break; } }
    if(ok) player.x=nx; else { player.vx=0; blocked=true; }
  }
  if(dy!==0){
    const ny=player.y+dy;
    let ok=true;
    for(const [cx,cy] of corners(player.x,ny)){ const tx=(cx/T)|0,ty=(cy/T)|0; if(!inb(tx,ty)||solid(idx(tx,ty))){ ok=false; break; } }
    if(ok){ player.y=ny; }
    else { player.vy=0; blocked=true; }
  }
  return blocked;
}
// probe: is there solid ground within 2px under the feet?
// a ladder/rope cell that sits level with a floor slab acts as a landing you can walk across
function atFloorLevel(i){ const x=i%W, y=(i/W)|0;
  const fl=c=>c==='='||c==='w';
  return (inb(x-1,y)&&fl(grid[idx(x-1,y)])) || (inb(x+1,y)&&fl(grid[idx(x+1,y)])); }
function groundProbe(){
  const h=TIERS[player.tier].h, r=7;
  for(const ox of [-r, r]){
    const tx=((player.x+ox)/T)|0, ty=((player.y+h*0.5+2)/T)|0;
    if(!inb(tx,ty)) continue;
    const bi=idx(tx,ty);
    if(solid(bi)) return true;
    if(!player.climbing && climbable(bi) && atFloorLevel(bi)) return true;  // stand on a ladder landing
  }
  return false;
}

// ============================================================
// Actions (hold / timed)
// ============================================================
function startAction(a){ action=a; action.t=0; }
function cancelAction(){ action=null; }

function tryInteract(){
  const here=pcell(), fi=faceCell();
  const standX=(player.x/T)|0, standY=((player.y+TIERS[player.tier].h*0.5+3)/T)|0;
  const fc = inb(standX,standY)?idx(standX,standY):-1;

  // descend through the street grate into the sewer shaft (rope hangs below)
  if(fc>=0 && floorType[fc]==='grate'){
    player.x = 5*T+T/2; player.y = 19*T+T/2; player.vx=0; player.vy=40; player.climbing=true;
    emitSound(5,18,3); msg('You slip through the grate into the sewer shaft.');
    return;
  }
  const wantUp = keys['w']||keys['arrowup']||(touch.stickId!=null&&touch.vec[1]<-0.5);
  const wantDown = keys['s']||keys['arrowdown']||(touch.stickId!=null&&touch.vec[1]>0.5);
  // dig UP through a weak board directly overhead (you're standing just beneath it)
  {
    const ax=(player.x/T)|0, ay=((player.y/T)|0)-1;   // the tile above the player's cell
    if(inb(ax,ay) && grid[idx(ax,ay)]==='w'){
      startAction({ type:'digup', total:6, cell:idx(ax,ay), tick:0, label:'prying up the floorboards' });
      return;
    }
    // dig UP through earth (hold UP + ACT) — the shoring gives you rungs to climb into it
    if(wantUp && diggable(ax,ay) && !dug[idx(ax,ay)]){
      const m=MAT[mat[idx(ax,ay)]];
      startAction({ type:'dig', total:m.t, cell:idx(ax,ay), matk:mat[idx(ax,ay)], tick:0, label:`digging up through ${m.name}` });
      return;
    }
  }
  // pry up the boards you're standing on (hold DOWN + ACT), or dig straight down through earth
  if(wantDown){
    const dx=(player.x/T)|0, dy=((player.y+TIERS[player.tier].h*0.5+3)/T)|0;
    if(inb(dx,dy) && grid[idx(dx,dy)]==='w'){
      startAction({ type:'digup', total:6, cell:idx(dx,dy), tick:0, label:'prying up the floorboards' }); return; }
    if(diggable(dx,dy) && !dug[idx(dx,dy)]){ const m=MAT[mat[idx(dx,dy)]];
      startAction({ type:'dig', total:m.t, cell:idx(dx,dy), matk:mat[idx(dx,dy)], tick:0, label:`digging down through ${m.name}` }); return; }
  }
  if(fi<0) return;

  // doors
  const d=doors.get(fi);
  if(d){
    if(d.locked && !d.open){
      if(player.picks<=0){ msg('No picks left.'); return; }
      openLock(d); return;
    }
    d.open=!d.open; emitSound(d.x,d.y,d.open?3:2); sfx.thud();
    msg(d.open?`${d.label} — open`:`${d.label} — shut`); return;
  }
  // windows
  if(grid[fi]==='N' && !openWin.has(fi)){
    startAction({ type:'cutglass', total:16, cell:fi, label:'cutting the pane' }); return;
  }
  // strongbox
  const bx=loot.find(l=>!l.taken&&l.type==='box'&&idx(l.x,l.y)===fi);
  if(bx){ startAction({ type:'lootbox', total:3, box:bx, label:'emptying the strongbox' }); return; }
  const bx2=loot.find(l=>!l.taken&&l.type==='box'&&Math.hypot(player.x-(l.x*T+T/2),player.y-(l.y*T+T/2))<34);
  if(bx2){ startAction({ type:'lootbox', total:3, box:bx2, label:'emptying the strongbox' }); return; }

  // dig into earth we're facing (horizontal tunneling) or straight down
  let tgt=-1;
  if(diggable(...cellXY(fi)) && !dug[fi]) tgt=fi;
  else { const dx=(player.x/T)|0, dy=((player.y+10)/T)|0; if(inb(dx,dy)&&diggable(dx,dy)&&!dug[idx(dx,dy)]) tgt=idx(dx,dy); }
  if(tgt>=0){
    const m=MAT[mat[tgt]];
    startAction({ type:'dig', total:m.t, cell:tgt, matk:mat[tgt], tick:0, label:`digging ${m.name}` });
    return;
  }
}
function cellXY(i){ return [i%W,(i/W)|0]; }

function updateAction(dt){
  if(!action) return;
  action.t+=dt;
  if(action.type==='dig'){
    action.tick+=dt;
    if(action.tick>=0.7){ action.tick-=0.7; const n=MAT[action.matk].n; if(n>0){ const [x,y]=cellXY(action.cell); emitSound(x,y,n*3); sfx.dig(n); }
      { const [x,y]=cellXY(action.cell); spawn(6,x*T+T/2,y*T+T/2,{col:'rgba(110,85,55,0.8)',size:1.6,speed:40,life:0.7,grav:120}); } }
  } else if(action.type==='digup'){
    action.tick+=dt;
    if(action.tick>=0.9){ action.tick-=0.9; const [x,y]=cellXY(action.cell); emitSound(x,y,6); sfx.dig(2); }
  }
  if(action.t>=action.total) completeAction();
}
function completeAction(){
  const a=action; action=null;
  switch(a.type){
    case 'cutglass': openWin.add(a.cell); emitSound(a.cell%W,(a.cell/W)|0,2); sfx.click(); msg('The pane lifts free. The window is open.'); break;
    case 'lootbox': a.box.taken=true; player.lootVal+=a.box.val; emitSound(a.box.x,a.box.y,2); sfx.coin(); msg(`The strongbox is yours. +${a.box.val}`); break;
    case 'dig': { const c=a.cell; dug[c]=true; sfx.dig(2); break; }
    case 'digup': { const c=a.cell; grid[c]=' '; dug[c]=true; emitSound(c%W,(c/W)|0,5); msg('The boards give. Lamplight spills down — you are under the vault.'); break; }
  }
}

// ============================================================
// Lockpicking (unchanged feel)
// ============================================================
function openLock(door){
  const pins=[]; for(let i=0;i<door.pins;i++){ const w=clamp(24-door.pins*2.4,6,20); pins.push({c:12+Math.random()*66,w,set:false}); }
  lock={ door, pins, cur:0, prog:0, wrong:0, edge:0, torque:0 };
  msg(touch.used?`${door.label}: ${door.pins} pins. Hold TENSION, sweep with your thumb.`
    :`${door.label}: ${door.pins} pins. Hold SPACE for tension, steer with the mouse.`);
}
function lockUpdate(dt){
  const ang=clamp((mouse.x/CW)*90,0,90); lock.ang=ang;
  const tension=!!keys[' ']||touch.tension;
  if(!tension){ lock.wrong=0; lock.edge=0; lock.prog=Math.max(0,lock.prog-dt*2); return; }
  if(lock.cur>=lock.pins.length) return;
  const pin=lock.pins[lock.cur]; const inArc=Math.abs(ang-pin.c)<pin.w/2;
  if(inArc){
    lock.prog+=dt; lock.wrong=0;
    if(lock.prog>=0.5){ pin.set=true; lock.cur++; lock.prog=0; sfx.click(); emitSound(lock.door.x,lock.door.y,2);
      if(lock.cur>=lock.pins.length){ lock.door.locked=false; lock.door.open=true; emitSound(lock.door.x,lock.door.y,3); sfx.unlock(); stats.picked++; msg(`${lock.door.label} gives. You are in.`); lock=null; return; } }
  } else {
    lock.prog=0; lock.wrong+=dt;
    if(lock.wrong>1.2){ for(const p of lock.pins) p.set=false; lock.cur=0; lock.wrong=0; sfx.thud(); emitSound(lock.door.x,lock.door.y,1); }
    if(ang<6||ang>84){ lock.edge+=dt;
      if(lock.edge>0.6){ lock.edge=0; player.picks--; stats.snapped=true; sfx.snap(); emitSound(lock.door.x,lock.door.y,9);
        for(const p of lock.pins) p.set=false; lock.cur=0;
        msg(player.picks>0?`Pick snapped. ${player.picks} left — a stub of evidence.`:'Your last pick snaps.');
        if(player.picks<=0) lock=null; }
    } else lock.edge=0;
  }
}

// ============================================================
// Guards (side-view lane patrol)
// ============================================================
function guardCanSee(g){
  if(!playing()) return false;
  if(player.hidden) return false;
  const dx=player.x-g.x, dy=player.y-g.y;
  const d=Math.hypot(dx,dy); if(d>210) return false;
  // horizontal cone: must be roughly in front, within a vertical band (same storey-ish)
  if(sign(dx)!==g.face && Math.abs(dx)>14) return false;
  if(Math.abs(dy)>T*1.6) return false;            // can't see far up/down through floors
  return los(g.x/T,g.y/T,player.x/T,player.y/T);
}
function pVis(){
  const tier=TIERS[player.tier];
  const speed=Math.abs(player.vx);
  const motion = player.climbing?0.7 : speed<6?0.5 : player.tier===0?0.8 : 1.0;
  return clamp(lightAtPx(player.x,player.y)*tier.stance*motion,0,1.3);
}
function guardLaneY(g){ return g.lane*T + T/2; }

function guardUpdate(g,dt){
  const gx0=g.x;
  const see=guardCanSee(g);
  if(see){
    const d=Math.hypot(player.x-g.x,player.y-g.y);
    const fall=clamp(1.15-d/210,0,1.15);
    g.susp=clamp(g.susp+pVis()*fall*g.aware*dt*44,g.floor,100);
    g.lastKnown={x:player.x,y:player.y}; g.lastSeen=gameT;
    if(d<24) g.susp=100;
  } else if(gameT-g.lastSeen>1.6){ g.susp=Math.max(g.floor,g.susp-8*dt); }
  if(g.susp>=25) stats.ghost=false;

  if(g.susp>=85 && g.state!=='alert'){
    g.state='alert';
    if(!g.shouted){ g.shouted=true; stats.alerted=true; floater(g.x,g.y-20,'INTRUDER!',PAL.oxide); sfx.alert();
      emitSound((g.x/T)|0,(g.y/T)|0,22);
      for(const o of guards) if(o!==g&&o.state==='patrol'){ o.susp=Math.max(o.susp,60); o.lastKnown={x:g.x,y:g.y}; } }
  } else if(g.susp>=55 && (g.state==='patrol'||g.state==='curious')){
    g.state='investigate'; floater(g.x,g.y-20,'Who\u2019s there?',PAL.sodium); g.sweepT=0;
  } else if(g.susp>=25 && g.state==='patrol'){
    g.state='curious'; g.holdT=2.4; floater(g.x,g.y-20,'\u2026what was that?',PAL.chalk);
  }

  const spd = g.state==='alert'?120 : g.state==='investigate'?92 : g.speed;

  switch(g.state){
    case 'patrol': {
      if(g.holdWp>0){ g.holdWp-=dt; guardStayOnLane(g); break; }        // lingering at the end of the beat, back to the room
      const wp=g.wps[g.wp];
      const tx=wp[0]*T+T/2;
      g.dir = sign(tx-g.x)||g.dir; g.face=g.dir;
      if(guardBlocked(g,g.dir,spd,dt)){ g.wp=(g.wp+1)%g.wps.length; g.holdWp=g.pause; }   // wall or shut door: pause, turn back
      else g.x += g.dir*spd*dt;
      if(Math.abs(tx-g.x)<4){ g.wp=(g.wp+1)%g.wps.length; g.holdWp=g.pause; }
      guardStayOnLane(g);
      break;
    }
    case 'curious': {
      if(g.lastKnown) g.face=sign(g.lastKnown.x-g.x)||g.face;
      g.holdT-=dt; if(g.holdT<=0&&g.susp<25){ g.state='patrol'; }
      break;
    }
    case 'investigate': case 'alert': {
      const tgt = (see?{x:player.x,y:player.y}:g.lastKnown);
      if(tgt){
        // change lanes toward target if on a different storey and a ladder is reachable
        guardVerticalChase(g, tgt, spd, dt);
        const tx=tgt.x;
        if(Math.abs(tx-g.x)>6 && Math.abs(tgt.y-g.y)<T){ g.dir=sign(tx-g.x)||g.dir; g.face=g.dir; if(!guardBlocked(g,g.dir,spd,dt)) g.x+=g.dir*spd*dt; guardStayOnLane(g); }
        else { g.face=sign(tx-g.x)||g.face; }
      }
      g.sweepT=(g.sweepT||0)+dt;
      if(!see && g.sweepT>7){ g.floor=clamp(g.floor+9,0,60); g.aware=Math.min(2.2,g.aware*1.1); g.susp=g.floor; g.shouted=false; g.state='patrol'; g.sweepT=0; floater(g.x,g.y-20,'Hm.',PAL.draft); }
      if(g.state==='alert' && Math.hypot(player.x-g.x,player.y-g.y)<18 && Math.abs(player.y-g.y)<T){ stats.cause='The watchman catches you by the sleeve!'; mode='caught'; if(demo) demo.retryT=2.2; }
      break;
    }
  }
  g.walkPhase += Math.abs(g.x-gx0)*0.09;
}
function guardBlocked(g,dir,spd,dt){          // solid wall or shut door directly ahead on this lane?
  const nx=g.x+dir*(9+spd*dt), ty=g.lane;
  const tx=(nx/T)|0; return inb(tx,ty) && solid(idx(tx,ty)); }
function guardStayOnLane(g){
  const ly=guardLaneY(g); g.y=lerp(g.y,ly,0.4);
  // reverse only at a real ledge — open air with no floor AND no ladder/rope to stand across
  const gx=(g.x/T)|0, gy=((g.y+T*0.5+1)/T)|0;
  if(inb(gx,gy) && !solid(idx(gx,gy)) && !climbable(idx(gx,gy))){
    g.x -= g.dir*2; g.dir*=-1; g.face=g.dir;
  }
}
function guardVerticalChase(g,tgt,spd,dt){
  const targetLane=(tgt.y/T)|0;
  if(targetLane===g.lane) return;
  // find nearest climbable column on this lane the guard can reach
  const gy=g.lane;
  let best=null,bd=1e9;
  for(let x=1;x<W-1;x++){
    const i=idx(x,gy);
    if(climbable(i)){ const dx=Math.abs(x*T+T/2-g.x); if(dx<bd){ bd=dx; best=x; } }
  }
  if(best!=null){
    const bx=best*T+T/2;
    if(Math.abs(bx-g.x)>5){ g.dir=sign(bx-g.x); g.face=g.dir; if(!guardBlocked(g,g.dir,spd,dt)) g.x+=g.dir*spd*dt; }
    else { g.lane += sign(targetLane-g.lane); g.y=guardLaneY(g); }
  }
}

// ============================================================
// Loop
// ============================================================
function step(dt){
  gameT+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*1.6);
  for(const r of rings) r.t-=dt; rings=rings.filter(r=>r.t>0);
  for(const f of floaters){ f.t-=dt; f.y-=dt*10; } floaters=floaters.filter(f=>f.t>0);
  if(msgState.t>0) msgState.t-=dt;
  if(tutMsg.t>0) tutMsg.t-=dt;
  if(levelIntroT>0) levelIntroT-=dt;
  if(demo && mode==='caught'){ demo.retryT-=dt; if(demo.retryT<=0) startDemo(demo.lv); return; }
  if(!playing()){ return; }
  if(introLevel!==level){ introLevel=level; levelIntroT=2.8; fadeT=0.9; }
  if(fadeT>0) fadeT-=dt; if(flashT>0) flashT-=dt;
  { const n=guards.filter(g=>g.state==='alert').length; if(n>alertCount){ flashT=0.35; shake=Math.max(shake,0.3); } alertCount=n; }
  if(mode==='demo') demoTick(dt);
  partsUpdate(dt); ambientFx(dt);
  if(lock){ lockUpdate(dt); updateAction(0); }
  else { playerUpdate(dt); if(mode==='play') tutorialTick(); }
  for(const g of guards) guardUpdate(g,dt);
  // vision / explored
  visSet = computeVis();
  for(const i of visSet) exploredSet.add(i);
}

// Contextual, one-at-a-time hints that appear as you meet each mechanic — no wall of text.
function tutorialTick(){
  if(!player) return;
  const T_=touch.used;
  const mv = T_ ? 'Use the left stick to walk' : 'A / D walk';
  const cl = T_ ? 'Push the stick up/down to climb' : 'W / S climb';
  const act = T_ ? 'ACT' : 'E';
  const sneak = T_ ? 'SNEAK' : 'Shift';

  tut('move', `${mv}. Head for ${level===0?'the shop':'the counting house'}.`);

  const c=pcell(), fi=faceCell();
  if(climbable(c)) tut('climb', T_? `${cl} ladders and ropes.` : `${cl} ladders and ropes.`);
  const d=doors.get(fi);
  if(d && d.locked && !d.open) tut('lock', `Locked. Hold ${act} to pick it — keep tension and settle each pin.`);
  else if(d && !d.open) tut('door', `Press ${act} to open the door.`);
  if(fi>=0 && grid[fi]==='N' && !openWin.has(fi)) tut('window', `A window. Hold ${act} to cut the pane and slip in.`);
  // on the street grate
  { const sx=(player.x/T)|0, sy=((player.y+TIERS[player.tier].h*0.5+3)/T)|0;
    if(inb(sx,sy)&&floorType[idx(sx,sy)]==='grate') tut('grate', `Press ${act} to drop through the grate into the sewer.`); }
  // underground, facing diggable earth
  if(belowGround() && fi>=0 && grid[fi]==='E' && !dug[fi] && mat[fi]!=='K')
    tut('dig', `Hold ${act} to dig ahead \u2014 or hold UP/DOWN + ${act} to dig up or down. Shored tunnels have rungs to climb.`);
  // weak boards underfoot (the vault floor)
  { const ux=(player.x/T)|0, uy=((player.y+TIERS[player.tier].h*0.5+3)/T)|0;
    if(inb(ux,uy)&&grid[idx(ux,uy)]==='w') tut('boardsDown', `Loose boards underfoot. Hold DOWN + ${act} to pry them up and drop into the earth.`); }
  // weak boards overhead
  { const ax=(player.x/T)|0, ay=((player.y/T)|0)-1; if(inb(ax,ay)&&grid[idx(ax,ay)]==='w') tut('digup', `Boards above. Hold ${act} to break up into the vault.`); }
  // a guard in view
  for(const g of guards){ const gi=idx((g.x/T)|0,(g.y/T)|0);
    if(visSet.has(gi) && Math.hypot(player.x-g.x,player.y-g.y)<T*8){ tut('guard', `A guard. They only see the way they face — ${sneak} or slip behind.`); break; } }
  // standing at a hiding spot
  if(hideCells && hideCells.has(c)) tut('hide', `A hiding spot. Turn on ${sneak} here and guards won\u2019t see you.`);
  // spotted! teach the sprint
  if(guards.some(g=>g.state==='alert')) tut('run', T_? 'Spotted! Push the stick ALL the way to RUN \u2014 fast but loud. Break sight, then hide.'
                                                    : 'Spotted! Hold SPACE to RUN \u2014 fast but loud. Break sight, then hide.');
  // facing the strongbox
  if(loot.some(l=>!l.taken&&l.type==='box'&&idx(l.x,l.y)===fi)) tut('box', `The strongbox. Hold ${act} to empty it, then run for the lit alley.`);
  // has the loot, remind to escape
  if(loot.some(l=>l.type==='box'&&l.taken)) tut('escape', `You have the take. Get back to the lit alley on the right.`);
}
function computeVis(){
  const vis=new Set(); const px=player.x/T, py=player.y/T;
  const rad = player.climbing?9: (grid[pcell()]==='S'||belowGround())?8:14;
  vis.add(pcell());
  for(let a=0;a<360;a+=3){
    const dx=Math.cos(a*Math.PI/180)*0.45, dy=Math.sin(a*Math.PI/180)*0.45;
    let fx=px,fy=py;
    for(let s=0;s<rad/0.45;s++){ fx+=dx; fy+=dy; const tx=fx|0,ty=fy|0; if(!inb(tx,ty)) break; const i=idx(tx,ty); vis.add(i); if(opaque(i)) break; }
  }
  return vis;
}
function belowGround(){ return ((player.y/T)|0) > 18; }

// ============================================================
// Input
// ============================================================
const keys={};
const mouse={ x:CW/2, y:CH/2 };
const isTouchDevice = (typeof navigator!=='undefined'&&navigator.maxTouchPoints>0)||(typeof window!=='undefined'&&'ontouchstart' in window);
const touch={ used:false, stickId:null, nub:[STICK.x,STICK.y], vec:[0,0], holds:new Map(), pickId:null, tension:false };
let touchButtons=[];

function onKeyDown(e){
  const k=e.key.toLowerCase();
  const fresh=!keys[k];
  keys[k]=true;
  ac();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(demo){ if(fresh) stopDemo(); return; }
  if(mode==='title'){ if(k==='d') startDemo(0); else if(k==='enter'||k===' ') mode='play'; return; }
  if(mode==='caught'||mode==='escaped'){ if(k==='r'||k==='enter'){ nextAfterEnd(); } return; }
  if(mode!=='play') return;
  if(fresh) handlePress(k);
}
function handlePress(k){
  if(lock){ if(k==='escape'){ lock=null; msg('You ease off the lock.'); } return; }
  if(k==='escape'){ cancelAction(); return; }
  if(k==='sneak'||k==='shift'){ player.sneak=!player.sneak; msg(player.sneak?'Sneaking — quiet and low.':'Walking.'); return; }
  if(k==='e'||k==='enter'){ tryInteract(); return; }
}
function onKeyUp(e){ const k=e.key.toLowerCase(); keys[k]=false; if(action&&action.type==='dig'&&!keys['e']) cancelAction(); }
function onWheel(e){ e.preventDefault(); }

// ---- touch ----
function buildTouchButtons(){
  touchButtons=[]; if(!touch.used||mode!=='play') return;
  const B=(x,y,r,k,label,big)=>touchButtons.push({x,y,r,k,label,big});
  if(lock){ B(1045,455,60,'tension','TENSION',true); B(72,64,34,'escape','LEAVE'); return; }
  B(1058,455,54,'e','ACT',true);
  B(930,455,44,'sneak','SNEAK');
  if(action) B(72,64,34,'escape','STOP');
}
function canvasXY(t){ const r=canvas.getBoundingClientRect(); return [ (t.clientX-r.left)*(CW/r.width), (t.clientY-r.top)*(CH/r.height) ]; }
function stickSet(cx,cy){
  let dx=cx-STICK.x, dy=cy-STICK.y; const R=STICK.r; const d=Math.hypot(dx,dy);
  if(d>R){ dx=dx/d*R; dy=dy/d*R; }
  touch.nub=[STICK.x+dx, STICK.y+dy];
  touch.vec=[dx/R, dy/R];                 // each axis -1..1, measured from the FIXED centre
}
function stickRelease(){ touch.stickId=null; touch.vec=[0,0]; touch.nub=[STICK.x,STICK.y]; }
function goFullscreen(){ try{ const el=document.documentElement; if(el&&el.requestFullscreen&&!document.fullscreenElement){ el.requestFullscreen().then(()=>{ try{ screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}).catch(()=>{}); } }catch(_){} }
function onTouchStart(e){ e.preventDefault(); touch.used=true; ac();
  if(demo){ stopDemo(); return; }
  if(mode==='title'){ const t0=e.changedTouches[0]; const [cx,cy]=canvasXY(t0);
    if(titleHit(cx,cy)==='demo'){ startDemo(0); return; }
    goFullscreen(); mode='play'; return; }
  if(mode==='caught'||mode==='escaped'){ nextAfterEnd(); return; }
  for(const t of e.changedTouches){ const [cx,cy]=canvasXY(t); let hit=null;
    for(const b of touchButtons) if(Math.hypot(cx-b.x,cy-b.y)<=b.r+10){ hit=b; break; }
    if(hit){ if(hit.k==='tension'){ touch.tension=true; touch.holds.set(t.identifier,'tension'); }
      else { touch.holds.set(t.identifier,hit.k); if(hit.k!=='sneak') keys[hit.k]=true; handlePress(hit.k); } }
    else if(lock){ touch.pickId=t.identifier; mouse.x=cx; }
    else if(cx < CW*0.5 && touch.stickId==null){ touch.stickId=t.identifier; stickSet(cx,cy); }
  }
}
function onTouchMove(e){ e.preventDefault(); for(const t of e.changedTouches){ const [cx,cy]=canvasXY(t);
  if(t.identifier===touch.stickId) stickSet(cx,cy);
  else if(t.identifier===touch.pickId) mouse.x=clamp(cx,0,CW); } }
function onTouchEnd(e){ e.preventDefault(); for(const t of e.changedTouches){
  if(t.identifier===touch.stickId) stickRelease();
  if(t.identifier===touch.pickId) touch.pickId=null;
  const k=touch.holds.get(t.identifier);
  if(k!==undefined){ touch.holds.delete(t.identifier);
    if(k==='tension') touch.tension=[...touch.holds.values()].includes('tension');
    else if(![...touch.holds.values()].includes(k)){ keys[k]=false; if(action&&action.type==='dig'&&k==='e') cancelAction(); } } } }

// ============================================================
// Render
// ============================================================
let canvas, ctx, DPR=1, grain=null;
function uiTf(){ ctx.setTransform(DPR,0,0,DPR,0,0); }
function worldTf(shx,shy){ const s=SCALE*DPR; ctx.setTransform(s,0,0,s, -(cam.x+shx)*s, -(cam.y+shy)*s); }
function render(){
  uiTf();
  ctx.fillStyle=PAL.void; ctx.fillRect(0,0,CW,CH);

  // camera follows player, clamped; zoomed 2x
  const tx=clamp(player.x-VW/2, 0, W*T-VW), ty=clamp(player.y-VH/2, 0, (camBottom||H*T)-VH);
  cam.x=lerp(cam.x,tx,0.15); cam.y=lerp(cam.y,ty,0.15);
  const shx=shake>0?(Math.random()-0.5)*shake*10:0, shy=shake>0?(Math.random()-0.5)*shake*10:0;

  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,CW,CH-HUD_H); ctx.clip();
  worldTf(shx,shy);

  const x0=Math.max(0,(cam.x/T)|0), y0=Math.max(0,(cam.y/T)|0);
  const x1=Math.min(W-1,((cam.x+VW)/T)|0), y1=Math.min(H-1,((cam.y+VH)/T)|0);

  drawSky();
  drawHood();
  drawWorld(x0,y0,x1,y1);
  drawArchitecture();
  drawDecor();
  drawSewerWater(x0,y0,x1,y1);
  drawLamps();
  drawExit();
  drawRings();
  drawLoot();
  drawGuards();
  drawPlayer();
  drawParts();
  drawWeather(x0,y0,x1,y1);
  drawMotes(x0,y0,x1,y1);
  drawFloaters();
  ctx.restore();

  drawVignette();
  drawObjective();
  drawTutorial();
  drawScreenFx();
  drawMinimap();
  drawLevelIntro();
  drawHUD();
  if(lock) drawLock();
  buildTouchButtons(); drawTouchUI();
  if(mode==='title') drawTitle();
  else if(mode==='caught') drawEnd(false);
  else if(mode==='escaped') drawEnd(true);
  drawDemoOverlay();
}

function drawSky(){
  // night-sky gradient behind the above-ground air, plus a low moon glow
  const skyBot = 18*T;
  const g = ctx.createLinearGradient(0,0,0,skyBot);
  g.addColorStop(0,'#0e1526'); g.addColorStop(0.7,'#0b1019'); g.addColorStop(1,'#0A0C11');
  ctx.fillStyle=g; ctx.fillRect(cam.x-T, 0, VW+2*T, skyBot);
  // a few faint stars, deterministic
  ctx.fillStyle='rgba(191,203,217,0.35)';
  for(let s=0;s<40;s++){ const sx=((s*97)%(W*T)), sy=((s*53)%(skyBot-40))+6;
    if(sx>cam.x-T && sx<cam.x+VW+T) ctx.fillRect(sx, sy, 1, 1); }
  // moon with soft halo
  const mx=47*T, my=3.2*T;
  if(mx>cam.x-90 && mx<cam.x+VW+90){
    const mg=ctx.createRadialGradient(mx,my,3, mx,my,66);
    mg.addColorStop(0,'rgba(226,232,244,0.75)'); mg.addColorStop(0.28,'rgba(190,204,230,0.28)'); mg.addColorStop(1,'rgba(190,204,230,0)');
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,66,0,TAU); ctx.fill();
    ctx.fillStyle='#e4eaf6'; ctx.beginPath(); ctx.arc(mx,my,13,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(150,162,188,0.4)';
    ctx.beginPath(); ctx.arc(mx+4,my-3,3,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx-4,my+4,2.2,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+2,my+5,1.6,0,TAU); ctx.fill();
    // slow drifting cloud in front of the moon
    const cxp=mx-30+((gameT*6)%120);
    ctx.fillStyle='rgba(14,18,28,0.5)';
    ctx.beginPath(); ctx.ellipse(cxp,my+2,26,7,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cxp+16,my-2,16,6,0,0,TAU); ctx.fill();
  }
  // distant lightning (rare, far off) and the odd shooting star
  { const ph=gameT%14; if(ph<0.16 || (ph>0.32&&ph<0.42)){ ctx.fillStyle=`rgba(190,204,240,${ph<0.16?0.10:0.06})`; ctx.fillRect(cam.x-10,0,VW+20,skyBot); }
    const sp=gameT%23; if(sp<0.8){ const sx=cam.x+VW*0.2+sp*VW*0.6, sy=10+sp*40; ctx.strokeStyle=`rgba(226,232,244,${0.8*(1-sp/0.8)})`; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-14,sy-7); ctx.stroke(); ctx.lineWidth=1; } }
  // distant skyline — far rooftops with slow parallax
  const par=cam.x*0.55, gY=18*T;
  ctx.fillStyle='rgba(13,17,26,0.85)';
  for(let k=0;k<26;k++){ const bw=40+((k*37)%50); let bx=k*64-((k*29)%22)+par*0.35;
    const bh=T*(2.2+((k*13)%4)); const by=gY-T*1.6-bh;
    if(bx+bw<cam.x-20||bx>cam.x+VW+20) continue;
    ctx.fillRect(bx,by,bw,bh+ T*1.6);
    // tiny far windows
    ctx.fillStyle='rgba(233,162,59,0.10)';
    for(let w=0;w<3;w++){ const wx=bx+8+((k*7+w*19)%(bw-14)); const wy=by+6+((k*11+w*13)% (bh-10|0));
      if(((k+w)%4)<2) ctx.fillRect(wx,wy,2.4,3.4); }
    ctx.fillStyle='rgba(13,17,26,0.85)';
  }
}

function drawHood(){
  if(!hood) return;
  const gY=18*T;   // street line
  for(const h of hood){
    const x0=h.x0*T, x1=(h.x1+1)*T, top=gY-h.h*T;
    if(x1<cam.x-T||x0>cam.x+VW+T) continue;
    // facade
    ctx.fillStyle='#10141d'; ctx.fillRect(x0,top,x1-x0,gY-top);
    ctx.strokeStyle='rgba(46,66,96,0.55)'; ctx.lineWidth=1; ctx.strokeRect(x0+0.5,top+0.5,x1-x0-1,gY-top-1);
    // roof ridge + eave
    ctx.fillStyle='#0c0f16'; ctx.fillRect(x0-2,top-3,x1-x0+4,4);
    ctx.fillStyle='rgba(191,203,217,0.06)'; ctx.fillRect(x0-2,top-3,x1-x0+4,1);
    // chimney with smoke
    const chx=x0+((h.x0*7)%((h.x1-h.x0)||1))*T+T*0.5;
    ctx.fillStyle='#0c0f16'; ctx.fillRect(chx-3,top-12,7,10);
    for(let p=0;p<3;p++){ const t=(gameT*0.5+p*0.8+h.x0)%2.4; const a=Math.max(0,0.16*(1-t/2.4));
      ctx.fillStyle=`rgba(160,170,190,${a})`;
      ctx.beginPath(); ctx.arc(chx+Math.sin(gameT+p+h.x0)*3, top-14-t*12, 2.2+t*1.6, 0, TAU); ctx.fill(); }
    // door at street level
    const dx=x0+T*0.6;
    ctx.fillStyle='#171d29'; ctx.fillRect(dx,gY-T*0.9,T*0.55,T*0.9);
    ctx.fillStyle='rgba(233,162,59,0.35)'; ctx.fillRect(dx+T*0.4,gY-T*0.5,2,2);
    // windows — some warm-lit, curtained; some dark
    for(let fx=h.x0;fx<=h.x1;fx++) for(const wy of h.win){
      const wx=fx*T+T*0.28, wyy=gY-wy*T-T*0.55, ww=T*0.44, wh=T*0.6;
      const lit = ((fx*31+wy*17+h.x0*7)%5)<2;
      if(lit){ const gl=ctx.createRadialGradient(wx+ww/2,wyy+wh/2,1, wx+ww/2,wyy+wh/2,T*0.9);
        gl.addColorStop(0,'rgba(233,162,59,0.20)'); gl.addColorStop(1,'rgba(233,162,59,0)');
        ctx.fillStyle=gl; ctx.fillRect(wx-T*0.5,wyy-T*0.5,ww+T,wh+T);
        ctx.fillStyle='rgba(233,180,90,0.55)'; }
      else ctx.fillStyle='rgba(24,32,46,0.9)';
      ctx.fillRect(wx,wyy,ww,wh);
      ctx.strokeStyle='rgba(10,12,17,0.8)'; ctx.strokeRect(wx+0.5,wyy+0.5,ww-1,wh-1);
      ctx.beginPath(); ctx.moveTo(wx+ww/2,wyy); ctx.lineTo(wx+ww/2,wyy+wh); ctx.stroke();
      if(lit && ((fx+wy)%3===0)){ // a figure at home behind the curtain
        ctx.fillStyle='rgba(10,12,17,0.55)'; ctx.beginPath(); ctx.arc(wx+ww/2,wyy+wh*0.45,2.4,0,TAU); ctx.fill();
        ctx.fillRect(wx+ww/2-2.6,wyy+wh*0.55,5.2,wh*0.45); }
    }
  }
}

function drawArchitecture(){
  if(!building) return;
  const {x0,x1,top,ground}=building;
  // roof tiles along the roof row, only where explored
  for(let x=x0;x<=x1;x++){ const i=idx(x,top); if(!exploredSet.has(i)) continue; const vis=visSet.has(i); const L=vis?cellLit(i,x,top):0.5;
    const px=x*T, py=top*T; ctx.fillStyle=shade('#2b2430',L); ctx.fillRect(px,py,T,T);
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.beginPath();
    for(let r=0;r<2;r++){ const ry=py+6+r*10, o=(r%2)?5:0; for(let c=-1;c<3;c++){ ctx.moveTo(px+o+c*10+10,ry); ctx.arc(px+o+c*10+5,ry,5,0,Math.PI); } }
    ctx.stroke(); ctx.fillStyle=`rgba(191,203,217,${0.05*L})`; ctx.fillRect(px,py,T,1); }
  // chimney with smoke
  { const cx=(x1-4)*T+T/2, cy=top*T; const ci=idx(x1-4,top); if(exploredSet.has(ci)){
      ctx.fillStyle='#1c1820'; ctx.fillRect(cx-5,cy-16,10,16); ctx.fillStyle='#2a2430'; ctx.fillRect(cx-6,cy-18,12,3);
      for(let p=0;p<3;p++){ const t=(gameT*0.45+p*0.8)%2.4; ctx.fillStyle=`rgba(170,178,195,${0.14*(1-t/2.4)})`;
        ctx.beginPath(); ctx.arc(cx+Math.sin(gameT+p)*3, cy-22-t*14, 2.4+t*1.8, 0, TAU); ctx.fill(); } } }
  // shop sign / brass plaque, awning, shutters and window boxes on the neighbours
  { const dx=x0*T, dy=(ground-1)*T; const di=idx(x0,ground-1);
    if(exploredSet.has(di)){ const L=visSet.has(di)?0.95:0.5;
      if(level===0){ const sw=Math.sin(gameT*1.3)*0.08; ctx.save(); ctx.translate(dx-2,dy-30); ctx.rotate(sw);
        ctx.strokeStyle=shade('#2a3040',L); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-22,0); ctx.moveTo(-6,0); ctx.lineTo(-6,6); ctx.moveTo(-18,0); ctx.lineTo(-18,6); ctx.stroke();
        ctx.fillStyle=shade('#3a2c18',L); ctx.fillRect(-24,6,24,14); ctx.strokeStyle=shade('#caa24a',L); ctx.strokeRect(-23.5,6.5,23,13);
        ctx.fillStyle=shade('#e8ddb8',L); ctx.fillRect(-14,9,3,7); ctx.fillStyle=`rgba(255,200,90,${0.8*L})`; ctx.beginPath(); ctx.arc(-12.5,8,1.6,0,TAU); ctx.fill();
        ctx.fillStyle=shade('#e8ddb8',L); ctx.font='bold 5px monospace'; ctx.textAlign='center'; ctx.fillText('CANDLES',-12,19); ctx.textAlign='left'; ctx.restore(); }
      else { ctx.fillStyle=shade('#caa24a',L); ctx.fillRect(dx-10,dy-14,8,10); ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(dx-9,dy-11,6,1); ctx.fillRect(dx-9,dy-8,6,1);
        ctx.fillStyle=shade('#4a2136',L); ctx.beginPath(); ctx.moveTo(dx-16,dy-24); ctx.lineTo(dx+2,dy-24); ctx.lineTo(dx+2,dy-20); ctx.lineTo(dx-16,dy-17); ctx.closePath(); ctx.fill();
        ctx.fillStyle=shade('#caa24a',L); for(let k=0;k<4;k++) ctx.fillRect(dx-15+k*4.5,dy-25,2,1.5); } } }
  if(hood) for(const h of hood){ const gY=ground*T; for(let fx=h.x0;fx<=h.x1;fx++) for(const wy of h.win){ const wx=fx*T+T*0.28, wyy=gY-wy*T-T*0.55, ww=T*0.44, wh=T*0.6;
      if(((fx*13+wy*7)%4)===0){ ctx.fillStyle='#1c2230'; ctx.fillRect(wx-4,wyy,3.5,wh); ctx.fillRect(wx+ww+0.5,wyy,3.5,wh); ctx.fillStyle='rgba(0,0,0,0.4)'; for(let k=2;k<wh;k+=3){ ctx.fillRect(wx-4,wyy+k,3.5,1); ctx.fillRect(wx+ww+0.5,wyy+k,3.5,1); } }
      if(wy===1 && ((fx*5)%3)===0){ ctx.fillStyle='#3a2c18'; ctx.fillRect(wx-1,wyy+wh,ww+2,3); ctx.fillStyle=PAL.verd; ctx.fillRect(wx,wyy+wh-2,ww,2); ctx.fillStyle=PAL.oxide; ctx.fillRect(wx+2,wyy+wh-3,1.5,1.5); ctx.fillRect(wx+ww-4,wyy+wh-3,1.5,1.5); ctx.fillStyle=PAL.sodium; ctx.fillRect(wx+ww/2,wyy+wh-3,1.5,1.5); } } }
  // lamp posts on the street, sconce brackets indoors
  for(const lm of lamps){ const lx=lm.x*T, ly=lm.y*T; const li=idx(clamp(lm.x|0,0,W-1),clamp(lm.y|0,0,H-1)); if(!exploredSet.has(li)) continue;
    const L=visSet.has(li)?0.9:0.5;
    if(lm.x<x0||lm.x>x1){ // street lamp: post from the pavement, cross-arm, lantern housing
      ctx.fillStyle=shade('#1a1e28',L); ctx.fillRect(lx-1.5,ly,3,ground*T-ly); ctx.fillRect(lx-6,ground*T-2,12,2);
      ctx.strokeStyle=shade('#2a3040',L); ctx.lineWidth=1.5; ctx.strokeRect(lx-4,ly-5,8,10); ctx.lineWidth=1;
      ctx.fillStyle=shade('#2a3040',L); ctx.fillRect(lx-5,ly-7,10,2);
    } else { // wall sconce: bracket + candle cup
      ctx.strokeStyle=shade('#2a3040',L); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(lx,ly+2); ctx.lineTo(lx,ly+8); ctx.lineTo(lx-4,ly+10); ctx.stroke(); ctx.lineWidth=1;
      ctx.fillStyle=shade('#caa24a',L); ctx.fillRect(lx-3,ly+1,6,2); }
  }
}

// ---------- weather & ambient effects ----------
let rat=null;
function outdoors(x,y){ return !building || y<building.top || x<building.x0 || x>building.x1; }
function ambientFx(dt){
  if(!playing()) return;
  // cold night: breath puffs outdoors
  const breathe=(x,y,dir,rate)=>{ if(Math.random()<dt*rate) spawn(1,x+dir*4,y-14,{col:'rgba(200,215,235,0.35)',size:1.4,speed:6,ang:dir>0?0:Math.PI,spread:0.6,life:1.1,grav:-8}); };
  if(outdoors((player.x/T)|0,(player.y/T)|0) && player.y<18*T) breathe(player.x,player.y,player.dir,0.7);
  // tunnel dust drifting down from the shoring as you move underground
  if(belowGround() && grid[pcell()]==='E' && Math.abs(player.vx)>10 && Math.random()<dt*4) spawn(1,player.x+(Math.random()-0.5)*T,player.y-10,{col:'rgba(120,100,70,0.5)',size:1,speed:0,life:0.9,grav:25});
  for(const g of guards) if(outdoors((g.x/T)|0,(g.y/T)|0) && visSet.has(idx((g.x/T)|0,(g.y/T)|0))) breathe(g.x,g.y,g.face,0.6);
  // sewer drips + ripples
  if(level===1 && Math.random()<dt*3){ const sx=cam.x+Math.random()*VW, cx=(sx/T)|0, sy=25;
    if(inb(cx,sy) && grid[idx(cx,sy)]==='S' && exploredSet.has(idx(cx,sy))) spawn(1,sx,24*T+T-5,{col:'rgba(150,190,200,0.8)',size:1.1,speed:0,life:0.9,grav:220,kind:'drop'}); }
  for(const p of parts) if(p.kind==='drop' && p.y>=26*T-4){ p.life=p.max; spawn(1,p.x,26*T-4,{kind:'ring',col:'rgba(150,190,200,0.5)',size:1,speed:0,life:0.6,grav:0}); }
  // a sewer rat, family-friendly: scurries along the channel now and then
  if(level===1){ if(!rat && Math.random()<dt*0.12){ const dir=Math.random()<0.5?1:-1; rat={x:(dir>0?8:56)*T, dir, t:0}; }
    if(rat){ rat.x+=rat.dir*70*dt; rat.t+=dt; if(rat.x<7*T||rat.x>57*T||rat.t>12) rat=null; } }
}
function drawWeather(x0,y0,x1,y1){
  if(!playing() && mode!=='title') return;
  const groundY=18*T;
  // rain: streaks only in the open air (sky and street outside the building)
  ctx.strokeStyle='rgba(170,190,215,0.22)'; ctx.lineWidth=1; ctx.beginPath();
  for(let i=0;i<90;i++){ const sx=((i*137+gameT*160)%(VW+60))+cam.x-30; const sy=((i*91+gameT*640)%(groundY+20))-10;
    const tx=(sx/T)|0, ty=(sy/T)|0; if(!outdoors(tx,ty)) continue; if(sy>groundY-2) continue;
    ctx.moveTo(sx,sy); ctx.lineTo(sx-2.5,sy+9); }
  ctx.stroke();
  // splashes on the pavement
  ctx.strokeStyle='rgba(170,190,215,0.28)'; ctx.beginPath();
  for(let i=0;i<14;i++){ const ph=(gameT*3+i*0.7)%1; const sx=((i*211+((gameT*0.7+i)|0)*53)%(VW+40))+cam.x-20; const tx=(sx/T)|0; if(!outdoors(tx,17)) continue;
    ctx.moveTo(sx-2*ph,groundY-1); ctx.lineTo(sx,groundY-1-4*ph*(1-ph)); ctx.lineTo(sx+2*ph,groundY-1); }
  ctx.stroke();
  // puddles with lamp reflections
  for(let x=x0;x<=x1;x++){ if(!outdoors(x,17)||((x*7)%5)!==0) continue; const i=idx(x,18); if(!exploredSet.has(i)) continue;
    const px=x*T; ctx.fillStyle='rgba(120,150,190,0.10)'; ctx.beginPath(); ctx.ellipse(px+T/2,groundY-1,T*0.55,2.2,0,0,TAU); ctx.fill();
    const l=lightmap[idx(x,17)]||0; if(l>0.2){ ctx.fillStyle=`rgba(233,162,59,${0.35*l})`; ctx.fillRect(px+T/2-3+Math.sin(gameT*4+x)*1.5,groundY-2,6,1); } }
  // low street fog drifting outdoors
  ctx.fillStyle='rgba(150,165,190,0.05)';
  for(let i=0;i<6;i++){ const fx=((i*193+gameT*9)%(VW+200))+cam.x-100; const tx=(fx/T)|0; if(!outdoors(tx,17)) continue;
    ctx.beginPath(); ctx.ellipse(fx,groundY-6,60+i*10,7+i,0,0,TAU); ctx.fill(); }
  // sewer rat
  if(rat && exploredSet.has(idx((rat.x/T)|0,25))){ const ry=26*T-2; ctx.fillStyle='#4a4a52'; ctx.beginPath(); ctx.ellipse(rat.x,ry-2,5,2.6,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(rat.x+rat.dir*5,ry-3,1.8,0,TAU); ctx.fill(); ctx.strokeStyle='#4a4a52'; ctx.beginPath(); ctx.moveTo(rat.x-rat.dir*5,ry-2); ctx.quadraticCurveTo(rat.x-rat.dir*10,ry-6+Math.sin(gameT*12)*2,rat.x-rat.dir*13,ry-3); ctx.stroke();
    ctx.fillStyle='#e0e0e8'; ctx.fillRect(rat.x+rat.dir*6,ry-3.5,0.8,0.8); }
}

function drawDecor(){
  if(!decor) return;
  for(const d of decor){
    const cell=idx(d.x, d.wall?d.y:d.y-1);
    if(!exploredSet.has(idx(d.x,d.y)) && !exploredSet.has(cell)) continue;
    const vis=visSet.has(idx(d.x,d.y))||visSet.has(cell);
    const L=vis?clamp(0.42+lightmap[cell]*0.7,0.2,1):0.4;
    const bx=d.x*T, floorTop=d.y*T;
    drawProp(d.t, bx, floorTop, L, vis);
  }
}
function drawProp(t, bx, fy, L, vis){
  const sh=v=>shade(v,L);
  const wood='#5a4326', woodD='#3a2c18', metal='#33405e';
  switch(t){
    case 'crate': ctx.fillStyle=sh(wood); ctx.fillRect(bx+3,fy-16,T-6,16);
      ctx.strokeStyle=sh(woodD); ctx.lineWidth=1; ctx.strokeRect(bx+3,fy-16,T-6,16);
      ctx.beginPath(); ctx.moveTo(bx+3,fy-16); ctx.lineTo(bx+T-3,fy); ctx.moveTo(bx+T-3,fy-16); ctx.lineTo(bx+3,fy); ctx.stroke(); break;
    case 'crateSm': ctx.fillStyle=sh(wood); ctx.fillRect(bx+5,fy-11,T-10,11);
      ctx.strokeStyle=sh(woodD); ctx.strokeRect(bx+5,fy-11,T-10,11); break;
    case 'barrel': ctx.fillStyle=sh('#4a3826'); ctx.beginPath(); ctx.ellipse(bx+T/2,fy-9,7,10,0,0,TAU); ctx.fill();
      ctx.strokeStyle=sh('#6a5238'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(bx+T/2-7,fy-12); ctx.lineTo(bx+T/2+7,fy-12); ctx.moveTo(bx+T/2-7,fy-6); ctx.lineTo(bx+T/2+7,fy-6); ctx.stroke(); ctx.lineWidth=1; break;
    case 'bookcase': ctx.fillStyle=sh(woodD); ctx.fillRect(bx+2,fy-44,T-4,44);
      for(let s=0;s<4;s++){ const sy=fy-42+s*11; ctx.fillStyle=sh('#2a2016'); ctx.fillRect(bx+3,sy,T-6,9);
        const cols=[PAL.oxide,PAL.verd,PAL.sodium,PAL.draft,'#7a5a3a'];
        for(let b=0;b<5;b++){ ctx.fillStyle=sh(cols[(s+b)%5]); ctx.fillRect(bx+4+b*3.4,sy+1,2.6,7); } }
      ctx.strokeStyle=sh('#000'); ctx.strokeRect(bx+2,fy-44,T-4,44); break;
    case 'desk': ctx.fillStyle=sh(wood); ctx.fillRect(bx+1,fy-13,T-2,5);
      ctx.fillStyle=sh(woodD); ctx.fillRect(bx+3,fy-8,4,8); ctx.fillRect(bx+T-7,fy-8,4,8);
      ctx.fillStyle=sh('#2a2016'); ctx.fillRect(bx+1,fy-8,T-2,5);
      // ledger + quill light
      ctx.fillStyle=sh(PAL.chalk); ctx.fillRect(bx+T/2-3,fy-16,7,4); break;
    case 'table': ctx.fillStyle=sh(wood); ctx.fillRect(bx,fy-12,T,4);
      ctx.fillStyle=sh(woodD); ctx.fillRect(bx+2,fy-8,3,8); ctx.fillRect(bx+T-5,fy-8,3,8); break;
    case 'chair': ctx.fillStyle=sh(woodD); ctx.fillRect(bx+6,fy-16,3,16); ctx.fillRect(bx+6,fy-8,T-14,3);
      ctx.fillRect(bx+6,fy-4,3,4); ctx.fillRect(bx+T-11,fy-4,3,4); break;
    case 'stool': ctx.fillStyle=sh(woodD); ctx.fillRect(bx+5,fy-7,T-10,3); ctx.fillRect(bx+6,fy-4,3,4); ctx.fillRect(bx+T-9,fy-4,3,4); break;

function drawSewerWater(x0,y0,x1,y1){
  // shimmering water along the sewer channel floor
  const groundY=18, sewerY=groundY+8;      // channel floor row
  const wy=sewerY*T;
  if(belowGround() && Math.abs(player.y-(sewerY-1)*T)<T*2){ // your lantern on the water
    for(let k=-5;k<=5;k++){ const rx=player.x+k*3, a=0.22*(1-Math.abs(k)/6); ctx.fillStyle=`rgba(233,170,80,${a})`; ctx.fillRect(rx-1+Math.sin(gameT*5+k)*1.2, wy-4, 2, 1+((k%2)?1:0)); } }
  // floating bits drifting with the current
  for(const [off,kind] of [[0,'bottle'],[190,'leaf'],[420,'cork']]){ const fx=((gameT*9+off)%(52*T))+6*T; const fi=idx((fx/T)|0,sewerY-1); if(!exploredSet.has(fi)) continue;
    const bob=Math.sin(gameT*2+off)*0.8; const vis=visSet.has(fi); const a=vis?0.9:0.4;
    if(kind==='bottle'){ ctx.fillStyle=`rgba(90,140,110,${a})`; ctx.fillRect(fx-4,wy-6+bob,8,3); ctx.fillRect(fx+4,wy-5+bob,3,2); }
    else if(kind==='leaf'){ ctx.fillStyle=`rgba(120,110,50,${a})`; ctx.beginPath(); ctx.ellipse(fx,wy-5+bob,4,1.6,0.4,0,TAU); ctx.fill(); }
    else { ctx.fillStyle=`rgba(150,120,80,${a})`; ctx.fillRect(fx-1.5,wy-6+bob,3,2.5); } }
  for(let x=x0;x<=x1;x++){ const i=idx(x,sewerY-1);
    if(grid[idx(x,sewerY)]!=='=' ) continue;
    if(!exploredSet.has(i)&&!exploredSet.has(idx(x,sewerY))) continue;
    const vis=visSet.has(i)||visSet.has(idx(x,sewerY));
    const a=vis?0.5:0.25;
    ctx.fillStyle=`rgba(40,70,80,${a*0.5})`; ctx.fillRect(x*T,wy-4,T,4);
    // moving highlight
    const sh=Math.sin(gameT*2 + x*0.6);
    ctx.fillStyle=`rgba(120,170,180,${(0.10+0.10*Math.max(0,sh))*(vis?1:0.4)})`;
    ctx.fillRect(x*T,wy-4,T, 1);
  }
}

function drawLamps(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const d of doors.values()){ if(!d.open) continue; const i=idx(d.x,d.y); if(!exploredSet.has(i)) continue;
    const l=Math.max(lightmap[idx(clamp(d.x-1,0,W-1),d.y)]||0, lightmap[idx(clamp(d.x+1,0,W-1),d.y)]||0); if(l<0.15) continue;
    const g=ctx.createRadialGradient(d.x*T+T/2,d.y*T+T/2,2, d.x*T+T/2,d.y*T+T/2,T*2.2); g.addColorStop(0,`rgba(233,162,59,${0.16*l})`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(d.x*T+T/2,d.y*T+T/2,T*2.2,0,TAU); ctx.fill(); }
  if(player && belowGround()){ const g=ctx.createRadialGradient(player.x,player.y,2, player.x,player.y,T*4.2);
    g.addColorStop(0,'rgba(233,180,90,0.30)'); g.addColorStop(0.5,'rgba(233,162,59,0.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(player.x,player.y,T*4.2,0,TAU); ctx.fill(); }
  for(let k=0;k<lamps.length;k++){ const lm=lamps[k];
    const li=idx(clamp(lm.x|0,0,W-1), clamp(lm.y|0,0,H-1));
    if(!exploredSet.has(li)) continue;
    const vis=visSet.has(li);
    const flick=0.88+0.12*Math.sin(gameT*11+k*1.7)+0.05*Math.sin(gameT*23+k);
    const gx=lm.x*T, gy=lm.y*T, rad=lm.r*T*0.95*(0.97+0.06*Math.sin(gameT*7+k));
    const a = (vis?0.42:0.10)*flick;
    const g=ctx.createRadialGradient(gx,gy,2, gx,gy,rad);
    g.addColorStop(0,`rgba(233,162,59,${a})`);
    g.addColorStop(0.45,`rgba(233,162,59,${a*0.32})`);
    g.addColorStop(1,'rgba(233,162,59,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(gx,gy,rad,0,TAU); ctx.fill();
    if(vis){ const b=ctx.createRadialGradient(gx,gy,0, gx,gy,rad*1.6); b.addColorStop(0,`rgba(255,200,120,${0.10*flick})`); b.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=b; ctx.beginPath(); ctx.arc(gx,gy,rad*1.6,0,TAU); ctx.fill();
      ctx.fillStyle=`rgba(255,224,160,${0.95*flick})`; ctx.beginPath(); ctx.arc(gx,gy,2.6,0,TAU); ctx.fill(); }
  }
  ctx.restore();
}

  if(!grain) return; uiTf(); const gh=CH-HUD_H;

function drawVignette(){
