function cellLit(i,x,y){
  const seen=exploredSet.has(i), vis=visSet.has(i);
  if(!seen) return 0;
  if(!vis) return 0.24;                 // blueprint memory: dim but legible
  let l=lightmap[i];
  if(y>18){ // below ground the burglar's hooded lantern is the light source
    const d=Math.hypot((x+0.5)*T-player.x,(y+0.5)*T-player.y)/T; l=Math.max(l, clamp(1-d/5,0,1)*0.95); }
  return clamp(0.44 + l*0.72, 0.2, 1);
}

function drawWorld(x0,y0,x1,y1){
  const groundY=18;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const i=idx(x,y), k=grid[i];
    if(!exploredSet.has(i)) continue;
    const vis=visSet.has(i);
    const px=x*T, py=y*T;
    const L=cellLit(i,x,y);
    let base=null, top=null;
    const underground = y>groundY;
    if(k==='#'||k==='K'){ base = underground? (k==='K'?'#1a1c22':'#141821') : '#171b24'; top='#20283a'; }
    else if(k==='E'){
      if(dug[i]){ base = '#241d16'; }   // tunnels are timber-shored
      else { const depth=clamp((y-groundY)/14,0,1); base = vis ? mix(MAT[mat[i]].col,'#0d0b08',depth*0.45) : '#161a20'; }
    }
    else if(k==='='||k==='w'){ const ft=floorType[i];
      base = ft==='carpet'? '#3a2130' : ft==='tile'? '#26303a' : ft==='street'? '#1c222c' : '#2a2016';
      if(k==='w') top='#4a3a24'; }
    else if(k==='S'){ base='#2a2420'; }   // brick sewer wall, lit by your lantern
    else if(k==='X'){ base=mix('#1c222c', PAL.sodium, 0.25); }
    else { base=null; } // air/ladder/rope/door/window drawn below
    if(base){ ctx.fillStyle = vis? shade(base,L) : shade(base,0.5); ctx.fillRect(px,py,T,T);
      if(top && vis){ ctx.fillStyle=shade(top,L); ctx.fillRect(px,py,T,3); } }
    // interior wallpaper, cornice and baseboard (air-ish cells inside the building)
    if(!base && building && x>building.x0 && x<building.x1){
      const st=building.storeys.find(q=>y>=q.top && y<q.floor);
      if(st){ const Lw = vis? L : 0.45;
        ctx.fillStyle=shade(st.tint, Lw*0.9); ctx.fillRect(px,py,T,T);
        if(st.paper==='stripe'){ ctx.fillStyle=`rgba(0,0,0,${0.10})`; for(let sx=3;sx<T;sx+=8) ctx.fillRect(px+sx,py,3,T); }
        else if(st.paper==='damask'){ ctx.fillStyle=`rgba(255,235,200,${0.045*Lw+0.01})`;
          const o=(y%2)?T/2:0; ctx.beginPath(); ctx.arc(px+o+T/4,py+T/2,1.6,0,TAU); ctx.arc(px+((o+T/2)%T)+T/4,py+T/2,1.6,0,TAU); ctx.fill();
          ctx.fillRect(px+o+T/4-0.5,py+4,1,3); ctx.fillRect(px+o+T/4-0.5,py+T-7,1,3); }
        else { ctx.fillStyle='rgba(0,0,0,0.06)'; ctx.fillRect(px,py+((x*7+y*3)%T),T,1); }
        if(y===st.top){ ctx.fillStyle=shade('#241a10',Lw); ctx.fillRect(px,py,T,4); ctx.fillStyle=`rgba(255,220,170,${0.06*Lw})`; ctx.fillRect(px,py+4,T,1);
          if(x%3===0){ ctx.fillStyle=shade('#1a120a',Lw); ctx.fillRect(px+T/2-2,py,4,4); } }
        if(y===st.floor-1){ ctx.fillStyle=shade('#4a3a24',Lw); ctx.fillRect(px,py+T-3,T,3); ctx.fillStyle=`rgba(255,235,200,${0.08*Lw})`; ctx.fillRect(px,py+T-3,T,1); }
        // corner shading (ambient occlusion) beside walls
        if(inb(x-1,y)&&grid[idx(x-1,y)]==='#'){ const g=ctx.createLinearGradient(px,0,px+T,0); g.addColorStop(0,'rgba(0,0,0,0.35)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(px,py,T,T); }
        if(inb(x+1,y)&&grid[idx(x+1,y)]==='#'){ const g=ctx.createLinearGradient(px+T,0,px,0); g.addColorStop(0,'rgba(0,0,0,0.35)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(px,py,T,T); }
        // moonlight through a window on this wall
        for(const wx of [x-1,x+1,x-2,x+2]){ if(inb(wx,y)&&grid[idx(wx,y)]==='N'){ const d=Math.abs(wx-x); const g=ctx.createLinearGradient(px+(wx<x?0:T),0,px+(wx<x?T:0),0);
          g.addColorStop(0,`rgba(160,190,230,${0.16/d})`); g.addColorStop(1,'rgba(160,190,230,0)'); ctx.fillStyle=g; ctx.fillRect(px,py,T,T); } }
      }
    }
    if((k==='='||k==='w') && vis){ const ft=floorType[i];
      if(ft==='carpet'){ ctx.fillStyle=shade('#5a2230',L); ctx.fillRect(px,py+2,T,7); ctx.fillStyle=shade('#caa24a',L*0.6); ctx.fillRect(px,py+2,T,1); ctx.fillRect(px,py+8,T,1); }
      else if(ft==='tile'){ ctx.fillStyle=`rgba(255,255,255,${0.05*L})`; ctx.fillRect(px+((x%2)?0:T/2),py,T/2,T/2); ctx.fillRect(px+((x%2)?T/2:0),py+T/2,T/2,T/2); }
    }

    // surface detailing (only where lit/visible)
    if(vis){
      if(k==='S'){ // sewer brickwork
        ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1; const my=py+T/2, off=(y%2)?T/2:0;
        ctx.beginPath(); ctx.moveTo(px,my+0.5); ctx.lineTo(px+T,my+0.5); ctx.moveTo(px+off+0.5,py); ctx.lineTo(px+off+0.5,my);
        ctx.moveTo(px+((off+T/2)%T)+0.5,my); ctx.lineTo(px+((off+T/2)%T)+0.5,py+T); ctx.stroke();
        ctx.fillStyle=`rgba(90,130,120,${0.10*L})`; ctx.fillRect(px+((x*11)%T),py+((y*5)%T),4,3);   // damp moss
      }
      if(k==='#'||k==='K'){
        ctx.strokeStyle='rgba(0,0,0,0.30)'; ctx.lineWidth=1;
        const my=py+T/2, off=(y%2)?T/2:0;
        ctx.beginPath();
        ctx.moveTo(px,my+0.5); ctx.lineTo(px+T,my+0.5);                         // mortar course
        ctx.moveTo(px+off+0.5,py); ctx.lineTo(px+off+0.5,my);                   // upper joint
        ctx.moveTo(px+((off+T/2)%T)+0.5,my); ctx.lineTo(px+((off+T/2)%T)+0.5,py+T); // lower joint
        ctx.stroke();
        ctx.strokeStyle='rgba(191,203,217,0.05)'; ctx.beginPath(); ctx.moveTo(px,py+0.5); ctx.lineTo(px+T,py+0.5); ctx.stroke();
      } else if(k==='='||k==='w'){
        ctx.fillStyle='rgba(255,240,210,0.05)'; ctx.fillRect(px,py,T,1);        // top sheen
        ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px,py+T-0.5); ctx.lineTo(px+T,py+T-0.5);    // underside shadow
        ctx.moveTo(px+T-0.5,py+2); ctx.lineTo(px+T-0.5,py+T-2); ctx.stroke();   // plank seam
        if(floorType[i]==='street'){                                            // cobbles
          ctx.strokeStyle='rgba(0,0,0,0.28)';
          ctx.beginPath();
          for(let cxx=0;cxx<T;cxx+=8){ ctx.moveTo(px+cxx+1,py+4); ctx.arc(px+cxx+4,py+4,3,Math.PI,0); }
          for(let cxx=4;cxx<T;cxx+=8){ ctx.moveTo(px+cxx+1,py+9); ctx.arc(px+cxx+4,py+9,3,Math.PI,0); }
          ctx.stroke();
          ctx.fillStyle='rgba(191,203,217,0.04)'; ctx.fillRect(px+2,py+2,3,1); ctx.fillRect(px+12,py+7,3,1);
        }
      } else if(k==='E' && !dug[i] && mat[i]!=='K'){
        // packed-earth grit: a few deterministic pebbles + a horizontal stratum line
        const seed=(x*73856+y*19349)>>>0;
        ctx.fillStyle='rgba(0,0,0,0.20)';
        for(let s=0;s<3;s++){ const rx=px+3+((seed>>(s*5))&15)*1.3, ry=py+3+((seed>>(s*4+2))&15)*1.2; ctx.fillRect(rx,ry,1.4,1.4); }
        ctx.fillStyle='rgba(191,203,217,0.05)';
        const rx=px+2+(seed&15)*1.2; ctx.fillRect(rx,py+((seed>>8)&15)+2,2,1);
        if(mat[i]==='R'){ ctx.strokeStyle='rgba(78,156,134,0.25)'; ctx.lineWidth=1; ctx.beginPath();
          ctx.moveTo(px+2,py+T); ctx.quadraticCurveTo(px+T/2,py+T/2,px+T-3,py+2); ctx.stroke(); }
        if(mat[i]==='L' && ((seed>>3)%5)===0 && Math.hypot(px+T/2-player.x,py+T/2-player.y)<T*3.5){ // a worm, wriggling
          const w0=px+4+((seed>>6)&7), wy0=py+6+((seed>>9)&9); ctx.strokeStyle=`rgba(210,140,140,${0.55*L})`; ctx.lineWidth=1.4; ctx.beginPath();
          ctx.moveTo(w0,wy0); for(let k=1;k<=4;k++) ctx.lineTo(w0+k*2.2, wy0+Math.sin(gameT*4+k+seed)*1.3); ctx.stroke(); ctx.lineWidth=1; }
      } else if(k==='E' && dug[i]){
        // dug tunnel: shoring posts with rungs (it's climbable) + tool marks on the back wall
        ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px+3,py+4); ctx.lineTo(px+7,py+7); ctx.moveTo(px+T-8,py+5); ctx.lineTo(px+T-4,py+9); ctx.stroke();
        ctx.strokeStyle=shade('#8a6a3a',L); ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(px+3,py); ctx.lineTo(px+3,py+T); ctx.moveTo(px+T-3,py); ctx.lineTo(px+T-3,py+T);
        for(let r=5;r<T;r+=8){ ctx.moveTo(px+3,py+r); ctx.lineTo(px+T-3,py+r); } ctx.stroke();
      } else if(k==='K'){
        // bedrock / foundation stone: big blocks with light mortar
        ctx.strokeStyle='rgba(191,203,217,0.07)'; ctx.lineWidth=1;
        const off=(y%2)?T/2:0; ctx.beginPath(); ctx.moveTo(px,py+T-0.5); ctx.lineTo(px+T,py+T-0.5); ctx.moveTo(px+off+0.5,py); ctx.lineTo(px+off+0.5,py+T); ctx.stroke();
        ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fillRect(px+2+((x*5)%9),py+3+((y*7)%9),3,2);
      }
      if(k==='E' && !dug[i] && y+1<H && grid[idx(x,y+1)]==='S'){   // sewer vault: brick arch under the earth
        ctx.fillStyle=shade('#4a3a34',L); ctx.fillRect(px,py+T-5,T,5); ctx.strokeStyle='rgba(0,0,0,0.35)';
        ctx.beginPath(); for(let bx=0;bx<T;bx+=6){ ctx.moveTo(px+bx+0.5,py+T-5); ctx.lineTo(px+bx+0.5,py+T); } ctx.stroke();
      }
      ctx.lineWidth=1;
    }

    if(!vis && k!=='E' && k!=='K' && k!=='#' && k!=='S'){ // blueprint memory: faint draft hatching over remembered rooms
      ctx.strokeStyle='rgba(78,110,150,0.11)'; ctx.lineWidth=1; ctx.beginPath();
      for(let hh=-T;hh<T;hh+=8){ ctx.moveTo(px+hh,py+T); ctx.lineTo(px+hh+T,py); } ctx.stroke(); }
    // overlays
    if(k==='H'){ drawLadder(px,py,L); }
    if(k==='r'||ropes.has(i)){ drawRope(px,py,L); }
    if(k==='D'){ const d=doors.get(i); drawDoor(px,py,d,L); }
    if(k==='N'){ drawWindow(px,py,i,L); }
    if(k==='X'){ ctx.fillStyle=shade(PAL.sodium,0.6*L); ctx.fillRect(px+T*0.3,py,T*0.4,T); }
    // dig hint: subtle grid on undug earth in view
    if(k==='E'&&!dug[i]&&vis&&mat[i]!=='K'){ ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.strokeRect(px+0.5,py+0.5,T-1,T-1); }
  }
}
function shade(col,L){ return mix('#0A0C11', col, clamp(L,0,1)); }
function drawLadder(px,py,L){ ctx.strokeStyle=shade(PAL.draft,0.7*L+0.2); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(px+7,py); ctx.lineTo(px+7,py+T); ctx.moveTo(px+T-7,py); ctx.lineTo(px+T-7,py+T);
  for(let r=4;r<T;r+=7){ ctx.moveTo(px+7,py+r); ctx.lineTo(px+T-7,py+r); } ctx.stroke(); ctx.lineWidth=1; }
function drawRope(px,py,L){ ctx.strokeStyle=shade(PAL.sodium,0.5*L+0.2); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(px+T/2,py); ctx.lineTo(px+T/2,py+T); ctx.stroke(); ctx.lineWidth=1; }
function drawDoor(px,py,d,L){
  const wood = d&&d.locked?'#4a3420':'#3a3226';
  if(d&&d.open){ // swung open into the room: a thin slab at an angle + frame
    ctx.fillStyle=shade('#1a140c',L); ctx.fillRect(px+1,py,2,T); ctx.fillRect(px+T-3,py,2,T);
    ctx.fillStyle=shade(wood,L); ctx.beginPath(); ctx.moveTo(px+2,py+1); ctx.lineTo(px+10,py+4); ctx.lineTo(px+10,py+T-4); ctx.lineTo(px+2,py+T-1); ctx.closePath(); ctx.fill();
    ctx.fillStyle=shade(PAL.sodium,0.7*L); ctx.fillRect(px+7,py+T/2-1,2,2); return; }
  ctx.fillStyle=shade('#1a140c',L); ctx.fillRect(px+1,py,T-2,T);                       // frame
  ctx.fillStyle=shade(wood,L); ctx.fillRect(px+3,py+1,T-6,T-1);
  ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1;                                  // two recessed panels
  ctx.strokeRect(px+5.5,py+3.5,T-11,T*0.38); ctx.strokeRect(px+5.5,py+T*0.52+0.5,T-11,T*0.4);
  ctx.fillStyle=`rgba(255,235,200,${0.06*L})`; ctx.fillRect(px+6,py+4,T-12,1); ctx.fillRect(px+6,py+T*0.52+1,T-12,1);
  ctx.fillStyle=shade('#caa24a',L); ctx.beginPath(); ctx.arc(px+T-7,py+T/2,1.8,0,TAU); ctx.fill();   // knob
  if(d&&d.locked){ ctx.fillStyle=shade(PAL.oxide,0.8*L); ctx.fillRect(px+T-9,py+T/2+3,4,3); ctx.fillStyle='#000'; ctx.fillRect(px+T-8,py+T/2+4,2,1); } }
function drawWindow(px,py,i,L){ const open=openWin.has(i);
  ctx.fillStyle=shade('#2a2016',L); ctx.fillRect(px+1,py,T-2,T);                        // frame
  ctx.fillStyle=shade('#4a3a24',L); ctx.fillRect(px,py+T-3,T,3);                        // sill
  const panes=[[px+3,py+2],[px+T/2+1,py+2],[px+3,py+T/2+1],[px+T/2+1,py+T/2+1]];
  for(let n=0;n<4;n++){ const [wx,wy]=panes[n]; const w=T/2-4, h=T/2-3;
    if(open && n>=2){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(wx,wy,w,h);           // cut panes gone
      ctx.strokeStyle='rgba(190,204,230,0.5)'; ctx.beginPath(); ctx.moveTo(wx,wy); ctx.lineTo(wx+3,wy+4); ctx.moveTo(wx+w,wy+h); ctx.lineTo(wx+w-4,wy+h-3); ctx.stroke(); continue; }
    ctx.fillStyle=`rgba(130,170,205,${0.16+0.14*L})`; ctx.fillRect(wx,wy,w,h);
    ctx.fillStyle=`rgba(226,232,244,${0.10+0.10*L})`; ctx.fillRect(wx+1,wy+1,w*0.4,1); }     // moon glint
  ctx.strokeStyle=shade('#2a2016',L); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px+T/2,py+1); ctx.lineTo(px+T/2,py+T-3); ctx.moveTo(px+2,py+T/2); ctx.lineTo(px+T-2,py+T/2); ctx.stroke(); ctx.lineWidth=1; }

function drawRings(){ for(const r of rings){ const a=r.t/0.9; for(const [i,l] of r.cells){ if(!visSet.has(i)&&!exploredSet.has(i)) continue;
  const x=(i%W)*T,y=((i/W)|0)*T; ctx.fillStyle=`rgba(184,67,58,${0.05+0.16*(l/r.max)*a})`; ctx.fillRect(x,y,T,T); } } }

function drawLoot(){ for(const l of loot){ if(l.taken) continue; const i=idx(l.x,l.y); if(!exploredSet.has(i)) continue; if(grid[i]==='E' && !dug[i]) continue;
  const vis=visSet.has(i); const L=vis?lightmap[i]*0.9+0.25:0.35; const px=l.x*T+T/2, py=l.y*T+T/2;
  const glint=0.5+0.5*Math.sin(gameT*3 + l.x*1.7 + l.y);
  // warm glow
  if(vis){ ctx.save(); ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(px,py-2,0, px,py-2,l.type==='box'?18:11);
    g.addColorStop(0,`rgba(233,162,59,${0.28+0.16*glint})`); g.addColorStop(1,'rgba(233,162,59,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py-2,l.type==='box'?18:11,0,TAU); ctx.fill(); ctx.restore(); }
  if(l.type==='watch'){ ctx.fillStyle=shade('#caa24a',L); ctx.beginPath(); ctx.arc(px,py-1,4.2,0,TAU); ctx.fill(); ctx.fillStyle=shade('#f4efe0',L); ctx.beginPath(); ctx.arc(px,py-1,2.8,0,TAU); ctx.fill();
    ctx.strokeStyle='#000'; ctx.beginPath(); ctx.moveTo(px,py-1); ctx.lineTo(px,py-3); ctx.moveTo(px,py-1); ctx.lineTo(px+1.6,py-0.4); ctx.stroke(); ctx.strokeStyle=shade('#caa24a',L); ctx.beginPath(); ctx.moveTo(px,py-5); ctx.quadraticCurveTo(px+5,py-7,px+6,py-2); ctx.stroke(); }
  else if(l.type==='candle'){ ctx.fillStyle=shade('#c9ccd4',L); ctx.fillRect(px-4,py+2,8,2); ctx.fillRect(px-1,py-6,2,8); ctx.fillRect(px-3,py-7,6,2); ctx.fillStyle=shade('#e8ddb8',L); ctx.fillRect(px-1.2,py-13,2.4,6);
    if(vis){ ctx.fillStyle=`rgba(255,200,90,${0.8+0.2*glint})`; ctx.beginPath(); ctx.arc(px,py-14,1.6,0,TAU); ctx.fill(); } }
  else if(l.type==='jewel'){ ctx.fillStyle=shade('#5a2836',L); ctx.fillRect(px-6,py-4,12,7); ctx.fillStyle=shade('#7a3a4a',L); ctx.fillRect(px-6,py-6,12,3);
    ctx.fillStyle=`rgba(120,220,200,${0.7+0.3*glint})`; ctx.beginPath(); ctx.moveTo(px,py-9); ctx.lineTo(px+2.5,py-6.5); ctx.lineTo(px,py-4); ctx.lineTo(px-2.5,py-6.5); ctx.closePath(); ctx.fill(); }
  else if(l.type==='ledger'){ ctx.fillStyle=shade('#3a2c18',L); ctx.fillRect(px-6,py-3,12,6); ctx.fillStyle=shade('#e8e2d2',L); ctx.fillRect(px-5,py-4,10,1.5); ctx.fillStyle=shade('#caa24a',L); ctx.fillRect(px-6,py-1,12,1); }
  else if(l.type==='jar'){ ctx.fillStyle=shade('#6a5a4a',L); ctx.beginPath(); ctx.ellipse(px,py+1,5,6,0,0,TAU); ctx.fill(); ctx.fillStyle=shade('#4a3a2a',L); ctx.fillRect(px-3,py-7,6,3);
    ctx.fillStyle=`rgba(255,220,120,${0.5+0.5*glint})`; ctx.fillRect(px-2,py-3,1.5,1.5); ctx.fillRect(px+1,py-1,1.5,1.5); }
  else if(l.type==='coin'){
    ctx.fillStyle=shade('#c8892f',L); ctx.beginPath(); ctx.arc(px,py-2,4.5,0,TAU); ctx.fill();
    ctx.fillStyle=shade(PAL.sodium,L); ctx.beginPath(); ctx.arc(px,py-2,3,0,TAU); ctx.fill();
    ctx.fillStyle=`rgba(255,240,200,${0.5+0.4*glint})`; ctx.beginPath(); ctx.arc(px-1.2,py-3.4,1.1,0,TAU); ctx.fill();
  } else {
    // strongbox: banded chest with a lit clasp
    ctx.fillStyle=shade('#5a4326',L); ctx.fillRect(px-9,py-7,18,12);
    ctx.fillStyle=shade('#3a2c18',L); ctx.fillRect(px-9,py-2,18,2);
    ctx.strokeStyle=shade('#caa24a',L); ctx.lineWidth=1; ctx.strokeRect(px-9,py-7,18,12);
    ctx.fillStyle=shade(PAL.sodium,L); ctx.fillRect(px-9,py-7,18,2);
    ctx.fillStyle=`rgba(255,230,170,${0.5+0.5*glint})`; ctx.fillRect(px-2,py-3,4,3);
    ctx.lineWidth=1;
  } } }

// ---------- humanoid figure ----------
// Draws a person standing on (cx, feetY), facing dir, animated by phase.
// pose: 'stand'|'walk'|'run'|'crouch'|'climb'. cols = {skin, cloth, accent, line}
function drawHuman(cx, feetY, dir, pose, phase, cols, L){
  feetY -= 1;                            // seat rounded foot-caps on the floor line, not through it
  // soft contact shadow
  ctx.fillStyle=`rgba(0,0,0,${0.22*clamp(L+0.2,0,1)})`;
  ctx.beginPath(); ctx.ellipse(cx, feetY+1.5, 8, 2.4, 0, 0, TAU); ctx.fill();
  const sh = v=>shade(v, L);
  ctx.lineCap='round';
  const swing = Math.sin(phase);        // -1..1 gait
  const swing2 = Math.sin(phase+Math.PI);
  // vertical figure metrics scale with pose
  const crouch = pose==='crouch';
  const legLen = crouch?5 : 9;
  const torsoLen = crouch?7 : 9;
  const headR = 3.4;
  const hipY = feetY - legLen;
  const shoulderY = hipY - torsoLen;
  const headY = shoulderY - headR - 0.5;
  const lean = pose==='run'? dir*3 : crouch? dir*2 : 0;

  if(pose==='climb'){
    // front-facing on a ladder/rope: body vertical, limbs reaching alternately
    const midx=cx;
    ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(midx, shoulderY); ctx.lineTo(midx, hipY+1); ctx.stroke();  // torso
    // legs on rungs
    ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(midx, hipY); ctx.lineTo(midx-3, hipY+legLen*0.6+swing*2); ctx.lineTo(midx-3, feetY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midx, hipY); ctx.lineTo(midx+3, hipY+legLen*0.6+swing2*2); ctx.lineTo(midx+3, feetY); ctx.stroke();
    // arms reaching up alternately
    ctx.strokeStyle=sh(cols.accent); ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(midx, shoulderY+1); ctx.lineTo(midx-4, shoulderY-4+swing2*3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midx, shoulderY+1); ctx.lineTo(midx+4, shoulderY-4+swing*3); ctx.stroke();
    ctx.fillStyle=sh(cols.skin); ctx.beginPath(); ctx.arc(midx, headY, headR, 0, TAU); ctx.fill();
    ctx.lineWidth=1; return;
  }

  // side-on standing / walking / running
  const gaitAmp = pose==='run'?6 : pose==='walk'?4 : crouch?1.2 : 0.6;
  // cloak / coat swinging behind
  if(cols.cloak){ const sw=Math.sin(phase)*(pose==='run'?3:1.5); ctx.fillStyle=sh(cols.cloak);
    ctx.beginPath(); ctx.moveTo(cx+lean-dir*1, shoulderY+1); ctx.lineTo(cx-dir*6+sw, hipY+3); ctx.lineTo(cx-dir*2+sw*0.5, hipY+4); ctx.lineTo(cx+lean+dir*2, shoulderY+2); ctx.closePath(); ctx.fill(); }
  const armAmp  = pose==='run'?5 : pose==='walk'?3 : 0.6;
  // legs (swing around hip)
  ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=2.8;
  ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx+swing*gaitAmp, feetY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx+swing2*gaitAmp, feetY); ctx.stroke();
  // torso
  ctx.strokeStyle=sh(cols.cloth); ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(cx, hipY); ctx.lineTo(cx+lean, shoulderY); ctx.stroke();
  // back arm then front arm (accent = front, e.g. holding a tool)
  ctx.lineWidth=2.4; ctx.strokeStyle=sh(cols.cloth);
  ctx.beginPath(); ctx.moveTo(cx+lean, shoulderY+1); ctx.lineTo(cx+lean+swing2*armAmp, shoulderY+7); ctx.stroke();
  // head
  ctx.fillStyle=sh(cols.skin); ctx.beginPath(); ctx.arc(cx+lean, headY, headR, 0, TAU); ctx.fill();
  // hat / cap brim in facing dir
  if(cols.hatStyle==='helm'){ ctx.fillStyle=sh(cols.hat); ctx.beginPath(); ctx.arc(cx+lean, headY-0.5, headR+1.2, Math.PI, 0); ctx.fill(); ctx.fillRect(cx+lean-headR-1.6, headY-1, headR*2+3.2, 1.6); }
  else if(cols.hatStyle==='tricorn'){ ctx.fillStyle=sh(cols.hat); ctx.beginPath(); ctx.moveTo(cx+lean-headR-2.5, headY-headR+0.5); ctx.lineTo(cx+lean, headY-headR-4); ctx.lineTo(cx+lean+headR+2.5, headY-headR+0.5); ctx.closePath(); ctx.fill(); }
  else if(cols.hat){ ctx.fillStyle=sh(cols.hat); ctx.fillRect(cx+lean-headR, headY-headR-1, headR*2, 2.2);
    ctx.fillRect(cx+lean+ (dir>0?headR-1:-headR-2), headY-headR, 3, 1.8); }
  // front arm (accent)
  ctx.strokeStyle=sh(cols.accent); ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(cx+lean, shoulderY+1); ctx.lineTo(cx+lean+dir*3+swing*armAmp, shoulderY+7); ctx.stroke();
  // satchel on the hip
  if(cols.satchel){ ctx.fillStyle=sh(cols.satchel); ctx.fillRect(cx-dir*4-2, hipY-2, 5, 4); ctx.strokeStyle=sh(cols.satchel); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(cx-dir*3,hipY-2); ctx.lineTo(cx+lean+dir*1,shoulderY+1); ctx.stroke(); }
  // eye glint toward the facing direction
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(cx+lean+dir*1.6-0.5, headY-0.8, 1.2, 1.2);
  ctx.lineWidth=1;
}

function poseFor(p){
  if(p.climbing) return 'climb';
  if(p.tier===0) return 'crouch';
  if(!p.onGround) return 'stand';
  if(Math.abs(p.vx)<=4) return 'stand';
  return p.tier===2 ? 'run' : 'walk';
}

function drawGuards(){ for(const g of guards){ const gi=idx((g.x/T)|0,(g.y/T)|0); if(!visSet.has(gi)&&!exploredSet.has(gi)) continue;
  const vis=visSet.has(gi);
  // vision cone from the eyes, in facing dir
  if(vis){ const col = g.state==='alert'?PAL.oxide : g.state==='investigate'?PAL.sodium : g.state==='curious'?PAL.chalk:PAL.draft;
    const ex=g.x, ey=g.y-16; const R=210, spread=0.34;
    const grad=ctx.createLinearGradient(ex,ey, ex+g.face*R, ey);
    grad.addColorStop(0, col); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle=grad; ctx.globalAlpha=g.lantern?0.24:0.15;
    ctx.beginPath(); ctx.moveTo(ex,ey);
    ctx.lineTo(ex+g.face*R, ey-R*spread); ctx.lineTo(ex+g.face*R, ey+R*spread); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
  const L=vis?clamp(0.5+lightAtPx(g.x,g.y)*0.6,0.4,1):0.4;
  const moving=Math.abs(g.x - (g._px||g.x))>0.2; g._px=g.x;
  const pose = g.state==='alert'?'run' : moving?'walk':'stand';
  const styles={ street:'helm', watchman:'helm', ground:'cap', mid:'tricorn' };
  const cols={ skin:'#c9a88a', cloth:g.id==='mid'?'#3a2a4a':'#33405e', accent:'#8fa0be', line:'#0A0C11', hat:styles[g.id]==='helm'?'#6a7488':'#20283a', hatStyle:styles[g.id]||'cap', cloak:'#2a3550' };
  drawHuman(g.x, g.y+13, g.face, pose, g.walkPhase, cols, L);
  // lantern held out in facing dir
  if(g.lantern){ const sw=Math.sin(g.walkPhase)*(pose==='stand'?0.5:2.2); const lx=g.x+g.face*7+sw, ly=g.y+2+Math.abs(sw)*0.4;
    ctx.strokeStyle=shade('#2a3040',L); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(g.x+g.face*4,g.y-4); ctx.lineTo(lx,ly-4); ctx.stroke(); ctx.fillStyle=shade('#2a3040',L); ctx.fillRect(lx-3,ly-4,6,1.5);
    ctx.fillStyle=`rgba(233,162,59,${0.85*L})`; ctx.beginPath(); ctx.arc(lx,ly,3.2,0,TAU); ctx.fill();
    ctx.globalAlpha=0.18*L; ctx.fillStyle=PAL.sodium; ctx.beginPath(); ctx.arc(lx,ly,9,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  // suspicion bar above head
  if(g.susp>3 && vis){ const w=18, s=clamp(g.susp/100,0,1); ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(g.x-w/2,g.y-26,w,3);
    ctx.fillStyle = g.susp>=85?PAL.oxide:g.susp>=55?PAL.sodium:PAL.chalk; ctx.fillRect(g.x-w/2,g.y-26,w*s,3);
    } 
  if(g._st!==g.state){ g._st=g.state; g.fxT=0.6; }
  if(g.fxT>0){ g.fxT-=1/60; const p=1-g.fxT/0.6;
    if(g.state==='alert'){ ctx.strokeStyle=`rgba(184,67,58,${0.6*(1-p)})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(g.x,g.y-30,6+p*18,0,TAU); ctx.stroke(); ctx.lineWidth=1; }
  }
  if(vis && (g.state==='alert'||g.state==='curious'||g.state==='investigate')){ const bounce=Math.abs(Math.sin(gameT*9))*3;
    const mark = g.state==='alert'?'!':'?'; const col = g.state==='alert'?PAL.oxide:PAL.sodium;
    ctx.fillStyle='rgba(10,12,17,0.85)'; ctx.beginPath(); ctx.arc(g.x,g.y-34-bounce,6,0,TAU); ctx.fill(); ctx.strokeStyle=col; ctx.stroke();
    ctx.fillStyle=col; ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(mark,g.x,g.y-34-bounce); ctx.textBaseline='alphabetic'; } } }

function drawPlayer(){ const h=TIERS[player.tier].h; const lit=lightAtPx(player.x,player.y);
  const L=clamp(0.45+lit*0.6+pVis()*0.2, 0.35, 1);
  const pose=poseFor(player);
  // burglar: dark cloth, pale hands/face, sodium tool in the lead hand
  const cols={ skin:'#c7b299', cloth:'#1b2436', accent:PAL.sodium, line:'#0A0C11', hat:'#141a26', cloak:'#111826', satchel:'#5a3f26' };
  const feetY = player.y + h*0.5;
  if(player.hidden) ctx.globalAlpha=0.45;
  drawHuman(player.x, feetY, player.dir, pose, player.walkPhase, cols, L);
  ctx.globalAlpha=1;
  if(player.hidden){ ctx.fillStyle=PAL.verd; ctx.font='bold 8px monospace'; ctx.textAlign='center';
    ctx.fillText('HIDDEN', player.x, feetY-h-6); ctx.textAlign='left'; }
  // action ring above the head
  if(action){ const topY = feetY - h - 8;
    ctx.strokeStyle=PAL.sodium; ctx.lineWidth=2; ctx.beginPath();
    ctx.arc(player.x, topY, 7, -Math.PI/2, -Math.PI/2 + TAU*(action.t/action.total)); ctx.stroke(); ctx.lineWidth=1; }
}

function drawFloaters(){ ctx.textAlign='center'; ctx.font='7px monospace';
  for(const f of floaters){ ctx.globalAlpha=clamp(f.t,0,1); ctx.fillStyle=f.col; ctx.fillText(f.text,f.x,f.y); } ctx.globalAlpha=1; }

function drawHUD(){
  uiTf();
  const y0=CH-HUD_H;
  const hg=ctx.createLinearGradient(0,y0,0,CH); hg.addColorStop(0,'#0e1219'); hg.addColorStop(1,'#080a0e');
  ctx.fillStyle=hg; ctx.fillRect(0,y0,CW,HUD_H);
  ctx.strokeStyle='rgba(46,66,96,0.9)'; ctx.beginPath(); ctx.moveTo(0,y0+0.5); ctx.lineTo(CW,y0+0.5); ctx.stroke();
  ctx.fillStyle='rgba(191,203,217,0.05)'; ctx.fillRect(0,y0+1,CW,1);
  // state pill
  { const st = player.tier===2?'RUNNING':player.sneak?'SNEAKING':'WALKING'; const col= player.tier===2?PAL.sodium : player.sneak?PAL.verd:PAL.chalk;
    roundRect(16,y0+12,124,26,13); ctx.fillStyle='rgba(46,66,96,0.22)'; ctx.fill(); ctx.strokeStyle=col; ctx.globalAlpha=0.6; ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(30,y0+25,4,0,TAU); ctx.fill(); }
  // lockpick icon
  ctx.save(); ctx.translate(336,y0+26); ctx.rotate(-0.6); ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(7,0); ctx.moveTo(7,0); ctx.lineTo(9,-3); ctx.stroke(); ctx.restore();
  // coin stack icon
  for(let c=0;c<3;c++){ ctx.fillStyle=shade(PAL.sodium,0.75+c*0.1); ctx.beginPath(); ctx.ellipse(336,y0+52-c*3,6,2.4,0,0,TAU); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.stroke(); }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  // movement state
  const st = player.tier===2?'RUNNING':player.sneak?'SNEAKING':'WALKING';
  ctx.font='bold 15px monospace'; ctx.fillStyle= player.tier===2?PAL.sodium : player.sneak?PAL.verd:PAL.chalk;
  ctx.fillText(st, 40, y0+30);
  ctx.font='10px monospace'; ctx.fillStyle=PAL.draft; ctx.fillText(isTouchDevice?'left stick: move & climb':'A/D move   W/S climb', 24, y0+52);

  // light gem
  const lit=lightAtPx(player.x,player.y);
  ctx.fillStyle=mix(PAL.void,PAL.sodium,lit); ctx.beginPath(); ctx.arc(258,y0+24,10,0,TAU); ctx.fill();
  ctx.strokeStyle=PAL.draft; ctx.stroke();
  ctx.fillStyle=PAL.draft; ctx.font='10px monospace'; ctx.fillText(lit>0.5?'LIT':'SHADOW', 242, y0+52);

  // picks
  ctx.font='13px monospace'; ctx.fillStyle=PAL.chalk;
  ctx.fillText(`lockpicks  ${player.picks}`, 350, y0+30);

  // take
  ctx.fillStyle=PAL.sodium; ctx.font='bold 15px monospace'; ctx.fillText(`take  ${player.lootVal}`, 350, y0+52);

  // depth / location, right
  const depth=((player.y/T)|0)-18;
  ctx.textAlign='right'; ctx.fillStyle=PAL.draft; ctx.font='11px monospace';
  ctx.fillText(depth>0?`${depth} below ground`:'street level', CW-24, y0+30);

  // message line
  if(msgState.t>0){ ctx.globalAlpha=clamp(msgState.t,0,1); ctx.textAlign='center'; ctx.fillStyle=PAL.chalk; ctx.font='13px monospace';
    ctx.fillText(msgState.text, CW*0.66, y0+56); ctx.globalAlpha=1; }
  ctx.textAlign='left';
}

function drawExit(){
  if(!exitPx) return;
  const i=idx(clamp(exitPx.x/T|0,0,W-1), clamp(exitPx.y/T|0,0,H-1));
  if(!exploredSet.has(i)) return;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const pulse=0.6+0.4*Math.sin(gameT*2.2);
  const g=ctx.createRadialGradient(exitPx.x,exitPx.y,3, exitPx.x,exitPx.y,T*3.2);
  g.addColorStop(0,`rgba(233,162,59,${0.30*pulse})`);
  g.addColorStop(0.5,`rgba(78,156,134,${0.12*pulse})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(exitPx.x,exitPx.y,T*3.2,0,TAU); ctx.fill();
  ctx.restore();
}

function drawMotes(x0,y0,x1,y1){
  // slow drifting specks — warm above ground, cool dust below
  const groundY=18;
  ctx.save();
  for(let s=0;s<52;s++){
    const bx=(s*131.3)%(W*T), by=(s*79.7)%(H*T);
    const drift=Math.sin(gameT*0.5 + s)*6;
    const mx=bx+drift, my=by + (gameT*7 + s*40)% (H*T);
    const tx=(mx/T)|0, ty=(my/T)|0;
    if(mx<cam.x||mx>cam.x+VW||my<cam.y||my>cam.y+VH) continue;
    if(!inb(tx,ty)) continue; const ci=idx(tx,ty);
    if(!visSet.has(ci)) continue;
    if(solid(ci)) continue;
    const under=ty>groundY;
    ctx.fillStyle = under? `rgba(150,170,200,${0.08+0.06*Math.sin(gameT+s)})`
                         : `rgba(233,200,150,${0.09+0.05*Math.sin(gameT*1.3+s)})`;
    ctx.fillRect(mx, my, 1.4, 1.4);
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawLock(){
  uiTf();
  const gh=CH-HUD_H;
  // dim the scene behind
  ctx.fillStyle='rgba(6,8,12,0.55)'; ctx.fillRect(0,0,CW,gh);

  const w=560, h=300, x=(CW-w)/2, y=(gh-h)/2;
  // metallic panel
  const pg=ctx.createLinearGradient(0,y,0,y+h);
  pg.addColorStop(0,'#1b2130'); pg.addColorStop(0.5,'#12161f'); pg.addColorStop(1,'#0c0f16');
  roundRect(x,y,w,h,14); ctx.fillStyle=pg; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=PAL.draft; ctx.stroke();
  roundRect(x+5,y+5,w-10,h-10,10); ctx.strokeStyle='rgba(191,203,217,0.06)'; ctx.lineWidth=1; ctx.stroke();
  // corner rivets
  for(const [rx,ry] of [[x+16,y+16],[x+w-16,y+16],[x+16,y+h-16],[x+w-16,y+h-16]]){
    ctx.fillStyle='#2a3550'; ctx.beginPath(); ctx.arc(rx,ry,3,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(191,203,217,0.3)'; ctx.beginPath(); ctx.arc(rx-0.6,ry-0.6,1,0,TAU); ctx.fill(); }

  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=PAL.chalk; ctx.font='bold 14px monospace';
  ctx.fillText(lock.door.label.toUpperCase(), CW/2, y+34);
  ctx.fillStyle=PAL.draft; ctx.font='11px monospace';
  ctx.fillText(`pin ${Math.min(lock.cur+1,lock.pins.length)} of ${lock.pins.length}`, CW/2, y+52);

  const cx=CW/2, cy=y+h-64, R=112;
  const tension=!!keys[' ']||touch.tension;
  const ang=clamp((mouse.x/CW)*90,0,90);
  const danger=(ang<6||ang>84);
  const A0=Math.PI, A1=Math.PI*2;                 // top semicircle, left->right
  const toTheta=a=>A0 + (a/90)*(A1-A0);
  // torque: the whole cylinder twists a touch when tension is applied
  lock.torque = lerp(lock.torque||0, tension?(danger?0.06:0.05):0, 0.25);

  ctx.save(); ctx.translate(cx,cy); ctx.rotate(lock.torque);

  // cylinder face
  const cg=ctx.createRadialGradient(0,0,6, 0,0,R+16);
  cg.addColorStop(0,'#161c28'); cg.addColorStop(1,'#0b0e15');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,R+16,Math.PI,TAU); ctx.lineTo(-R-16,0); ctx.fill();
  // dial base arc
  ctx.lineCap='round';
  ctx.strokeStyle='#232c40'; ctx.lineWidth=16;
  ctx.beginPath(); ctx.arc(0,0,R,A0,A1); ctx.stroke();
  // tick marks
  ctx.strokeStyle='rgba(191,203,217,0.18)'; ctx.lineWidth=1;
  for(let a=0;a<=90;a+=7.5){ const th=toTheta(a); const r0=R-9,r1=R+9;
    ctx.beginPath(); ctx.moveTo(Math.cos(th)*r0,Math.sin(th)*r0); ctx.lineTo(Math.cos(th)*r1,Math.sin(th)*r1); ctx.stroke(); }
  // danger zones at the ends
  ctx.strokeStyle='rgba(184,67,58,0.5)'; ctx.lineWidth=16;
  ctx.beginPath(); ctx.arc(0,0,R,toTheta(0),toTheta(6)); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,R,toTheta(84),toTheta(90)); ctx.stroke();

  // pin zones
  const pulse=0.6+0.4*Math.sin(gameT*6);
  for(let i=0;i<lock.pins.length;i++){ const pn=lock.pins[i];
    const ta=toTheta(pn.c-pn.w/2), tb=toTheta(pn.c+pn.w/2), tc=toTheta(pn.c);
    if(pn.set){ ctx.strokeStyle=PAL.verd; ctx.globalAlpha=0.9; }
    else if(i===lock.cur){ ctx.strokeStyle=PAL.sodium; ctx.globalAlpha=0.35+0.4*pulse; }
    else { ctx.strokeStyle=PAL.draft; ctx.globalAlpha=0.3; }
    ctx.lineWidth=16; ctx.beginPath(); ctx.arc(0,0,R,ta,tb); ctx.stroke(); ctx.globalAlpha=1;
    // seated pin marker
    if(pn.set){ const mx=Math.cos(tc)*R, my=Math.sin(tc)*R;
      ctx.fillStyle=PAL.verd; ctx.beginPath(); ctx.arc(mx,my,4.5,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(233,255,240,0.8)'; ctx.beginPath(); ctx.arc(mx,my,2,0,TAU); ctx.fill(); }
  }

  // the pick needle
  const th=toTheta(ang);
  const tipx=Math.cos(th)*R, tipy=Math.sin(th)*R;
  const inZone = lock.cur<lock.pins.length && Math.abs(ang-lock.pins[lock.cur].c) < lock.pins[lock.cur].w/2;
  const needleCol = danger?PAL.oxide : (inZone&&tension)?PAL.verd : PAL.chalk;
  ctx.strokeStyle='#0A0C11'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(tipx,tipy); ctx.stroke();
  ctx.strokeStyle=needleCol; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(tipx*0.98,tipy*0.98); ctx.stroke();
  // glowing tip + progress ring while seating
  const glow=ctx.createRadialGradient(tipx,tipy,0, tipx,tipy,14);
  glow.addColorStop(0, needleCol); glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.6; ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(tipx,tipy,14,0,TAU); ctx.fill(); ctx.globalAlpha=1;
  if(inZone && tension && lock.prog>0){ ctx.strokeStyle=PAL.verd; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(tipx,tipy,10,-Math.PI/2,-Math.PI/2+TAU*clamp(lock.prog/0.5,0,1)); ctx.stroke(); }
  // hub
  ctx.fillStyle='#2a3550'; ctx.beginPath(); ctx.arc(0,0,7,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(191,203,217,0.35)'; ctx.beginPath(); ctx.arc(-1.5,-1.5,2.5,0,TAU); ctx.fill();
  ctx.restore();
  ctx.lineWidth=1; ctx.lineCap='butt';

  // cutaway of the lock itself (right side): plug, shear line, pin stacks
  { const cx2=x+w-118, cy2=y+120, pw=88, ph=60; ctx.fillStyle='#0c0f16'; ctx.fillRect(cx2,cy2,pw,ph); ctx.strokeStyle=PAL.draft; ctx.strokeRect(cx2+0.5,cy2+0.5,pw-1,ph-1);
    ctx.fillStyle='#232c40'; ctx.fillRect(cx2+4,cy2+30,pw-8,24);                     // plug
    ctx.strokeStyle='rgba(233,162,59,0.7)'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(cx2+4,cy2+30.5); ctx.lineTo(cx2+pw-4,cy2+30.5); ctx.stroke(); ctx.setLineDash([]);
    const n=lock.pins.length, gap=(pw-16)/n;
    for(let i=0;i<n;i++){ const pn=lock.pins[i], px2=cx2+8+gap*i+gap/2-3;
      const near = i===lock.cur ? clamp(1-Math.abs(ang-pn.c)/(pn.w/2),0,1) : 0;
      const lift = pn.set ? 14 : (i===lock.cur && tension ? near*10 + Math.sin(gameT*20)*near*1.5 : 0);
      ctx.fillStyle='#3a4258'; ctx.fillRect(px2,cy2+6,6,20-lift*0.4);                  // spring + driver pin
      ctx.fillStyle=pn.set?PAL.verd:(i===lock.cur?PAL.sodium:'#8a94a8'); ctx.fillRect(px2,cy2+31-lift,6,16); // key pin
      if(pn.set){ ctx.fillStyle='rgba(78,156,134,0.35)'; ctx.fillRect(px2-1,cy2+28,8,3); } }
    // the pick from below, tip under the current pin
    if(lock.cur<n){ const tp=cx2+8+gap*lock.cur+gap/2, tx2=cx2+8+(ang/90)*(pw-16); ctx.strokeStyle=needleCol; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx2+pw+6,cy2+52); ctx.lineTo(tx2,cy2+49); ctx.lineTo(tx2,cy2+46); ctx.stroke(); ctx.lineWidth=1; }
    ctx.fillStyle=PAL.draft; ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillText('cutaway', cx2+pw/2, cy2+ph+11); }
  // seated-pin pips
  const dotN=lock.pins.length, dw=14, tot=dotN*dw, dx0=CW/2-tot/2+dw/2;
  for(let i=0;i<dotN;i++){ ctx.fillStyle=lock.pins[i].set?PAL.verd:'rgba(120,130,150,0.3)';
    ctx.beginPath(); ctx.arc(dx0+i*dw, y+h-26, 4, 0, TAU); ctx.fill(); }

  // tension prompt
  ctx.fillStyle=tension?PAL.verd:PAL.sodium; ctx.font='11px monospace';
  ctx.fillText(tension?'\u25CF TENSION HELD — sweep to each pin':(touch.used?'hold TENSION and sweep':'hold SPACE and move the pick'), CW/2, y+h-8);
}

function drawTouchUI(){
  if(!touch.used) return;
  uiTf();
  // fixed thumbstick (only during play, not while picking a lock)
  if(mode==='play' && !lock){
    const active=touch.stickId!=null;
    // base ring
    ctx.globalAlpha=active?0.28:0.20; ctx.fillStyle=PAL.draft;
    ctx.beginPath(); ctx.arc(STICK.x,STICK.y,STICK.r,0,TAU); ctx.fill();
    ctx.globalAlpha=active?0.8:0.55; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(STICK.x,STICK.y,STICK.r,0,TAU); ctx.stroke();
    // faint direction ticks
    ctx.globalAlpha=0.3; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=1.5;
    for(let a=0;a<4;a++){ const th=a*Math.PI/2; const r0=STICK.r-12,r1=STICK.r-4;
      ctx.beginPath(); ctx.moveTo(STICK.x+Math.cos(th)*r0,STICK.y+Math.sin(th)*r0);
      ctx.lineTo(STICK.x+Math.cos(th)*r1,STICK.y+Math.sin(th)*r1); ctx.stroke(); }
    // nub
    const nx=touch.nub[0], ny=touch.nub[1];
    ctx.globalAlpha=active?0.55:0.4; ctx.fillStyle=active?PAL.verd:PAL.draft;
    ctx.beginPath(); ctx.arc(nx,ny,STICK.nub,0,TAU); ctx.fill();
    ctx.globalAlpha=active?1:0.7; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(nx,ny,STICK.nub,0,TAU); ctx.stroke();
    ctx.globalAlpha=1; ctx.lineWidth=1;
  }
  // action buttons
  for(const b of touchButtons){
    const held=[...touch.holds.values()].includes(b.k)||(b.k==='tension'&&touch.tension)||(b.k==='sneak'&&player&&player.sneak);
    ctx.globalAlpha=held?0.5:0.24; ctx.fillStyle=held?PAL.verd:PAL.draft; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
    ctx.globalAlpha=held?0.95:0.65; ctx.strokeStyle=PAL.chalk; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.stroke();
    ctx.fillStyle=PAL.chalk; ctx.font=(b.big?'bold 18px':'bold 13px')+' monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.label,b.x,b.y);
    ctx.globalAlpha=1; ctx.lineWidth=1; }
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
}

// title buttons (shared by draw + hit-testing)
function titleButtons(){
  const bw=270, bh=58, gap=34, y=CH-HUD_H-66;
  return [ {k:'play', x:CW/2-bw-gap/2, y, w:bw, h:bh, label:isTouchDevice?'BEGIN THE NIGHT':'BEGIN THE NIGHT', sub:isTouchDevice?'tap':'ENTER', col:PAL.sodium},

}
function titleHit(cx,cy){ for(const b of titleButtons()) if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h) return b.k; return null; }

function drawTitleHouse(cx,cy){

// ============================================================
// DEMO MODE — an autopilot plays the winning route through the real engine,
// with captions explaining how to beat each challenge. Press D / tap DEMO on the title.
// ============================================================
let demo=null;
function playing(){ return mode==='play' || mode==='demo'; }
function startDemo(lv){
  level=lv; introLevel=-1; resetRun(); mode='demo';
  demo={ lv, steps:buildDemo(lv), i:0, cap:'', capT:0, retryT:0, doneT:0, msg:'' };
}
function stopDemo(){ demo=null; level=prog.level; resetRun(); mode='title'; }
function demoEscaped(){
  if(demo.lv+1<LEVELS){ demo.msg=`${LEVEL_INFO[demo.lv].name} \u2014 cleared. On to the next job\u2026`; demo.doneT=2.6; demo.next=demo.lv+1; }
  else { demo.msg='Every job cleared. That\u2019s how it\u2019s done \u2014 quietly.'; demo.doneT=3.2; demo.next=-1; }
  demo.i=demo.steps.length;                    // stop scripting; the finish timer takes over
}
function demoTick(dt){
  for(const k of ['a','d','w','s',' ','e']) keys[k]=false;     // autopilot re-asserts inputs each frame
  if(demo.doneT>0){ demo.doneT-=dt; if(demo.doneT<=0){ if(demo.next>=0) startDemo(demo.next); else stopDemo(); } return; }
  if(demo.i>=demo.steps.length) return;
  const st=demo.steps[demo.i];
  if(st.cap && demo.cap!==st.cap){ demo.cap=st.cap; demo.capT=0; }
  demo.capT+=dt;
  if(st.run(dt)){ demo.i++; }
}
// step primitives (return true when finished)
const D={
  say:(cap,hold=1.6)=>({cap,t:0,run(dt){ this.t+=dt; return this.t>=hold; }}),
  goTo:(tx,cap,opt={})=>({cap,run(){ const target=tx*T, dx=target-player.x;   // tx = position in tiles
    if(Math.abs(dx)<3){ player.vx=0; return true; } keys[dx>0?'d':'a']=true; if(opt.run) keys[' ']=true; return false; }}),
  sneak:(on,cap)=>({cap,run(){ if(player.sneak!==on) handlePress('sneak'); return true; }}),
  face:(dir)=>({run(){ player.dir=dir; return true; }}),
  act:(cap)=>({cap,started:false,run(){
    if(!this.started){ this.started=true; tryInteract(); return false; }
    if(lock){ const pn=lock.pins[lock.cur]; if(pn){ mouse.x=(pn.c/90)*CW; keys[' ']=true; } return false; }
    if(action){ keys['e']=true; return false; }
    return true; }}),
  waitFor:(fn,cap)=>({cap,run(){ return !!fn(); }}),
  wait:(sec,cap)=>({cap,t:0,run(dt){ this.t+=dt; return this.t>=sec; }}),
  climb:(dir,toRow,cap)=>({cap,run(){ const row=(player.y/T)|0; if(dir<0? row<=toRow : row>=toRow) return true;
    keys[dir<0?'w':'s']=true; return false; }}),
  // wait for a full pass: guard first heads the OTHER way (turns/back), then comes past xAfter heading `dir`
  waitPass:(g,dir,xAfter,cap)=>({cap,ph:0,run(){ const x=g.x/T;
    if(this.ph===0){ if(g.dir===-dir) this.ph=1; return false; }
    return g.dir===dir && (dir>0 ? x>xAfter : x<xAfter); }}),
  digDown:(toRow,cap)=>({cap,run(){ const row=(player.y/T)|0; if(row>=toRow) return true;
    if(action){ keys['e']=true; return false; }
    if(!player.onGround && !player.climbing) return false;      // let the drop finish
    keys['s']=true; tryInteract(); return false; }}),
};
const G=name=>guards.find(g=>g.id===name);
const gx=g=>g.x/T;

    D.goTo(16.5,'Leapfrog to the crate \u2014 SNEAKING. Footsteps carry; a sneak is silent, and he\u2019s faster, so you never catch him up.'),

    D.goTo(20.5,'Next hide: the grandfather clock. Still sneaking.'),

    D.act('Four pins, same rhythm: tension, sweep, listen for the click.'),

// ============================================================
// Boot
// ============================================================
function boot(){
  canvas = document.getElementById('g');
  ctx = canvas.getContext('2d');
  DPR = Math.max(1, Math.min(3, (typeof window!=='undefined' && window.devicePixelRatio) || 1));
  canvas.width = Math.round(CW*DPR); canvas.height = Math.round(CH*DPR);   // crisp vector lines on retina/iPhone
  try{ if(document.createElement){ const g=document.createElement('canvas'); g.width=256; g.height=256; const gc=g.getContext('2d');
    const img=gc.createImageData(256,256); for(let i=0;i<img.data.length;i+=4){ const v=Math.random()*255; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255; } gc.putImageData(img,0,0); grain=g; } }catch(e){ grain=null; }
  touch.used = isTouchDevice;            // show the D-pad right away on phones/tablets
  load(); level = prog.level;            // resume where the player left off
  resetRun(); mode='title';
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  canvas.addEventListener('wheel', onWheel, { passive:false });
  canvas.addEventListener('touchstart', onTouchStart, { passive:false });
  canvas.addEventListener('touchmove', onTouchMove, { passive:false });
  canvas.addEventListener('touchend', onTouchEnd, { passive:false });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive:false });
  canvas.addEventListener('contextmenu', e=>e.preventDefault&&e.preventDefault());
  canvas.addEventListener('mousemove', e=>{ const r=canvas.getBoundingClientRect(); mouse.x=(e.clientX-r.left)*(CW/r.width); mouse.y=(e.clientY-r.top)*(CH/r.height); });
  canvas.addEventListener('mousedown', (e)=>{ ac(); if(demo){ stopDemo(); return; } if(mode==='title'){ const [cx,cy]=canvasXY(e); if(titleHit(cx,cy)==='demo') startDemo(0); else mode='play'; } else if(mode==='caught'||mode==='escaped'){ nextAfterEnd(); } });
  // When the device rotates or the window resizes, any in-progress joystick anchor
  // (stored in canvas pixels) becomes stale and movement directions can go haywire.
  // Drop all live input so the player starts clean in the new layout.
  const clearInput=()=>{ for(const k in keys) keys[k]=false;
    touch.stickId=null; touch.vec=[0,0]; touch.nub=[STICK.x,STICK.y]; touch.tension=false; touch.pickId=null; touch.holds.clear();
    if(player) player.vx=0; };
  if(typeof window!=='undefined' && window.addEventListener){
    window.addEventListener('resize', clearInput);
    window.addEventListener('orientationchange', clearInput);
  }
  if(typeof screen!=='undefined' && screen.orientation && screen.orientation.addEventListener)
    screen.orientation.addEventListener('change', clearInput);
  let last=performance.now();
  function frame(now){ let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; if(!(dt>=0)) dt=0; step(dt); render(); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}

if(typeof window!=='undefined'){
  window.SPOIL = {
    boot, step, resetRun,
    get player(){ return player; }, get guards(){ return guards; }, get mode(){ return mode; }, set mode(v){ mode=v; },
    get grid(){ return grid; }, get mat(){ return mat; }, get dug(){ return dug; }, get action(){ return action; },
    get floorType(){ return floorType; }, get lightmap(){ return lightmap; },
    get stats(){ return stats; }, get lock(){ return lock; }, set lock(v){ lock=v; },
    get doors(){ return doors; }, get loot(){ return loot; }, get ropes(){ return ropes; },
    keys, mouse, touch, tryInteract, startAction, emitSound, handlePress,
    onTouchStart, onTouchMove, onTouchEnd, buildTouchButtons, get touchButtons(){ return touchButtons; },
    idx, W, H, T, CW, CH, VW, VH, HUD_H,
    get level(){ return level; }, set level(v){ level=v; }, get LEVELS(){ return LEVELS; },
    get hideCells(){ return hideCells; }, get decor(){ return decor; }, get visSet(){ return visSet; }, get exploredSet(){ return exploredSet; },
    startDemo, stopDemo, get demo(){ return demo; },
  };
  if(typeof document!=='undefined' && document.getElementById && document.getElementById('g')) boot();
  else if(typeof document!=='undefined' && document.addEventListener) document.addEventListener('DOMContentLoaded', boot);
}
